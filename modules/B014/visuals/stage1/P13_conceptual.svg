<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">NATURE DOES NOT GIVE A SAFE BEARING</title><rect width="760" height="400" rx="16" fill="#f8f7f0"/><rect x="12" y="12" width="736" height="376" rx="12" fill="#eef2e9" stroke="#adc2af" stroke-width="2"/><text x="36" y="50" fill="#153e32" font-family="Arial,sans-serif" font-weight="bold" text-anchor="start" font-size="22">NO-COMPASS ORIENTATION / LIMITS</text><rect x="42" y="108" width="213" height="134" rx="8" fill="#fffaf1" stroke="#a3baab" stroke-width="2"/><text x="148" y="156" fill="#264938" font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle" font-size="22">MOSS</text><text x="148" y="192" fill="#9b4033" font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle" font-size="17">not a compass</text><rect x="277" y="108" width="213" height="134" rx="8" fill="#fffaf1" stroke="#a3baab" stroke-width="2"/><text x="383" y="156" fill="#264938" font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle" font-size="22">STREAM</text><text x="383" y="192" fill="#9b4033" font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle" font-size="17">not a highway</text><rect x="512" y="108" width="213" height="134" rx="8" fill="#fffaf1" stroke="#a3baab" stroke-width="2"/><text x="618" y="156" fill="#264938" font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle" font-size="22">SHADOW</text><text x="618" y="192" fill="#9b4033" font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle" font-size="17">one clue is weak</text><text x="380" y="294" fill="#163e32" font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle" font-size="21">Safe default: verified landmark or stop + signal</text><rect x="22" y="350" width="716" height="30" rx="5" fill="#143e32"/><text x="380" y="371" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13" font-weight="bold">CONCEPTUAL TRAINING DIAGRAM · NOT A REAL ROUTE OR SAFE-ICE ASSESSMENT</text></svg>