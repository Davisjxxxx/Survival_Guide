<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">IF A CHILD OR PARTNER DISAPPEARS</title><rect width="760" height="400" rx="16" fill="#f8f7f0"/><rect x="12" y="12" width="736" height="376" rx="12" fill="#eef2e9" stroke="#adc2af" stroke-width="2"/><text x="36" y="50" fill="#153e32" font-family="Arial,sans-serif" font-weight="bold" text-anchor="start" font-size="22">GROUP ACCOUNTABILITY / HUG-A-TREE</text><rect x="40" y="105" width="308" height="175" rx="8" fill="#e0eddf" stroke="#a3baab" stroke-width="2"/><text x="194" y="142" fill="#185039" font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle" font-size="22">SEARCH PARTY</text><text x="194" y="181" fill="#1f503c" font-family="Arial,sans-serif" font-weight="normal" text-anchor="middle" font-size="19">stay together</text><text x="194" y="210" fill="#1f503c" font-family="Arial,sans-serif" font-weight="normal" text-anchor="middle" font-size="19">call 911</text><rect x="413" y="105" width="306" height="175" rx="8" fill="#fff5db" stroke="#a3baab" stroke-width="2"/><text x="565" y="142" fill="#81532a" font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle" font-size="22">LOST CHILD</text><text x="565" y="181" fill="#7e572c" font-family="Arial,sans-serif" font-weight="normal" text-anchor="middle" font-size="19">Hug a Tree</text><text x="565" y="210" fill="#7e572c" font-family="Arial,sans-serif" font-weight="normal" text-anchor="middle" font-size="19">stay + signal</text><text x="382" y="315" fill="#963f32" font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle" font-size="19">Do not spread the group into an uncoordinated search</text><rect x="22" y="350" width="716" height="30" rx="5" fill="#143e32"/><text x="380" y="371" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13" font-weight="bold">CONCEPTUAL TRAINING DIAGRAM · NOT A REAL ROUTE OR SAFE-ICE ASSESSMENT</text></svg>