<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">TWO NORTHS, ONE UNVERIFIED NUMBER</title><rect width="760" height="400" rx="16" fill="#f8f7f0"/><rect x="12" y="12" width="736" height="376" rx="12" fill="#eef2e9" stroke="#adc2af" stroke-width="2"/><text x="36" y="50" fill="#153e32" font-family="Arial,sans-serif" font-weight="bold" text-anchor="start" font-size="22">COMPASS / TRUE NORTH / DECLINATION</text><circle cx="282" cy="219" r="120" fill="#fbfcf8" stroke="#658a77" stroke-width="4"/><line x1="282" y1="219" x2="282" y2="101" stroke="#2d765b" stroke-width="8"/><line x1="282" y1="219" x2="349" y2="128" stroke="#b76935" stroke-width="8"/><text x="272" y="92" fill="#236a50" font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle" font-size="19">TRUE N</text><text x="398" y="122" fill="#9d532e" font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle" font-size="17">MAGNETIC N</text><text x="520" y="179" fill="#1b4739" font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle" font-size="25">DECLINATION</text><text x="520" y="213" fill="#24483a" font-family="Arial,sans-serif" font-weight="normal" text-anchor="middle" font-size="19">Varies by place</text><text x="520" y="241" fill="#24483a" font-family="Arial,sans-serif" font-weight="normal" text-anchor="middle" font-size="19">and date</text><text x="380" y="321" fill="#913e35" font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle" font-size="15">No angle or bearing is specified in this schematic</text><rect x="22" y="350" width="716" height="30" rx="5" fill="#143e32"/><text x="380" y="371" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13" font-weight="bold">CONCEPTUAL TRAINING DIAGRAM · NOT A REAL ROUTE OR SAFE-ICE ASSESSMENT</text></svg>