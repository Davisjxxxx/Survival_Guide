<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">THE LAST LIGHT DECISION</title><rect width="760" height="400" rx="16" fill="#f8f7f0"/><rect x="12" y="12" width="736" height="376" rx="12" fill="#eef2e9" stroke="#adc2af" stroke-width="2"/><text x="36" y="50" fill="#153e32" font-family="Arial,sans-serif" font-weight="bold" text-anchor="start" font-size="22">OVERNIGHT / EXPOSURE CHOICE</text><rect x="45" y="110" width="670" height="170" rx="8" fill="#fdfbf5" stroke="#a3baab" stroke-width="2"/><path d="M70 182 H688" stroke="#b8ad86" stroke-width="8"/><circle cx="115" cy="182" r="18" fill="#4e8b68"/><text x="115" y="152" fill="#274735" font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle" font-size="17">KNOWN LIGHT</text><circle cx="367" cy="182" r="18" fill="#d19e57"/><text x="367" y="152" fill="#274735" font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle" font-size="17">FADING</text><circle cx="620" cy="182" r="18" fill="#8f665a"/><text x="620" y="152" fill="#274735" font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle" font-size="17">DARK</text><text x="381" y="239" fill="#9b3d31" font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle" font-size="20">Do not begin an uncertain detour as light fades</text><rect x="22" y="350" width="716" height="30" rx="5" fill="#143e32"/><text x="380" y="371" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13" font-weight="bold">CONCEPTUAL TRAINING DIAGRAM · NOT A REAL ROUTE OR SAFE-ICE ASSESSMENT</text></svg>