<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">B012 P22: Snow to drinking water requires four distinct stages</title>
  <desc id="desc">Original non-diagnostic conceptual diagram: assess source, melt snow, treat microbial contaminants appropriately, then store treated water separately. Boiling does not remove fuel or chemical contamination.</desc>
  <metadata>Research reference: https://www.cdc.gov/water-emergency/about/index.html ; review draft, not field tested.</metadata>
  <defs>
    <style>
      .h{font:700 46px system-ui,sans-serif;fill:#f8f4e9}
      .sub{font:20px system-ui,sans-serif;fill:#d8e4dc}
      .num{font:700 19px system-ui,sans-serif;fill:#46654e;letter-spacing:2px}
      .topic{font:700 33px system-ui,sans-serif;fill:#1d412f}
      .body{font:20px system-ui,sans-serif;fill:#314b3a}
      .caution{font:700 24px system-ui,sans-serif;fill:#83392a}
      .caution2{font:19px system-ui,sans-serif;fill:#673c2e}
      .footer{font:16px system-ui,sans-serif;fill:#4f6657}
      .line{stroke:#466b54;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#466b54" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="1400" height="780" fill="#f9f5eb"/>
  <rect width="1400" height="150" fill="#173d2c"/>
  <text class="h" x="54" y="69">SNOW IS NOT YET SAFE DRINKING WATER</text>
  <text class="sub" x="54" y="114">B012 / P22 • Four independent stages • Conceptual editorial diagram</text>
  <g>
    <rect x="48" y="200" rx="16" width="300" height="355" fill="#ecf0e7" stroke="#abc1ad" stroke-width="2"/>
    <rect x="385" y="200" rx="16" width="300" height="355" fill="#ecf0e7" stroke="#abc1ad" stroke-width="2"/>
    <rect x="722" y="200" rx="16" width="300" height="355" fill="#ecf0e7" stroke="#abc1ad" stroke-width="2"/>
    <rect x="1059" y="200" rx="16" width="293" height="355" fill="#ecf0e7" stroke="#abc1ad" stroke-width="2"/>
    <path d="M350 374 H377 M687 374 H714 M1024 374 H1051" stroke="#466b54" stroke-width="4" marker-end="url(#ar)"/>
  </g>
  <text class="num" x="72" y="243">01 / ASSESS</text>
  <text class="topic" x="72" y="289">SOURCE</text>
  <path class="line" d="M117 384 L177 325 L237 384 M132 369 H222 M157 397 L163 410 L169 397 M187 411 L193 424 L199 411"/>
  <text class="body" x="72" y="469">Avoid road runoff, fuel,</text>
  <text class="body" x="72" y="500">waste and suspect snow.</text>
  <text class="num" x="410" y="243">02 / PHASE CHANGE</text>
  <text class="topic" x="410" y="289">MELT</text>
  <path d="M463 326 H613 L590 422 H485 Z" class="line"/>
  <path d="M504 446 C490 432 490 422 504 408 M540 446 C526 432 526 422 540 408 M576 446 C562 432 562 422 576 408" class="line" stroke-width="4"/>
  <text class="body" x="410" y="469">Melting removes ice,</text>
  <text class="body" x="410" y="500">not germs or toxins.</text>
  <text class="num" x="748" y="243">03 / MICROBIAL RISK</text>
  <text class="topic" x="748" y="289">TREAT</text>
  <path d="M798 328 H943 L919 414 H822 Z M811 328 H931" class="line"/>
  <path d="M831 440 C820 426 820 416 831 403 M869 440 C858 426 858 416 869 403 M905 440 C894 426 894 416 905 403" class="line" stroke-width="4"/>
  <text class="body" x="748" y="468">Clear water: rolling boil</text>
  <text class="body" x="748" y="497">1 min; 3 min above</text>
  <text class="body" x="748" y="522">6,500 ft elevation.</text>
  <text class="num" x="1084" y="243">04 / PREVENT RECONTAMINATION</text>
  <text class="topic" x="1084" y="289">STORE</text>
  <path class="line" d="M1139 337 H1277 M1151 337 V427 Q1208 451 1265 427 V337 M1163 320 H1254"/>
  <text class="body" x="1084" y="469">Cool and cover in a</text>
  <text class="body" x="1084" y="498">clean container. Keep</text>
  <text class="body" x="1084" y="526">raw water separate.</text>
  <rect x="48" y="590" rx="13" width="1304" height="100" fill="#fae8dc" stroke="#b96756" stroke-width="2"/>
  <text class="caution" x="77" y="627">STOP: Suspected chemical, fuel or radioactive contamination</text>
  <text class="caution2" x="77" y="662">Boiling or disinfecting will not make that water safe. Find a different source.</text>
  <text class="footer" x="51" y="730">Original editable vector • CDC-aligned editorial review draft • Source and water-safety specialist approval pending</text>
  <text class="footer" x="51" y="757">SURVIVAL FIELD ENCYCLOPEDIA / B012 / 2026-11-23</text>
</svg>
