<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="Ice emergency: 911, safe-ground rescue, self-rescue if immersed, prevent heat loss" width="820" height="390"><defs><linearGradient id="sky" x2="0" y2="1"><stop offset="0" stop-color="#e3eff5"/><stop offset="1" stop-color="#f9fbf8"/></linearGradient><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#c2d9e2" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="820" height="390" rx="14" fill="url(#sky)"/><text x="26" y="48" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">ICE EMERGENCY: DO THE NEXT SAFE ACTION</text><rect x="25" y="86" width="247" height="240" rx="13" fill="#e7f0ea" stroke="#a7bbb3" stroke-width="2"/><circle cx="150" cy="137" r="34" fill="#163f30"/><text x="150" y="149" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" text-anchor="middle">1</text><text x="149" y="204" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" text-anchor="middle">WITNESS</text><text x="149" y="240" fill="#ad5037" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" text-anchor="middle">CALL 911</text><text x="149" y="274" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle">Give lake + access point</text><path d="M279 201l13 0m-8 -7l8 7 -8 7" stroke="#163f30" stroke-width="3" fill="none"/><rect x="294" y="86" width="247" height="240" rx="13" fill="#eaf2f6" stroke="#a7bbb3" stroke-width="2"/><circle cx="419" cy="137" r="34" fill="#21475a"/><text x="419" y="149" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" text-anchor="middle">2</text><text x="418" y="204" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" text-anchor="middle">IN THE WATER</text><text x="418" y="240" fill="#ad5037" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" text-anchor="middle">TURN + KICK</text><text x="418" y="274" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle">Exit toward your entry</text><path d="M548 201l13 0m-8 -7l8 7 -8 7" stroke="#163f30" stroke-width="3" fill="none"/><rect x="563" y="86" width="247" height="240" rx="13" fill="#f9ede3" stroke="#a7bbb3" stroke-width="2"/><circle cx="688" cy="137" r="34" fill="#163f30"/><text x="688" y="149" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" text-anchor="middle">3</text><text x="687" y="204" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" text-anchor="middle">AFTER EXIT</text><text x="687" y="240" fill="#ad5037" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" text-anchor="middle">GET WARM</text><text x="687" y="274" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle">Get medical assessment</text><text x="26" y="364" fill="#ad5037" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">STAY OUT OF WEAK ICE • NO UNTRAINED ICE-EDGE RESCUE</text></svg>