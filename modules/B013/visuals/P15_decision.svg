<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="Three-stage decision route for Minnesota ice angling" width="820" height="390"><defs><linearGradient id="sky" x2="0" y2="1"><stop offset="0" stop-color="#e3eff5"/><stop offset="1" stop-color="#f9fbf8"/></linearGradient><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#c2d9e2" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="820" height="390" rx="14" fill="url(#sky)"/><text x="28" y="45" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start">IF FISHING REQUIRES CROSSING FROZEN WATER</text><rect x="27" y="74" width="766" height="78" rx="10" fill="#f7ece3" stroke="#9eaea4"/><text x="45" y="106" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" text-anchor="start">NO GEAR</text><text x="265" y="108" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Turn back; stay on land.</text><rect x="27" y="165" width="766" height="78" rx="10" fill="#f3f5e8" stroke="#9eaea4"/><text x="45" y="197" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" text-anchor="start">IMPROVISED</text><text x="265" y="199" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Only lawful open-water shore fishing.</text><rect x="27" y="256" width="766" height="78" rx="10" fill="#e1edeb" stroke="#9eaea4"/><text x="45" y="288" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" text-anchor="start">EQUIPPED</text><text x="265" y="290" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Plan, verify, measure; still no guarantee.</text><text x="30" y="369" fill="#ad5037" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start">Ice angling is optional: survival priorities always come first.</text></svg>