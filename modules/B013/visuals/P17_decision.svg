<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="Decision tree for false evidence about safe ice" width="820" height="390"><defs><linearGradient id="sky" x2="0" y2="1"><stop offset="0" stop-color="#e3eff5"/><stop offset="1" stop-color="#f9fbf8"/></linearGradient><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#c2d9e2" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="820" height="390" rx="14" fill="url(#sky)"/><text x="26" y="49" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start">ANY UNKNOWN OR CONFLICTING SIGNAL?</text><rect x="258" y="80" width="304" height="68" rx="14" fill="#21475a"/><text x="410" y="121" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" text-anchor="middle">DO NOT ENTER</text><path d="M410 148V182M410 182H175M410 182H650M175 182V212M650 182V212" stroke="#679b8d" stroke-width="5" fill="none"/><rect x="34" y="211" width="300" height="89" rx="10" fill="#f3e8de" stroke="#ae715d"/><text x="184" y="245" fill="#ad5037" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" text-anchor="middle">LAND DETOUR</text><text x="184" y="276" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle">Avoid the uncertain surface</text><rect x="484" y="211" width="300" height="89" rx="10" fill="#e4f0e7" stroke="#7eaa90"/><text x="634" y="245" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" text-anchor="middle">WAIT / CALL FOR HELP</text><text x="634" y="276" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle">Do not self-clear conditions</text><text x="26" y="353" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" text-anchor="start">Presence of other people or equipmen