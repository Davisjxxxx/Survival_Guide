<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="Ice emergency route: witness calls 911, immersion escape, warmth and medical care" width="820" height="390"><defs><linearGradient id="sky" x2="0" y2="1"><stop offset="0" stop-color="#e3eff5"/><stop offset="1" stop-color="#f9fbf8"/></linearGradient><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#c2d9e2" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="820" height="390" rx="14" fill="url(#sky)"/><text x="27" y="47" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">EMERGENCY SEQUENCE</text><rect x="24" y="104" width="179" height="185" rx="13" fill="#dcece3" stroke="#a8beb5" stroke-width="2"/><text x="114" y="155" fill="#ad5037" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="800" text-anchor="middle">01</text><text x="114" y="202" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" text-anchor="middle">CALL</text><text x="114" y="242" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" text-anchor="middle">911 + exact place</text><path d="M204 194l19 0m-8 -8l8 8 -8 8" stroke="#163f30" stroke-width="3" fill="none"/><rect x="228" y="104" width="179" height="185" rx="13" fill="#e9f1e8" stroke="#a8beb5" stroke-width="2"/><text x="318" y="155" fill="#ad5037" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="800" text-anchor="middle">02</text><text x="318" y="202" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" text-anchor="middle">STAY</text><text x="318" y="242" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" text-anchor="middle">On stable ground</text><path d="M408 194l19 0m-8 -8l8 8 -8 8" stroke="#163f30" stroke-width="3" fill="none"/><rect x="432" y="104" width="179" height="185" rx="13" fill="#dce9f1" stroke="#a8beb5" stroke-width="2"/><text x="522" y="155" fill="#ad5037" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="800" text-anchor="middle">03</text><text x="522" y="202" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" text-anchor="middle">ESCAPE</text><text x="522" y="242" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" text-anchor="middle">Turn back and kick</text><path d="M612 194l19 0m-8 -8l8 8 -8 8" stroke="#163f30" stroke-width="3" fill="none"/><rect x="636" y="104" width="179" height="185" rx="13" fill="#f7e7df" stroke="#a8beb5" stroke-width="2"/><text x="726" y="155" fill="#ad5037" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="800" text-anchor="middle">04</text><text x="726" y="202" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" text-anchor="middle">WARM</text><text x="726" y="242" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" text-anchor="middle">Shelter + medical help</text><text x="27" y="350" fill="#ad5037" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">Untrained rescuers must not become additional victims.</text></svg>