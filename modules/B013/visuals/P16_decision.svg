<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="Limits of equipment-free fishing through lake ice: no approved safe hole-making approach" width="820" height="390"><defs><linearGradient id="sky" x2="0" y2="1"><stop offset="0" stop-color="#e3eff5"/><stop offset="1" stop-color="#f9fbf8"/></linearGradient><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#c2d9e2" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="820" height="390" rx="14" fill="url(#sky)"/><text x="26" y="46" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start">TOOL-FREE LIMITS: DO NOT SUBSTITUTE RISK</text><rect x="30" y="74" width="367" height="115" rx="12" fill="#fff" stroke="#b7c9c2" stroke-width="2"/><text x="47" y="110" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" text-anchor="start">INTACT ICE</text><text x="47" y="144" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">You cannot fish through intact ice.</text><rect x="414" y="74" width="367" height="115" rx="12" fill="#fff" stroke="#b7c9c2" stroke-width="2"/><text x="431" y="110" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" text-anchor="start">NO VERIFIED ROUTE</text><text x="431" y="144" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Do not step onto the ice to explore.</text><rect x="30" y="204" width="367" height="115" rx="12" fill="#fff" stroke="#b7c9c2" stroke-width="2"/><text x="47" y="240" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" text-anchor="start">NO ICE-CUTTING TOOL</text><text x="47" y="274" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Do not chip, burn, stomp or smash a hole.</text><rect x="414" y="204" width="367" height="115" rx="12" fill="#fff" stroke="#b7c9c2" stroke-width="2"/><text x="431" y="240" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" text-anchor="start">SURVIVAL NEED</text><text x="431" y="274" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Choose shelter, warmth and rescue signaling.</text></svg>