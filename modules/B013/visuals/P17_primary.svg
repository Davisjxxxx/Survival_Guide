<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="Six misleading signs of unsafe Minnesota lake ice" width="820" height="390"><defs><linearGradient id="sky" x2="0" y2="1"><stop offset="0" stop-color="#e3eff5"/><stop offset="1" stop-color="#f9fbf8"/></linearGradient><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#c2d9e2" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="820" height="390" rx="14" fill="url(#sky)"/><text x="26" y="45" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">WHAT PEOPLE MISTAKE FOR ICE SAFETY</text><rect x="22" y="73" width="252" height="138" rx="13" fill="#ffffff" stroke="#a8c0ba" stroke-width="2"/><circle cx="52" cy="103" r="20" fill="#f4e0d4"/><text x="52" y="110" fill="#ad5037" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" text-anchor="middle">!</text><text x="80" y="109" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">TRACKS</text><text x="40" y="153" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start">Old crossings prove</text><text x="40" y="178" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start">nothing.</text><rect x="289" y="73" width="252" height="138" rx="13" fill="#ffffff" stroke="#a8c0ba" stroke-width="2"/><circle cx="319" cy="103" r="20" fill="#f4e0d4"/><text x="319" y="110" fill="#ad5037" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" text-anchor="middle">!</text><text x="347" y="109" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">COLD NIGHT</text><text x="307" y="153" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start">Thaw and current still</text><text x="307" y="178" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start">matter.</text><rect x="556" y="73" width="252" height="138" rx="13" fill="#ffffff" stroke="#a8c0ba" stroke-width="2"/><circle cx="586" cy="103" r="20" fill="#f4e0d4"/><text x="586" y="110" fill="#ad5037" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" text-anchor="middle">!</text><text x="614" y="109" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">ONE HOLE</text><text x="574" y="153" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start">Strength varies along a</text><text x="574" y="178" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start">route.</text><rect x="22" y="224" width="252" height="138" rx="13" fill="#ffffff" stroke="#a8c0ba" stroke-width="2"/><circle cx="52" cy="254" r="20" fill="#f4e0d4"/><text x="52" y="261" fill="#ad5037" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" text-anchor="middle">!</text><text x="80" y="260" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">WHITE ICE</text><text x="40" y="304" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start">Weaker than new clear</text><text x="40" y="329" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start">ice.</text><rect x="289" y="224" width="252" height="138" rx="13" fill="#ffffff" stroke="#a8c0ba" stroke-width="2"/><circle cx="319" cy="254" r="20" fill="#f4e0d4"/><text x="319" y="261" fill="#ad5037" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" text-anchor="middle">!</text><text x="347" y="260" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">SHORE EDGE</text><text x="307" y="304" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start">May be melted or</text><text x="307" y="329" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start">detached.</text><rect x="556" y="224" width="252" height="138" rx="13" fill="#ffffff" stroke="#a8c0ba" stroke-width="2"/><circle cx="586" cy="254" r="20" fill="#f4e0d4"/><text x="586" y="261" fill="#ad5037" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" text-anchor="middle">!</text><text x="614" y="260" fill="#163f30" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">FISH HOUSE</text><text x="574" y="304" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start">Someone else accepted a</text><text x="574" y="329" fill="#21475a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start">risk.</text></svg>