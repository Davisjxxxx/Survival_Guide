name: Foundational production integrity
on:
  push:
    branches:
      - review/foundational-production-20261124
      - review/astra-a01-technical-audit-20261124
      - review/neon-p12-p15-20261124
      - review/astra-a02-technical-audit-20261125
      - review/neon-p16-p20-20261125
      - review/astra-a03-v01-20261125
      - review/neon-v02-v03-visual-20261125
  pull_request:
    branches:
      - review/s02-s03-historical-recovery-20261124
      - review/foundational-production-20261124
      - review/astra-a01-technical-audit-20261124
      - review/neon-p12-p15-20261124
      - review/astra-a02-technical-audit-20261125
      - review/neon-p16-p20-20261125
      - review/astra-a03-v01-20261125
permissions:
  contents: read
jobs:
  review-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/test_foundation_controls.py
      - run: python scripts/check_foundations.py
      - if: github.ref_name == 'review/astra-a02-technical-audit-20261125' || github.head_ref == 'review/astra-a02-technical-audit-20261125'
        run: python scripts/check_a02_audit.py
      - if: github.ref_name == 'review/astra-a03-v01-20261125' || github.head_ref == 'review/astra-a03-v01-20261125'
        run: python scripts/check_a03_v01.py
