<text x="330" y="244" class="tiny warn">portable filters do not remove viruses: disinfect after filtering</text>
<rect x="24" y="262" width="420" height="74" rx="10" fill="#fbeee7" stroke="#c08a72" stroke-width="1.6"/>
<text x="40" y="288" class="head warn">✕ UV OR BLEACH ON CLOUDY WATER</text>
<text x="40" y="320" class="tiny">particles shield germs: clarify first</text>
<rect x="456" y="262" width="420" height="74" rx="10" fill="#fbeee7" stroke="#c08a72" stroke-width="1.6"/>
<text x="472" y="288" class="head warn">✕ FILTERING AFTER DISINFECTING</text>
<text x="472" y="320" class="tiny">a dirty cartridge can recontaminate</text>
<rect x="24" y="345" width="852" height="32" rx="4" fill="#f7e5d9"/>
<text x="37" y="367" class="small">Barrier failed or chemicals suspected: boil if chemically safe, or switch to a safe supply.</text>
