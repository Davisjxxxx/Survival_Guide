<path d="M566 101q-5 7 0 10q5-3 0-10z" fill="#5f8fa3" stroke="#183a30" stroke-width="1.2"/><rect x="600" y="100" width="12" height="62" rx="5" fill="#4a4f52" stroke="#183a30" stroke-width="1.4"/><rect x="602" y="150" width="8" height="10" fill="#9b7fd4"/>
