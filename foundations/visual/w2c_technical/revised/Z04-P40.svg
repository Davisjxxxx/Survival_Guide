<text x="474" y="295" class="tiny">iodine allergy; not beyond a few weeks</text>
<rect x="24" y="345" width="852" height="32" rx="4" fill="#f7e5d9"/>
<text x="37" y="367" class="small">Unlabelled loose tablets, or fuel, chemicals or algal toxins suspected: do not rely on them.</text>
