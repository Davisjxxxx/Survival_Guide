<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Backsiphonage through a submerged hose and the two simple barriers</title>
<desc id="desc">Left: an outdoor faucet feeds a garden hose whose end sits under soapy or chemical liquid in a bucket. A main break or shutoff drops supply pressure, so the liquid is pulled back up the hose and into the house pipes. Right: a hose-bibb vacuum breaker on the faucet vents to air when pressure drops, the hose end is held above the bucket rim to keep an air gap, and a rain barrel or sump has no hard connection to house plumbing. Conceptual drawing, not to scale.</desc>
