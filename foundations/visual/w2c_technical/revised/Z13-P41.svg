<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Private well during a power outage</title>
<desc id="desc">Cross-section of a house and private well with the power out. The breaker for the submersible pump has no power, so the pump in the well cannot run or refill the basement pressure tank. The tank pushes out only its small stored reserve, then the kitchen tap sputters and stops; common tanks deliver about 5 to 16 gallons between pump starts. A side panel shows the plan: stored drinking water, a labelled pump breaker, and well cap and pump wiring left to licensed contractors. Conceptual drawing, not to scale.</desc>
