<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Cold-holding times during a power outage</title>
<desc id="desc">Bars on one time axis show how long food stays safe with the doors kept closed: a refrigerator about 4 hours, a half-full freezer about 24 hours and a full freezer about 48 hours. Below, a cooler packed with ice keeps food at 40 degrees F or below when the outage runs longer, with its temperature checked; dry ice is handled only with insulated gloves and never used in a small, poorly ventilated space. Conceptual, not to scale apart from the time bars.</desc>
<defs><marker id="m-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="m-reverse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b3825"/></marker><marker id="m-load" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3b3b3b"/></marker><marker id="m-air" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6b7f8c"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183a30"/></marker></defs>
<style>text{font:650 19px system-ui,sans-serif;fill:#183a30}.small{font-size:17px}.tiny{font-size:15px}.head{font-size:18px;letter-spacing:.4px}.warn{fill:#8b3825}.ok{fill:#205b68}.mute{fill:#4c5d55}.inv{fill:#ffffff}.lead{fill:none;stroke:#365c50;stroke-width:1.6}</style>
<rect x="1" y="1" width="898" height="393" rx="12" fill="#f2f3e9" stroke="#789481" stroke-width="2"/>
<text x="24" y="32" class="small">Z14-P40 · TECHNICAL REVIEW · NOT TO SCALE EXCEPT TIME BARS</text>
<g id="z14-p40-artwork">
<path d="M150 196H700.0" stroke="#183a30" stroke-width="2"/>
<path d="M150.0 192v8" stroke="#183a30" stroke-width="1.6"/><text x="150.0" y="216" class="tiny" text-anchor="middle">0 h</text>
<path d="M282.0 192v8" stroke="#183a30" stroke-width="1.6"/><text x="282.0" y="216" class="tiny" text-anchor="middle">12 h</text>
<path d="M414.0 192v8" stroke="#183a30" stroke-width="1.6"/><text x="414.0" y="216" class="tiny" text-anchor="middle">24 h</text>
<path d="M546.0 192v8" stroke="#183a30" stroke-width="1.6"/><text x="546.0" y="216" class="tiny" text-anchor="middle">36 h</text>
<path d="M678.0 192v8" stroke="#183a30" stroke-width="1.6"/><text x="678.0" y="216" class="tiny" text-anchor="middle">48 h</text>
<rect id="bar-fridge" data-hours="4" x="150" y="80" width="44.0" height="22" fill="#205b68" fill-opacity="0.45"/>
<text x="140" y="96" class="tiny" text-anchor="end">4 h</text>
<text x="204" y="96" class="tiny">refrigerator, door closed</text>
<rect id="bar-half" data-hours="24" x="150" y="116" width="264.0" height="22" fill="#205b68" fill-opacity="0.65"/>
<text x="140" y="132" class="tiny" text-anchor="end">24 h</text>
<text x="424" y="132" class="tiny">half-full freezer</text>
<rect id="bar-full" data-hours="48" x="150" y="152" width="528.0" height="22" fill="#205b68" fill-opacity="0.8500000000000001"/>
<text x="140" y="168" class="tiny" text-anchor="end">48 h</text>
<text x="162" y="168" class="tiny inv">full freezer</text>
<text x="40" y="246" class="tiny">keep doors shut;</text>
<text x="40" y="267" class="tiny">open only to read</text>
<text x="40" y="288" class="tiny">the thermometer</text>
<rect x="250" y="246" width="110" height="62" rx="8" fill="#5f8fa3" stroke="#183a30" stroke-width="2.2"/><rect x="258" y="254" width="94" height="14" fill="#dcecf3"/>
<text x="372" y="266" class="tiny">cooler with ice: keep</text>
<text x="372" y="287" class="tiny">40 °F or below, check it</text>
<rect x="560" y="252" width="56" height="34" fill="#eef2f3" stroke="#183a30" stroke-width="2"/><path d="M568 252l8-12M592 252l8-12" stroke="#9aa1a5" stroke-width="2"/>
<text x="626" y="262" class="tiny">dry ice: insulated gloves;</text>
<text x="626" y="283" class="tiny">never a small closed space</text>
<rect x="24" y="345" width="852" height="32" rx="4" fill="#f7e5d9"/>
<text x="37" y="367" class="small">After the hold time: read the thermometer, then sort each item with the official chart.</text>
</g>
</svg>
