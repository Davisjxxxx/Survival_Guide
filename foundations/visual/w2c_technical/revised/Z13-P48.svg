<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Septic tank in flooded, saturated soil</title>
<desc id="desc">Two ground cross-sections with floodwater over saturated soil. Left: a septic tank pumped empty while the soil is saturated; groundwater presses up on its base, the tank lifts from its original seat and the inlet and outlet pipes break at the joints. Right: the tank is left full and unopened, basement drains are plugged, indoor water use is cut sharply, and equipment stays off the wet drainfield until the water recedes and a professional inspects the system. Conceptual drawing, not to scale.</desc>
