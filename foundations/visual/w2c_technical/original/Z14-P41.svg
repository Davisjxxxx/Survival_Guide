<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Apply official per-item keep, refreeze, or discard charts after outage warming</title>
  <desc id="desc">DECISION TREE: Fridge &gt;40°F &gt;2 h -&gt; dump meat/dairy/cuts | Frozen: ice crystals or ≤40°F -&gt; refreeze | Use official chart; never guess by smell — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z14-P41 · DECISION TREE (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="decision-tree-artwork"><polygon points="125,44 215,82 125,120 35,82" fill="#e6eee6" stroke="#184438" stroke-width="2.8"/><text x="125" y="79" font-size="11" font-weight="700" fill="#183c31" text-anchor="middle">Fridge ≤40°F</text><text x="125" y="93" font-size="11" font-weight="700" fill="#183c31" text-anchor="middle">or &lt;2 h?</text><path d="M215 82h60" stroke="#285345" stroke-width="3" marker-end="url(#arrow)"/><text x="244" y="75" font-size="10" font-weight="650" fill="#184438" text-anchor="middle">YES</text><polygon points="365,44 455,82 365,120 275,82" fill="#e6eee6" stroke="#184438" stroke-width="2.8"/><text x="365" y="79" font-size="11" font-weight="700" fill="#183c31" text-anchor="middle">Frozen: ice</text><text x="365" y="93" font-size="11" font-weight="700" fill="#183c31" text-anchor="middle">crystals or</text><text x="365" y="107" font-size="11" font-weight="700" fill="#183c31" text-anchor="middle">≤40°F?</text><path d="M455 82h55" stroke="#285345" stroke-width="3" marker-end="url(#arrow)"/><text x="482" y="75" font-size="10" font-weight="650" fill="#184438" text-anchor="middle">YES</text><rect x="516" y="54" width="166" height="56" rx="8" fill="#d3e6d6" stroke="#184438" stroke-width="3"/><text x="599" y="79" font-size="11.5" font-weight="700" fill="#183c31" text-anchor="middle">Keep/refreeze per</text><text x="599" y="93" font-size="11.5" font-weight="700" fill="#183c31" text-anchor="middle">official chart</text><path d="M125 120v14h240v-14" fill="none" stroke="#a05332" stroke-width="2.5"/><text x="142" y="131" font-size="9.5" font-weight="650" fill="#8b3e1f" text-anchor="middle">NO</text><text x="382" y="131" font-size="9.5" font-weight="650" fill="#8b3e1f" text-anchor="middle">NO</text><rect x="115" y="132" width="490" height="22" rx="5" fill="#faeee5" stroke="#a05332" stroke-width="2"/><text x="360" y="147" font-size="11" font-weight="650" fill="#7a2f15" text-anchor="middle">DISCARD CLEANLY: Meat, dairy, eggs, cut produce or leftovers &gt;40°F &gt;2 hr</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Fridge &gt;40°F &gt;2 h -&gt;</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">dump meat/dairy/cuts</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Frozen: ice crystals or</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">≤40°F -&gt; refreeze</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Use official chart;</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">never guess by smell</text></g>
  </g>
</svg>
