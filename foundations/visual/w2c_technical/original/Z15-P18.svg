<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Protect yourself during Tornado Warnings in stores, schools, or workplaces</title>
  <desc id="desc">CUTAWAY VIEW: Exit wide-span floors, gyms &amp; glass doors | Move to interior masonry restrooms/halls | Crouch low; protect head; stay off parking lot — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z15-P18 · CUTAWAY VIEW (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="cutaway-artwork"><path d="M40 142h640" stroke="#7d8a68" stroke-width="6"/><path d="M135 140L360 44l225 96" fill="#d9e4d7" stroke="#285345" stroke-width="5"/><path d="M185 140L360 64l175 76" fill="#f7f4ea" stroke="#5c7c6d" stroke-width="2.5" stroke-dasharray="6 4"/><rect x="242" y="114" width="236" height="22" rx="6" fill="#dce8df" stroke="#285345" stroke-width="2"/><path d="M62 82h66m470 0h66" stroke="#507f92" stroke-width="4" marker-end="url(#arrow)"/><text x="360" y="58" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Wide-span retail/gym roof &amp; glass (EXIT)</text><text x="360" y="96" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Interior concrete-block restroom / stairwell</text><text x="360" y="130" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Crouch low facing wall; cover head &amp; neck</text><text x="605" y="68" font-size="11" font-weight="650" fill="#8b3e1f" text-anchor="middle">Skip parking lot dash</text><rect x="492" y="130" width="204" height="20" rx="4" fill="#faeee5" stroke="#a05332"/><text x="594" y="144" font-size="10.5" font-weight="650" fill="#7a2f15" text-anchor="middle">Stay clear of tall stock racks</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Exit wide-span floors,</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">gyms &amp; glass doors</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Move to interior masonry</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">restrooms/halls</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Crouch low; protect</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">head; stay off parking</text><text x="498" y="218" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">lot</text></g>
  </g>
</svg>
