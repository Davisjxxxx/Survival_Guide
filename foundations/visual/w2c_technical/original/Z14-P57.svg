<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Apply exact local elevation altitude adjustments before canning</title>
  <desc id="desc">CARE / ESCALATION LADDER: Check EXACT home elevation (&gt;1,000 ft!) | Water bath: add min; Pressure: raise PSI | Weighted gauge jumps 10 -&gt; 15 PSI &gt;1,000 ft — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z14-P57 · CARE / ESCALATION LADDER (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="escalation-ladder-artwork"><rect x="30" y="58" width="206" height="76" rx="7" fill="#e1ece3" stroke="#184438" stroke-width="2.6"/><rect x="30" y="58" width="206" height="22" rx="5" fill="#184438"/><text x="133" y="73" font-size="11" font-weight="650" fill="#fffdf7" text-anchor="middle">1 · ≤1,000 FT</text><text x="133" y="94" font-size="10.6" font-weight="650" fill="#183c31" text-anchor="middle">Sea-level base</text><text x="133" y="110" font-size="10.5" font-weight="650" fill="#183c31" text-anchor="middle">Base minutes | 11 PSI dial</text><text x="133" y="123" font-size="10.5" font-weight="650" fill="#183c31" text-anchor="middle">| 10 PSI weight</text><path d="M238 86l12-8" stroke="#7c6928" stroke-width="3" marker-end="url(#arrow)"/><rect x="254" y="49" width="206" height="85" rx="7" fill="#f4efd8" stroke="#7c6928" stroke-width="2.6"/><rect x="254" y="49" width="206" height="22" rx="5" fill="#7c6928"/><text x="357" y="64" font-size="11" font-weight="650" fill="#fffdf7" text-anchor="middle">2 · 1,001–2,000 FT</text><text x="357" y="85" font-size="10.6" font-weight="650" fill="#3d3312" text-anchor="middle">Many MN counties</text><text x="357" y="101" font-size="10.5" font-weight="650" fill="#3d3312" text-anchor="middle">Add WB min | 11 PSI dial |</text><text x="357" y="114" font-size="10.5" font-weight="650" fill="#3d3312" text-anchor="middle">15 PSI weight!</text><path d="M462 77l12-8" stroke="#8f381c" stroke-width="3" marker-end="url(#arrow)"/><rect x="478" y="40" width="206" height="94" rx="7" fill="#f6e1d7" stroke="#8f381c" stroke-width="2.6"/><rect x="478" y="40" width="206" height="22" rx="5" fill="#8f381c"/><text x="581" y="55" font-size="11" font-weight="650" fill="#fffdf7" text-anchor="middle">3 · &gt;2,000 FT</text><text x="581" y="76" font-size="10.6" font-weight="650" fill="#642e1e" text-anchor="middle">Highlands/west</text><text x="581" y="92" font-size="10.5" font-weight="650" fill="#642e1e" text-anchor="middle">Step WB min &amp; dial PSI per</text><text x="581" y="105" font-size="10.5" font-weight="650" fill="#642e1e" text-anchor="middle">USDA tables</text><rect x="30" y="139" width="660" height="18" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360" y="152" font-size="10.8" font-weight="650" fill="#642e1e" text-anchor="middle">Verify exact local elevation BEFORE lighting burner — never mix dial/weight tables</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Check EXACT home</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">elevation (&gt;1,000 ft!)</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Water bath: add min;</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Pressure: raise PSI</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Weighted gauge jumps 10</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">-&gt; 15 PSI &gt;1,000 ft</text></g>
  </g>
</svg>
