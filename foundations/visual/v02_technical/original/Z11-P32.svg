<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Box cleanly around a pond, cliff or blowdown using right-angle offsets</title>
  <desc id="desc">MECHANISM DIAGRAM: Turn 90° &amp; count exact paces | Pass obstacle on main bearing | Turn back 90° &amp; match paces — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z11-P32 · MECHANISM DIAGRAM (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="mechanism-artwork"><rect x="38" y="54" width="168" height="68" rx="10" fill="#d3e3dc" stroke="#285345" stroke-width="3"/><text x="122" y="84" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Turn 90° &amp; Count</text><text x="122" y="99" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Offset Paces</text><path d="M208 88h56" stroke="#285345" stroke-width="4" marker-end="url(#arrow)"/><ellipse cx="360" cy="88" rx="88" ry="42" fill="#5b899e" fill-opacity="0.28" stroke="#5b899e" stroke-width="3.5"/><text x="360" y="84" font-size="12" font-weight="700" fill="#183c31" text-anchor="middle">Pass Obstacle on</text><text x="360" y="99" font-size="12" font-weight="700" fill="#183c31" text-anchor="middle">Main Bearing</text><path d="M450 88h56" stroke="#285345" stroke-width="4" marker-end="url(#arrow)"/><rect x="514" y="54" width="168" height="68" rx="10" fill="#e5ebd8" stroke="#285345" stroke-width="3"/><text x="598" y="84" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Turn Back 90° &amp;</text><text x="598" y="99" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Match Paces</text><path d="M360 130v14" stroke="#a05332" stroke-width="3"/><rect x="215" y="136" width="290" height="20" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360" y="150" font-size="10.5" font-weight="650" fill="#7a2f15" text-anchor="middle">Use only for compact dry-land barriers; map-reroute large lakes</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Turn 90° &amp; count exact</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">paces</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Pass obstacle on main</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">bearing</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Turn back 90° &amp; match</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">paces</text></g>
  </g>
</svg>
