 x="579.5" y="100" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Spot</text><text x="360" y="149" font-size="11" font-weight="650" fill="#4c5f55" text-anchor="middle">Cool completely, refuel away from flames &amp; move off spills</text></g>
