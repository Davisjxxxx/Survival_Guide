<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Prevent frozen residential plumbing pipes during sub-zero cold snaps</title>
  <desc id="desc">CUTAWAY VIEW: Disconnect hoses &amp; sleeve cold pipes | Open exterior-wall sink cabinets in cold | Flow drops to trickle -&gt; prep shutoff NOW — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z13-P27 · CUTAWAY VIEW (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="cutaway-artwork"><path d="M40 142h640" stroke="#7d8a68" stroke-width="6"/><path d="M135 140L360 44l225 96" fill="#d9e4d7" stroke="#285345" stroke-width="5"/><path d="M185 140L360 64l175 76" fill="#f7f4ea" stroke="#5c7c6d" stroke-width="2.5" stroke-dasharray="6 4"/><rect x="242" y="114" width="236" height="22" rx="6" fill="#d4e5ec" stroke="#285345" stroke-width="2"/><path d="M62 82h66m470 0h66" stroke="#507f92" stroke-width="4" marker-end="url(#arrow)"/><text x="360" y="58" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Outdoor hose disconnected pre-freeze</text><text x="360" y="96" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Insulated rim-joist &amp; garage pipes</text><text x="360" y="130" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Open sink cabinet doors let room warmth in</text><text x="605" y="68" font-size="11" font-weight="650" fill="#8b3e1f" text-anchor="middle">Guard cold walls</text><rect x="492" y="130" width="204" height="20" rx="4" fill="#faeee5" stroke="#a05332"/><text x="594" y="144" font-size="10.5" font-weight="650" fill="#7a2f15" text-anchor="middle">Trickle drop = freezing pipe</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Disconnect hoses &amp;</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">sleeve cold pipes</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Open exterior-wall sink</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">cabinets in cold</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Flow drops to trickle -&gt;</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">prep shutoff NOW</text></g>
  </g>
</svg>
