<svg class="v02-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Frostnip versus superficial and deep frostbite tissue depth</title><desc id="desc">Skin-and-digit depth cross-section differentiating reversible surface frostnip from blister-prone superficial frostbite and waxy wood-hard deep frostbite.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#972f22"/></marker><marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183a30"/></marker></defs>
<style>.v02-svg text{font-family:system-ui,sans-serif;font-size:19px;font-weight:650;fill:#183a30}.v02-svg .sm{font-size:16.5px;font-weight:600;fill:#2b473e}.v02-svg .warn{font-size:18.5px;font-weight:700;fill:#8c281b}.v02-svg .heading{font-size:19px;letter-spacing:0.8px;font-weight:750;fill:#183a30}.v02-svg .guard{font-size:15.5px;font-weight:650;fill:#6d301f}.v02-svg .leader{fill:none;stroke:#365c50;stroke-width:2.5}.v02-svg .flow{fill:none;stroke:#205b68;stroke-width:4;marker-end:url(#arr)}.v02-svg .rflow{fill:none;stroke:#972f22;stroke-width:4;marker-end:url(#arr-r)}.v02-svg .gflow{fill:none;stroke:#183a30;stroke-width:3.5;marker-end:url(#arr-g)}.v02-svg .dash{fill:none;stroke:#365c50;stroke-width:2.5;stroke-dasharray:10 7}</style>
<rect x="1" y="1" width="898" height="393" rx="16" fill="#f4f6ed" stroke="#99ad9b" stroke-width="2"/>
<text class="heading" x="26" y="34">Z10-P45 · V02 TECHNICAL ILLUSTRATION · NOT TO SCALE</text>
<g id="v02-artwork">
    <!-- 3 cross-section columns -->
    <rect x="55" y="102" width="245" height="202" rx="10" fill="#eef4f2" stroke="#205b68" stroke-width="3"/>
    <rect x="55" y="102" width="245" height="40" rx="8" fill="#cfe6ee"/>
    <text x="72" y="86">1. Possible frostnip</text>
    <text class="sm" x="72" y="176">Pale/red tingling skin</text><text class="sm" x="72" y="206">Still soft &amp; pliable</text><text class="sm" x="72" y="246">Rewarm early; shelter</text>
    <rect x="328" y="102" width="245" height="202" rx="10" fill="#f5eedc" stroke="#8c5a20" stroke-width="3"/>
    <rect x="328" y="102" width="245" height="92" rx="8" fill="#a2cfe0"/>
    <text x="342" y="86">2. Suspected frostbite</text>
    <text class="sm" x="344" y="226">Waxy pale firm surface</text><text class="sm" x="344" y="256">Clear blisters after thaw</text>
    <rect x="600" y="102" width="245" height="202" rx="10" fill="#f7e4d8" stroke="#972f22" stroke-width="3.5"/>
    <rect x="600" y="102" width="245" height="162" rx="8" fill="#7aa9be"/>
    <text class="warn" x="615" y="86">3. More severe signs</text>
    <text class="warn" x="616" y="290">Hard or numb tissue</text>
    </g>
<rect x="23" y="344" width="854" height="36" rx="7" fill="#f7e4d8"/>
<text class="guard" x="36" y="369">Appearance cannot establish injury depth. Protect from refreezing and seek care.</text>
</svg>
