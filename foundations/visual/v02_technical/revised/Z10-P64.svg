<svg class="v02-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Urushiol oil washing versus lethal poison-ivy smoke hazard</title><desc id="desc">Split safety diagram showing cool-water soap decontamination of skin/tools versus burning poison-ivy vines producing severe lung-damaging urushiol smoke.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#972f22"/></marker><marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183a30"/></marker></defs>
<style>.v02-svg text{font-family:system-ui,sans-serif;font-size:19px;font-weight:650;fill:#183a30}.v02-svg .sm{font-size:16.5px;font-weight:600;fill:#2b473e}.v02-svg .warn{font-size:18.5px;font-weight:700;fill:#8c281b}.v02-svg .heading{font-size:19px;letter-spacing:0.8px;font-weight:750;fill:#183a30}.v02-svg .guard{font-size:15.5px;font-weight:650;fill:#6d301f}.v02-svg .leader{fill:none;stroke:#365c50;stroke-width:2.5}.v02-svg .flow{fill:none;stroke:#205b68;stroke-width:4;marker-end:url(#arr)}.v02-svg .rflow{fill:none;stroke:#972f22;stroke-width:4;marker-end:url(#arr-r)}.v02-svg .gflow{fill:none;stroke:#183a30;stroke-width:3.5;marker-end:url(#arr-g)}.v02-svg .dash{fill:none;stroke:#365c50;stroke-width:2.5;stroke-dasharray:10 7}</style>
<rect x="1" y="1" width="898" height="393" rx="16" fill="#f4f6ed" stroke="#99ad9b" stroke-width="2"/>
<text class="heading" x="26" y="34">Z10-P64 · V02 TECHNICAL ILLUSTRATION · NOT TO SCALE</text>
<g id="v02-artwork">
    <!-- Left: Correct cool wash -->
    <rect x="45" y="84" width="380" height="232" rx="12" fill="#e3f0ea" stroke="#183a30" stroke-width="3.5"/>
    <text x="68" y="118">SAFE: prompt cool-water wash</text>
    <path class="flow" d="M125 142v58"/><path class="flow" d="M165 142v58"/>
    <rect x="95" y="210" width="120" height="36" rx="14" fill="#e4c7a5" stroke="#684b35" stroke-width="3"/>
    <text class="sm" x="235" y="176">Cool water + soap</text>
    <text class="sm" x="235" y="206">Clean under nails</text>
    <text class="sm" x="235" y="236">Wash boots, tools</text>
    <text class="sm" x="235" y="266">&amp; pet fur promptly</text>
    <!-- Right: Forbidden burning vines -->
    <rect x="475" y="84" width="380" height="232" rx="12" fill="#f7e4d8" stroke="#972f22" stroke-width="3.5"/>
    <text class="warn" x="498" y="118">FORBIDDEN: burning vines</text>
    <path d="M555 278q25-52 50 0q25-44 50 0z" fill="#d97236" stroke="#972f22" stroke-width="3"/>
    <path class="rflow" d="M605 225Q625 170 675 152"/>
    <text class="warn" x="682" y="176">Airborne oil</text><text class="warn" x="682" y="206">burns lungs!</text>
    <text class="sm" x="498" y="302">Call 911 for wheezing or face/throat swelling</text>
    </g>
<rect x="23" y="344" width="854" height="36" rx="7" fill="#f7e4d8"/>
<text class="guard" x="36" y="369">Never burn poison ivy, oak or sumac; wash exposed skin and gear promptly with cool water and soap.</text>
</svg>
