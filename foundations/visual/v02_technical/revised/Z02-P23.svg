<svg class="v02-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Four mechanisms of human body heat loss</title><desc id="desc">Four-way physical diagram around a reclining person showing conduction to cold ground, convection via wind, radiation to open night sky, and evaporation from wet fabric.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#972f22"/></marker><marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183a30"/></marker></defs>
<style>.v02-svg text{font-family:system-ui,sans-serif;font-size:20px;font-weight:650;fill:#183a30}.v02-svg .sm{font-size:17px;font-weight:600;fill:#2b473e}.v02-svg .warn{font-size:19px;font-weight:700;fill:#8c281b}.v02-svg .heading{font-size:19px;letter-spacing:0.8px;font-weight:750;fill:#183a30}.v02-svg .guard{font-size:15.5px;font-weight:650;fill:#6d301f}.v02-svg .leader{fill:none;stroke:#365c50;stroke-width:2.5}.v02-svg .flow{fill:none;stroke:#205b68;stroke-width:4;marker-end:url(#arr)}.v02-svg .rflow{fill:none;stroke:#972f22;stroke-width:4;marker-end:url(#arr-r)}.v02-svg .gflow{fill:none;stroke:#183a30;stroke-width:3.5;marker-end:url(#arr-g)}.v02-svg .dash{fill:none;stroke:#365c50;stroke-width:2.5;stroke-dasharray:10 7}</style>
<rect x="1" y="1" width="898" height="393" rx="16" fill="#f4f6ed" stroke="#99ad9b" stroke-width="2"/>
<text class="heading" x="26" y="34">Z02-P23 · V02 TECHNICAL ILLUSTRATION · NOT TO SCALE</text>
<g id="v02-artwork">
    <!-- Ground -->
    <rect x="45" y="268" width="810" height="46" fill="#c7d3d8" stroke="#205b68" stroke-width="3"/>
    <text class="sm" x="355" y="298">Cold ground / frozen soil</text>
    <!-- Person silhouette on thin mat -->
    <rect x="265" y="230" width="350" height="36" rx="18" fill="#bc785b" stroke="#6d301f" stroke-width="3.5"/>
    <circle cx="298" cy="248" r="18" fill="#e4c7a5" stroke="#6d301f" stroke-width="3"/>
    <!-- 1. Radiation UP -->
    <path class="rflow" d="M380 222V106"/><path class="rflow" d="M445 222V106"/><path class="rflow" d="M510 222V106"/>
    <text class="warn" x="348" y="88">RADIATION (to open sky)</text>
    <!-- 2. Convection LEFT->RIGHT -->
    <path class="flow" d="M65 178h165"/><path class="flow" d="M65 212h165"/>
    <text x="55" y="142">CONVECTION</text><text class="sm" x="55" y="166">(wind strips air)</text>
    <!-- 3. Evaporation RIGHT -->
    <path class="flow" d="M635 235Q675 190 660 142"/><path class="flow" d="M675 235Q715 190 700 142"/>
    <text x="640" y="114">EVAPORATION</text><text class="sm" x="640" y="138">(wet skin / sweat)</text>
    <!-- 4. Conduction DOWN -->
    <path class="rflow" d="M445 266v36"/>
    <text class="warn" x="55" y="298">CONDUCTION (ground)</text>
    </g>
<rect x="23" y="344" width="854" height="36" rx="7" fill="#f7e4d8"/>
<text class="guard" x="36" y="369">Block ground conduction first with dry insulation, then wind convection and wet-layer evaporation.</text>
</svg>
