<svg class="v02-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Cloth pre-filtration removes debris but not pathogens</title><desc id="desc">Cutaway funnel with folded cloth trapping sand, leaves and silt while clear water carrying microscopic pathogens passes into the lower vessel.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#972f22"/></marker><marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183a30"/></marker></defs>
<style>.v02-svg text{font-family:system-ui,sans-serif;font-size:20px;font-weight:650;fill:#183a30}.v02-svg .sm{font-size:17px;font-weight:600;fill:#2b473e}.v02-svg .warn{font-size:19px;font-weight:700;fill:#8c281b}.v02-svg .heading{font-size:19px;letter-spacing:0.8px;font-weight:750;fill:#183a30}.v02-svg .guard{font-size:15.5px;font-weight:650;fill:#6d301f}.v02-svg .leader{fill:none;stroke:#365c50;stroke-width:2.5}.v02-svg .flow{fill:none;stroke:#205b68;stroke-width:4;marker-end:url(#arr)}.v02-svg .rflow{fill:none;stroke:#972f22;stroke-width:4;marker-end:url(#arr-r)}.v02-svg .gflow{fill:none;stroke:#183a30;stroke-width:3.5;marker-end:url(#arr-g)}.v02-svg .dash{fill:none;stroke:#365c50;stroke-width:2.5;stroke-dasharray:10 7}</style>
<rect x="1" y="1" width="898" height="393" rx="16" fill="#f4f6ed" stroke="#99ad9b" stroke-width="2"/>
<text class="heading" x="26" y="34">Z04-P33 · V02 TECHNICAL ILLUSTRATION · NOT TO SCALE</text>
<g id="v02-artwork">
    <!-- Pouring stream -->
    <path d="M180 78l85 38l-16 28l-85-38z" fill="#d9c698" stroke="#5c4b2b" stroke-width="3.5"/>
    <path class="flow" d="M262 128Q310 136 322 172"/>
    <text x="48" y="82">Turbid raw water</text>
    <!-- Funnel + cloth -->
    <polygon points="245,165 405,165 342,248 308,248" fill="#eef4f2" stroke="#183a30" stroke-width="4"/>
    <path d="M265 178Q325 224 385 178" fill="#e8ddc2" stroke="#7a5e32" stroke-width="5"/>
    <circle cx="305" cy="188" r="5" fill="#5c4b2b"/><circle cx="338" cy="194" r="6" fill="#5c4b2b"/><circle cx="322" cy="184" r="4" fill="#5c4b2b"/>
    <!-- Lower jar -->
    <rect x="275" y="252" width="100" height="72" rx="8" fill="#cfe6ee" stroke="#205b68" stroke-width="3.5"/>
    <path class="flow" d="M325 248v24"/>
    <!-- Callouts -->
    <path class="leader" d="M398 182h92"/>
    <text x="498" y="180">Folded cloth / coffee filter</text>
    <text class="sm" x="498" y="206">Stops leaves, grit and coarse silt</text>
    <path class="leader" d="M380 288h110"/>
    <text class="warn" x="498" y="282">Pathogens STILL PASS THROUGH</text>
    <text class="sm" x="498" y="308">Follow with boiling, filter or chlorine</text>
    </g>
<rect x="23" y="344" width="854" height="36" rx="7" fill="#f7e4d8"/>
<text class="guard" x="36" y="369">Pre-filtering clarifies water only; never drink cloth-strained water without microbial treatment.</text>
</svg>
