<svg class="v02-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Moving stream versus stagnant pond cross-section</title><desc id="desc">Side-by-side cutaway contrasting an oxygenated flowing mid-channel stream against a warm stagnant pond with surface scum and anaerobic bottom muck.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#972f22"/></marker><marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183a30"/></marker></defs>
<style>.v02-svg text{font-family:system-ui,sans-serif;font-size:20px;font-weight:650;fill:#183a30}.v02-svg .sm{font-size:17px;font-weight:600;fill:#2b473e}.v02-svg .warn{font-size:19px;font-weight:700;fill:#8c281b}.v02-svg .heading{font-size:19px;letter-spacing:0.8px;font-weight:750;fill:#183a30}.v02-svg .guard{font-size:15.5px;font-weight:650;fill:#6d301f}.v02-svg .leader{fill:none;stroke:#365c50;stroke-width:2.5}.v02-svg .flow{fill:none;stroke:#205b68;stroke-width:4;marker-end:url(#arr)}.v02-svg .rflow{fill:none;stroke:#972f22;stroke-width:4;marker-end:url(#arr-r)}.v02-svg .gflow{fill:none;stroke:#183a30;stroke-width:3.5;marker-end:url(#arr-g)}.v02-svg .dash{fill:none;stroke:#365c50;stroke-width:2.5;stroke-dasharray:10 7}</style>
<rect x="1" y="1" width="898" height="393" rx="16" fill="#f4f6ed" stroke="#99ad9b" stroke-width="2"/>
<text class="heading" x="26" y="34">Z04-P16 · V02 TECHNICAL ILLUSTRATION · NOT TO SCALE</text>
<g id="v02-artwork">
    <!-- Left: Moving stream -->
    <path d="M35 160h385v145H35z" fill="#e5d7b3" stroke="#5d653e" stroke-width="3"/>
    <path d="M60 160Q120 265 225 268Q335 265 395 160Z" fill="#9ac9da" stroke="#205b68" stroke-width="3.5"/>
    <path class="flow" d="M125 198h175"/><path class="flow" d="M155 228h120"/>
    <ellipse cx="225" cy="256" rx="58" ry="8" fill="#8b7650"/>
    <text x="55" y="84">Flowing stream channel</text>
    <text class="sm" x="62" y="112">Collect mid-column; treat always</text>
    <text class="sm" x="155" y="294">Gravel bed</text>
    <!-- Right: Stagnant pond -->
    <path d="M475 160h385v145H475z" fill="#dfd2ae" stroke="#5d653e" stroke-width="3"/>
    <path d="M500 160Q555 270 670 272Q785 270 835 160Z" fill="#b7c69e" stroke="#4f6038" stroke-width="3.5"/>
    <path d="M510 163Q580 155 665 164Q755 156 825 164" stroke="#4c7a34" stroke-width="8" fill="none"/>
    <path d="M540 246Q665 266 795 246Q755 274 670 274Q585 274 540 246Z" fill="#6b5a3c"/>
    <text x="495" y="84">Warm stagnant pond</text>
    <text class="warn" x="495" y="112">Surface algal scum &amp; silt risk</text>
    <text class="sm" x="602" y="294">Organic muck</text>
    <path class="leader" d="M690 124v32"/>
    </g>
<rect x="23" y="344" width="854" height="36" rx="7" fill="#f7e4d8"/>
<text class="guard" x="36" y="369">Even clear flowing streams require microbial treatment; reject algal scum or runoff ponds.</text>
</svg>
