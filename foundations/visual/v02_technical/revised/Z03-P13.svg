    <text x="72" y="232">OXYGEN draft</text><text class="sm" x="72" y="256">(open gaps at base)</text>
    <text x="612" y="132">HEAT + rising plume</text>
    <text x="612" y="232">FUEL (small, dry)</text>
    <text class="sm" x="305" y="304">Cleared mineral soil · water staged nearby</text>
