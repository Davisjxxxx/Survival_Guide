    <line x1="560" y1="268" x2="435" y2="150" stroke="#6d4c2f" stroke-width="11" stroke-linecap="round"/>
    <line x1="385" y1="268" x2="455" y2="178" stroke="#8b6540" stroke-width="8" stroke-linecap="round"/>
    <path d="M412 268q18-68 38-92q22 30 38 92z" fill="#e5883e" stroke="#972f22" stroke-width="3"/>
