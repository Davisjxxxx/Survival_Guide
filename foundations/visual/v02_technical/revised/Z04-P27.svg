<svg class="v02-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Melting snow safely with starter liquid water</title><desc id="desc">Cross-section of a metal pot over a camp stove showing starter liquid water conducting heat to added snow without scorching the pot base.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#972f22"/></marker><marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183a30"/></marker></defs>
<style>.v02-svg text{font-family:system-ui,sans-serif;font-size:20px;font-weight:650;fill:#183a30}.v02-svg .sm{font-size:17px;font-weight:600;fill:#2b473e}.v02-svg .warn{font-size:19px;font-weight:700;fill:#8c281b}.v02-svg .heading{font-size:19px;letter-spacing:0.8px;font-weight:750;fill:#183a30}.v02-svg .guard{font-size:15.5px;font-weight:650;fill:#6d301f}.v02-svg .leader{fill:none;stroke:#365c50;stroke-width:2.5}.v02-svg .flow{fill:none;stroke:#205b68;stroke-width:4;marker-end:url(#arr)}.v02-svg .rflow{fill:none;stroke:#972f22;stroke-width:4;marker-end:url(#arr-r)}.v02-svg .gflow{fill:none;stroke:#183a30;stroke-width:3.5;marker-end:url(#arr-g)}.v02-svg .dash{fill:none;stroke:#365c50;stroke-width:2.5;stroke-dasharray:10 7}</style>
<rect x="1" y="1" width="898" height="393" rx="16" fill="#f4f6ed" stroke="#99ad9b" stroke-width="2"/>
<text class="heading" x="26" y="34">Z04-P27 · V02 TECHNICAL ILLUSTRATION · NOT TO SCALE</text>
<g id="v02-artwork">
    <!-- Left: Correct with starter water -->
    <rect x="105" y="128" width="210" height="142" rx="10" fill="#eef4f2" stroke="#183a30" stroke-width="4"/>
    <rect x="109" y="220" width="202" height="46" fill="#8ec2d4"/>
    <path d="M115 220Q160 158 210 164Q260 158 305 220Z" fill="#ffffff" stroke="#7d9890" stroke-width="3"/>
    <path d="M150 282h120l-20 30h-80z" fill="#5e6b65" stroke="#183a30" stroke-width="3"/>
    <path d="M188 278q12-18 22-4q10-14 22 4" fill="#d97236" stroke="#972f22" stroke-width="2.5"/>
    <text x="82" y="88">Correct: starter water</text>
    <text class="sm" x="128" y="198">Add snow slowly</text>
    <text class="sm" x="132" y="250">Starter liquid layer</text>
    <!-- Right: Wrong dry pot scorch -->
    <rect x="545" y="128" width="210" height="142" rx="10" fill="#eef4f2" stroke="#972f22" stroke-width="4"/>
    <path d="M555 152Q650 138 745 152V225Q650 238 555 225Z" fill="#ffffff" stroke="#7d9890" stroke-width="3"/>
    <rect x="549" y="232" width="202" height="34" fill="#f2d6c9"/>
    <path d="M590 282h120l-20 30h-80z" fill="#5e6b65" stroke="#183a30" stroke-width="3"/>
    <path d="M615 278q18-26 35-6q18-20 35 6" fill="#d97236" stroke="#972f22" stroke-width="3"/>
    <text class="warn" x="525" y="88">Wrong: dry packed snow</text>
    <text class="warn" x="572" y="256">Pot can overheat</text>
    <text class="sm" x="562" y="195">Avoid dry heating</text>
    </g>
<rect x="23" y="344" width="854" height="36" rx="7" fill="#f7e4d8"/>
<text class="guard" x="36" y="369">Keep liquid water on the pot floor, heat outdoors only, and still boil or treat melted snow.</text>
</svg>
