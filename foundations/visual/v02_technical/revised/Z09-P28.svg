<svg class="v02-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Safe kneeling chopping-block axe geometry</title><desc id="desc">Side elevation showing a low solid chopping block intercepting the downward blade arc while keeping the operator kneeling outside the miss trajectory.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#972f22"/></marker><marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183a30"/></marker></defs>
<style>.v02-svg text{font-family:system-ui,sans-serif;font-size:20px;font-weight:650;fill:#183a30}.v02-svg .sm{font-size:17px;font-weight:600;fill:#2b473e}.v02-svg .warn{font-size:19px;font-weight:700;fill:#8c281b}.v02-svg .heading{font-size:19px;letter-spacing:0.8px;font-weight:750;fill:#183a30}.v02-svg .guard{font-size:15.5px;font-weight:650;fill:#6d301f}.v02-svg .leader{fill:none;stroke:#365c50;stroke-width:2.5}.v02-svg .flow{fill:none;stroke:#205b68;stroke-width:4;marker-end:url(#arr)}.v02-svg .rflow{fill:none;stroke:#972f22;stroke-width:4;marker-end:url(#arr-r)}.v02-svg .gflow{fill:none;stroke:#183a30;stroke-width:3.5;marker-end:url(#arr-g)}.v02-svg .dash{fill:none;stroke:#365c50;stroke-width:2.5;stroke-dasharray:10 7}</style>
<rect x="1" y="1" width="898" height="393" rx="16" fill="#f4f6ed" stroke="#99ad9b" stroke-width="2"/>
<text class="heading" x="26" y="34">Z09-P28 · V02 TECHNICAL ILLUSTRATION · NOT TO SCALE</text>
<g id="v02-artwork">
    <!-- Ground -->
    <line x1="45" y1="296" x2="855" y2="296" stroke="#5d653e" stroke-width="4"/>
    <!-- Chopping block -->
    <rect x="435" y="208" width="165" height="88" rx="8" fill="#c9b489" stroke="#5c4b2b" stroke-width="4"/>
    <rect x="485" y="164" width="60" height="44" rx="4" fill="#e5d6b3" stroke="#6d4c2f" stroke-width="3"/>
    <!-- Axe handle & arc landing into block -->
    <path d="M275 190L495 182" stroke="#6d4c2f" stroke-width="10" stroke-linecap="round"/>
    <polygon points="488,162 528,168 522,202 486,192" fill="#7d9096" stroke="#183a30" stroke-width="3"/>
    <path class="flow" d="M445 96Q515 112 515 162"/>
    <!-- Safe miss goes into block/earth, NOT shins -->
    <path class="dash" d="M515 202v92"/>
    <!-- Clear blood circle indicator -->
    <circle cx="220" cy="236" r="46" fill="#e3f0ea" stroke="#183a30" stroke-width="3"/>
    <text class="sm" x="186" y="242">Kneel</text>
    <text x="72" y="88">1. Clear 360° blood circle</text>
    <text x="72" y="124">2. Kneel so misses hit earth</text>
    <text x="582" y="114">3. Solid chopping block</text>
    <text class="sm" x="582" y="150">absorbs through-swing</text>
    <text class="warn" x="622" y="236">NEVER hold wood</text><text class="warn" x="622" y="282">with bare hand!</text>
    </g>
<rect x="23" y="344" width="854" height="36" rx="7" fill="#f7e4d8"/>
<text class="guard" x="36" y="369">Use a low solid chopping block, wear eye protection, and stop when fatigued.</text>
</svg>
