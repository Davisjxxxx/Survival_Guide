<svg class="v02-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Why boiling concentrates algal and chemical toxins</title><desc id="desc">Cutaway boiling pot showing clean water vapor escaping upward while non-volatile cyanotoxins, heavy metals and nitrates become MORE concentrated in remaining liquid.</desc>
