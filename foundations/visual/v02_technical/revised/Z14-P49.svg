<title id="title">Mason jar rim, two-piece vacuum lid and headspace cutaway</title><desc id="desc">Exploded canning jar assembly showing inspected smooth glass rim, single-use flat sealing compound lid, reusable screw band tightened fingertip-tight, and measured headspace.</desc>
