<svg class="v02-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Knife and axe blade bevel geometry cross-section</title><desc id="desc">Three enlarged blade cross-sections contrasting a thin slicing bevel, a reinforced convex chopping bevel, and a rolled or chipped edge failure.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#972f22"/></marker><marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183a30"/></marker></defs>
<style>.v02-svg text{font-family:system-ui,sans-serif;font-size:20px;font-weight:650;fill:#183a30}.v02-svg .sm{font-size:17px;font-weight:600;fill:#2b473e}.v02-svg .warn{font-size:19px;font-weight:700;fill:#8c281b}.v02-svg .heading{font-size:19px;letter-spacing:0.8px;font-weight:750;fill:#183a30}.v02-svg .guard{font-size:15.5px;font-weight:650;fill:#6d301f}.v02-svg .leader{fill:none;stroke:#365c50;stroke-width:2.5}.v02-svg .flow{fill:none;stroke:#205b68;stroke-width:4;marker-end:url(#arr)}.v02-svg .rflow{fill:none;stroke:#972f22;stroke-width:4;marker-end:url(#arr-r)}.v02-svg .gflow{fill:none;stroke:#183a30;stroke-width:3.5;marker-end:url(#arr-g)}.v02-svg .dash{fill:none;stroke:#365c50;stroke-width:2.5;stroke-dasharray:10 7}</style>
<rect x="1" y="1" width="898" height="393" rx="16" fill="#f4f6ed" stroke="#99ad9b" stroke-width="2"/>
<text class="heading" x="26" y="34">Z09-P07 · V02 TECHNICAL ILLUSTRATION · NOT TO SCALE</text>
<g id="v02-artwork">
    <!-- 1. Thin slice bevel -->
    <polygon points="150,104 188,104 169,264" fill="#b7c8ce" stroke="#183a30" stroke-width="3.5"/>
    <text x="68" y="84">1. Thin slicing bevel</text>
    <text class="sm" x="64" y="294">Clean feather-cuts</text><text class="sm" x="62" y="316">Fragile if pried/twisted</text>
    <!-- 2. Reinforced convex axe bevel -->
    <path d="M415 104h70v66Q480 236 450 266Q420 236 415 170Z" fill="#a2b5bc" stroke="#183a30" stroke-width="3.5"/>
    <text x="352" y="84">2. Convex chop bevel</text>
    <text class="sm" x="355" y="294">More steel backs edge</text><text class="sm" x="358" y="316">Resists impact roll</text>
    <!-- 3. Rolled / chipped failure -->
    <path d="M708 104h42v124l-14 14l18 22l-36-6l12-26l-22-18Z" fill="#d9b2a7" stroke="#972f22" stroke-width="3.5"/>
    <circle cx="728" cy="252" r="24" fill="none" stroke="#972f22" stroke-width="3" stroke-dasharray="6 4"/>
    <text class="warn" x="642" y="84">3. Rolled / chipped edge</text>
    <text class="warn" x="638" y="294">Slips unpredictably</text><text class="sm" x="638" y="316">Stop and dress safely</text>
    </g>
<rect x="23" y="344" width="854" height="36" rx="7" fill="#f7e4d8"/>
<text class="guard" x="36" y="369">Never pry or strike rocks with blades; stop work if an edge rolls, chips or loosens.</text>
</svg>
