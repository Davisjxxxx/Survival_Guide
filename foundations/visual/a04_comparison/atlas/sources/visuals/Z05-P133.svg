<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Suspected Mushroom Poisoning and Delayed Symptoms</title>
  <desc id="desc">CONDITIONAL DECISION: Call Poison Help promptly | Report exposure time and changes | Call 911 for emergency signs — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z05-P133 · CONDITIONAL DECISION (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="conditional-artwork"><rect x="40" y="42" width="640" height="25" rx="5" fill="#dce8df" stroke="#285345"/><text x="360" y="59" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Collapse, seizure, trouble breathing, or unable to wake?</text><rect x="40" y="82" width="305" height="46" rx="6" fill="#f9faef" stroke="#688476"/><text x="66" y="104" font-size="10" font-weight="650" fill="#183c31" text-anchor="middle">YES</text><text x="93" y="101" font-size="11" font-weight="650" fill="#183c31" text-anchor="start">Call 911 immediately.</text><rect x="375" y="82" width="305" height="46" rx="6" fill="#f9faef" stroke="#688476"/><text x="401" y="104" font-size="10" font-weight="650" fill="#183c31" text-anchor="middle">NO</text><text x="428" y="101" font-size="11" font-weight="650" fill="#183c31" text-anchor="start">Call Poison Help promptly.</text><text x="360" y="149" font-size="11" font-weight="650" fill="#672d18" text-anchor="middle">Do not wait for symptoms or try home remedies.</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Call Poison Help</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">promptly</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Report exposure time and</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">changes</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Call 911 for emergency</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">signs</text></g>
  </g>
</svg>
