<svg class="v02-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Suspected internal bleeding and shock escalation cues</title><desc id="desc">Anatomical trunk orientation schematic highlighting high-energy blunt-impact compartments (chest, abdomen, pelvis) and urgent shock escalation signs.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#972f22"/></marker><marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183a30"/></marker></defs>
<style>.v02-svg text{font-family:system-ui,sans-serif;font-size:19px;font-weight:650;fill:#183a30}.v02-svg .sm{font-size:16.5px;font-weight:600;fill:#2b473e}.v02-svg .warn{font-size:18.5px;font-weight:700;fill:#8c281b}.v02-svg .heading{font-size:19px;letter-spacing:0.8px;font-weight:750;fill:#183a30}.v02-svg .guard{font-size:15.5px;font-weight:650;fill:#6d301f}.v02-svg .leader{fill:none;stroke:#365c50;stroke-width:2.5}.v02-svg .flow{fill:none;stroke:#205b68;stroke-width:4;marker-end:url(#arr)}.v02-svg .rflow{fill:none;stroke:#972f22;stroke-width:4;marker-end:url(#arr-r)}.v02-svg .gflow{fill:none;stroke:#183a30;stroke-width:3.5;marker-end:url(#arr-g)}.v02-svg .dash{fill:none;stroke:#365c50;stroke-width:2.5;stroke-dasharray:10 7}</style>
<rect x="1" y="1" width="898" height="393" rx="16" fill="#f4f6ed" stroke="#99ad9b" stroke-width="2"/>
<text class="heading" x="26" y="34">Z10-P19 · V02 TECHNICAL ILLUSTRATION · NOT TO SCALE</text>
<g id="v02-artwork">
    <!-- Torso outline -->
    <path d="M195 96Q255 76 315 96L340 202L325 296H185L170 202Z" fill="#e4c7a5" stroke="#684b35" stroke-width="4"/>
    <ellipse cx="255" cy="152" rx="58" ry="34" fill="#f7e4d8" stroke="#972f22" stroke-width="3" stroke-dasharray="7 5"/>
    <ellipse cx="255" cy="222" rx="54" ry="32" fill="#f7e4d8" stroke="#972f22" stroke-width="3" stroke-dasharray="7 5"/>
    <ellipse cx="255" cy="274" rx="56" ry="20" fill="#edce8a" stroke="#8c281b" stroke-width="3" stroke-dasharray="7 5"/>
    <text class="sm" x="228" y="158">Chest</text><text class="sm" x="215" y="228">Abdomen</text><text class="sm" x="228" y="280">Pelvis</text>
    <!-- Callouts right -->
    <rect x="410" y="82" width="445" height="232" rx="12" fill="#f7e4d8" stroke="#972f22" stroke-width="3"/>
    <text class="warn" x="434" y="118">Hidden internal bleed red flags:</text>
    <text x="434" y="156">• Rigid, swollen or tender abdomen</text>
    <text x="434" y="190">• Pale cool clammy skin, fast pulse</text>
    <text x="434" y="224">• Confusion, dizziness or fainting</text>
    <text class="warn" x="434" y="264">Action: Call 911/SAR immediately</text>
    <text class="sm" x="434" y="294">Keep flat, warm; NO food or drink</text>
    </g>
<rect x="23" y="344" width="854" height="36" rx="7" fill="#f7e4d8"/>
<text class="guard" x="36" y="369">External skin may show minimal bruising despite life-threatening internal blood loss; evacuate urgently.</text>
</svg>
