<title id="title">Pulley redirect: compare static resultant forces</title><desc id="desc">Comparison of two ideal fixed pulley diagrams with equal tension in two strands. Parallel downward pulls result in two T downward. Perpendicular pulls result in square root of two T along the bisector.</desc>
