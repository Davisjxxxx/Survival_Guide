<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Two-bucket emergency toilet beside a soap-and-water handwashing station</title>
<desc id="desc">A solid-waste bucket lined with two heavy bags, with dry cover material such as sawdust added after each use and a tight lid; a separate bucket for liquids; and a handwashing station with a spigot jug, soap and a catch basin right beside them. Hands are washed with soap and safe water after every use; alcohol rub does not replace handwashing after toilet, diaper or vomit tasks. Tied bags go into a lidded outdoor bin for disposal under local health rules, away from food areas, wells, gardens and storm drains. Conceptual, not to scale.</desc>
