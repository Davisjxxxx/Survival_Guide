<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Orient a map to true north with a baseplate compass</title>
<desc id="desc">Plan view with true north up the page in both panels. Panel 1: the map is turned away from true north. The baseplate edge lies on the map north-south neat line, the dial is set from map north with the declination correction applied, and the red needle is not yet inside the orienting arrow. Panel 2: map and compass have been turned together until the red needle overlays the orienting arrow; map north now points to true north, and sight lines from your position through the hill and lake symbols reach the real hill and lake. Magnetic north is shown east of true north with the angle exaggerated; use the current local declination. Conceptual drawing, not to scale.</desc>
