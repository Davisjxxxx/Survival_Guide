<svg class="v02-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Hidden biological, chemical and electrical floodwater hazards</title><desc id="desc">Cutaway of flooded basement and street water highlighting submerged energized electrical panels, sewage/fuel contamination, and sharp debris beneath opaque water.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#972f22"/></marker><marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183a30"/></marker></defs>
<style>.v02-svg text{font-family:system-ui,sans-serif;font-size:19px;font-weight:650;fill:#183a30}.v02-svg .sm{font-size:16.5px;font-weight:600;fill:#2b473e}.v02-svg .warn{font-size:18.5px;font-weight:700;fill:#8c281b}.v02-svg .heading{font-size:19px;letter-spacing:0.8px;font-weight:750;fill:#183a30}.v02-svg .guard{font-size:15.5px;font-weight:650;fill:#6d301f}.v02-svg .leader{fill:none;stroke:#365c50;stroke-width:2.5}.v02-svg .flow{fill:none;stroke:#205b68;stroke-width:4;marker-end:url(#arr)}.v02-svg .rflow{fill:none;stroke:#972f22;stroke-width:4;marker-end:url(#arr-r)}.v02-svg .gflow{fill:none;stroke:#183a30;stroke-width:3.5;marker-end:url(#arr-g)}.v02-svg .dash{fill:none;stroke:#365c50;stroke-width:2.5;stroke-dasharray:10 7}</style>
<rect x="1" y="1" width="898" height="393" rx="16" fill="#f4f6ed" stroke="#99ad9b" stroke-width="2"/>
<text class="heading" x="26" y="34">Z15-P28 · V02 TECHNICAL ILLUSTRATION · NOT TO SCALE</text>
<g id="v02-artwork">
    <!-- Flooded room cutaway -->
    <rect x="65" y="96" width="420" height="214" fill="#eef4f2" stroke="#183a30" stroke-width="3.5"/>
    <rect x="68" y="198" width="414" height="109" fill="#89a8b2" stroke="#205b68" stroke-width="3"/>
    <!-- Electrical panel half submerged -->
    <rect x="92" y="138" width="76" height="92" fill="#5e6b65" stroke="#972f22" stroke-width="4"/>
    <polygon points="130,152 118,182 132,182 124,212 146,176 132,176" fill="#edce8a" stroke="#972f22" stroke-width="2"/>
    <!-- Debris / sewage icons under murky water -->
    <polygon points="245,274 282,254 295,286" fill="#6d301f"/>
    <ellipse cx="385" cy="214" rx="54" ry="12" fill="#6b5a3c" opacity=".8"/>
    <text class="warn" x="182" y="166">Energized panel / outlets</text>
    <text class="sm" x="188" y="248">Hidden debris, fuel &amp; sewage</text>
    <!-- Right exclusion checklist -->
    <rect x="515" y="96" width="345" height="214" rx="12" fill="#f7e4d8" stroke="#972f22" stroke-width="3.5"/>
    <text class="warn" x="536" y="132">ZERO wading into floodwater:</text>
    <text x="536" y="170">• Lethal hidden shock hazard</text>
    <text x="536" y="206">• Raw sewage &amp; chemical spills</text>
    <text x="536" y="242">• Open manholes &amp; broken glass</text>
    <text class="warn" x="536" y="284">Utility / electrician clears power</text>
    </g>
<rect x="23" y="344" width="854" height="36" rx="7" fill="#f7e4d8"/>
<text class="guard" x="36" y="369">Never wade into a flooded basement to touch breakers or appliances; wait for utility/electrician clearance.</text>
</svg>
