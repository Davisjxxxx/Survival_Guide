<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Distinguish traditional steel-and-flint sparks from ferrocerium sparks</title>
  <desc id="desc">COMPARATIVE CONFIGURATION: Flint-and-steel: steel sheds sparks | Needs charred tinder -&gt; ember | Ferro rod: hotter alloy sparks — Conceptual illustration, not to scale.</desc>
