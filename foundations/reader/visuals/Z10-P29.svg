<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Identify concussion symptoms and enforce strict stop-activity observation</title>
  <desc id="desc">TIME / SEASONAL PROGRESSION: Any head impact + dazed/headache | Stop risky travel; continuous buddy watch | Escalate 911 if any symptom worsens — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z10-P29 · TIME / SEASONAL PROGRESSION (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="seasonal-timeline-storm_lead-artwork"><path d="M36 62h644" stroke="#184438" stroke-width="4" marker-end="url(#arrow)"/><circle cx="106.0" cy="62" r="8" fill="#184438" stroke="#fffdf7" stroke-width="2"/><text x="106.0" y="48" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Impact T+0</text><rect x="28" y="76" width="156" height="58" rx="6" fill="#d5e5dc" stroke="#315245" stroke-width="2"/><text x="106.0" y="98" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Stop risky travel;</text><text x="106.0" y="112" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">check daze/headache</text><circle cx="274.0" cy="62" r="8" fill="#184438" stroke="#fffdf7" stroke-width="2"/><text x="274.0" y="48" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Hours 1–4</text><rect x="196" y="76" width="156" height="58" rx="6" fill="#e4ebd4" stroke="#315245" stroke-width="2"/><text x="274.0" y="98" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Continuous buddy</text><text x="274.0" y="112" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">watch; log clarity</text><circle cx="442.0" cy="62" r="8" fill="#184438" stroke="#fffdf7" stroke-width="2"/><text x="442.0" y="48" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Supervised exit</text><rect x="364" y="76" width="156" height="58" rx="6" fill="#f4ebd2" stroke="#315245" stroke-width="2"/><text x="442.0" y="98" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">No solo travel,</text><text x="442.0" y="112" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">scrambling or</text><text x="442.0" y="126" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">driving</text><circle cx="610.0" cy="62" r="8" fill="#184438" stroke="#fffdf7" stroke-width="2"/><text x="610.0" y="48" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Medical review</text><rect x="532" y="76" width="156" height="58" rx="6" fill="#f5dfd5" stroke="#315245" stroke-width="2"/><text x="610.0" y="98" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Clinical clearance</text><text x="610.0" y="112" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">before risky</text><text x="610.0" y="126" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">activity</text><rect x="28" y="139" width="664" height="18" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360" y="152" font-size="10.8" font-weight="650" fill="#642e1e" text-anchor="middle">Worsening headache, vomiting, drowsiness or confusion -&gt; immediate 911</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Any head impact +</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">dazed/headache</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Stop risky travel;</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">continuous buddy watch</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Escalate 911 if any</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">symptom worsens</text></g>
  </g>
</svg>
