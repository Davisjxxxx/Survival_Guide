    <g id="system-boundary-panel_gen-artwork"><rect x="34" y="46" width="196" height="84" rx="7" fill="#dce8df" stroke="#184438" stroke-width="2.8"/><rect x="50" y="64" width="28" height="46" rx="3" fill="#fffdf7" stroke="#184438" stroke-width="2"/><path d="M234 88h92" stroke="#184438" stroke-width="3" stroke-dasharray="6 4"/><rect x="330" y="54" width="60" height="68" rx="6" fill="#f5f1e2" stroke="#7c6928" stroke-width="2.5"/><path d="M394 88h92" stroke="#8f381c" stroke-width="3" stroke-dasharray="6 4"/><rect x="490" y="46" width="196" height="84" rx="7" fill="#f7e6dc" stroke="#8f381c" stroke-width="2.8"/><rect x="42" y="58" width="194" height="58" rx="5" fill="#fffdf7" fill-opacity="0.88" stroke="#184438"/><text x="139" y="82" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">VENTED BATTERY SYSTEM</text><text x="139" y="96" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">Exact model and</text><text x="139" y="110" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">licensed installation</text><rect x="264" y="60" width="192" height="54" rx="5" fill="#fffdf7" fill-opacity="0.92" stroke="#7c6928"/><text x="360" y="82" font-size="11.2" font-weight="700" fill="#3d3312" text-anchor="middle">KEEP SPARKS AWAY No</text><text x="360" y="96" font-size="11.2" font-weight="700" fill="#3d3312" text-anchor="middle">action near active</text><text x="360" y="110" font-size="11.2" font-weight="700" fill="#3d3312" text-anchor="middle">failure</text><rect x="484" y="58" width="194" height="58" rx="5" fill="#fffdf7" fill-opacity="0.88" stroke="#8f381c"/><text x="581" y="82" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">ALARM OR HOT CASE</text><text x="581" y="96" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">Leave and call from</text><text x="581" y="110" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">safety</text><rect x="34" y="138" width="652" height="19" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360" y="151" font-size="10.8" font-weight="650" fill="#642e1e" text-anchor="middle">Installation, ventilation and protection depend on the battery system.</text></g>
