  <title id="title">Isolate vented lead-acid backup batteries from sparks and living spaces</title>
  <desc id="desc">SYSTEM SEPARATION &amp; BOUNDARY: Charging lead-acid vents hydrogen gas | Keep far from flames, sparks &amp; bedrooms | Cover terminals; licensed fusing required — Conceptual illustration, not to scale.</desc>
