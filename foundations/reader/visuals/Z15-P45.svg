<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Ration potable water and use community distribution hubs during extended water cuts</title>
  <desc id="desc">SYSTEM SEPARATION &amp; BOUNDARY: Never starve daily drinking hydration | Cut flush/dish waste via paper &amp; buckets | Refill sanitized food-grade jugs at hubs early — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z15-P45 · SYSTEM SEPARATION &amp; BOUNDARY (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="system-boundary-well_septic-artwork"><path d="M30 84L260 88L460 112L690 116V134H30Z" fill="#c9d5b8" stroke="#4f6549" stroke-width="2.2"/><rect x="92" y="46" width="22" height="82" fill="#d3e3ea" stroke="#184438" stroke-width="2.5"/><path d="M360 44v90" stroke="#8f381c" stroke-width="3.5" stroke-dasharray="7 5"/><rect x="492" y="92" width="170" height="32" rx="5" fill="#d9c6b0" stroke="#8f381c" stroke-width="2.2"/><rect x="42" y="58" width="194" height="58" rx="5" fill="#fffdf7" fill-opacity="0.88" stroke="#184438"/><text x="139" y="82" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">PROTECTED DRINKING</text><text x="139" y="96" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">Never starve daily</text><text x="139" y="110" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">body hydration</text><rect x="264" y="60" width="192" height="54" rx="5" fill="#fffdf7" fill-opacity="0.92" stroke="#7c6928"/><text x="360" y="82" font-size="11.2" font-weight="700" fill="#3d3312" text-anchor="middle">48-HR REFILL FLOOR</text><text x="360" y="96" font-size="11.2" font-weight="700" fill="#3d3312" text-anchor="middle">Sanitized jugs -&gt; POD</text><text x="360" y="110" font-size="11.2" font-weight="700" fill="#3d3312" text-anchor="middle">hub</text><rect x="484" y="58" width="194" height="58" rx="5" fill="#fffdf7" fill-opacity="0.88" stroke="#8f381c"/><text x="581" y="82" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">WASTE CUTS Paper</text><text x="581" y="96" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">plates, spigot wash,</text><text x="581" y="110" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">bucket toilet</text><rect x="34" y="138" width="652" height="19" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360" y="151" font-size="10.8" font-weight="650" fill="#642e1e" text-anchor="middle">Refill sanitized food-grade jugs at county hubs BEFORE home stocks run dry</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Never starve daily</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">drinking hydration</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Cut flush/dish waste via</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">paper &amp; buckets</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Refill sanitized food-</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">grade jugs at hubs early</text></g>
  </g>
</svg>
