<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Locate public cooling centers early and run twice-daily neighbor heat checks</title>
  <desc id="desc">SEQUENTIAL INSTRUCTIONAL PLATE: Map free AC libraries &amp; 211 centers early | Spend peak 11 a.m.–6 p.m. hours in AC | Check solo &amp; older neighbors twice daily — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z15-P40 · SEQUENTIAL INSTRUCTIONAL PLATE (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="sequence-plate-evac-artwork"><rect x="26" y="44" width="152" height="90" rx="8" fill="#dce8df" stroke="#285345" stroke-width="2.3"/><circle cx="44" cy="58" r="11" fill="#184438"/><text x="44" y="62" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">1</text><text x="61" y="58" font-size="11" font-weight="700" fill="#183c31" text-anchor="start">Find 211 AC</text><path d="M36 78h132" stroke="#9bb1a3" stroke-width="1.5"/><text x="102.0" y="95.0" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">Map free libraries,</text><text x="102.0" y="108.5" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">malls &amp; county</text><text x="102.0" y="122.0" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">centers</text><path d="M180 89h12" stroke="#184438" stroke-width="3" marker-end="url(#arrow)"/><rect x="196" y="44" width="152" height="90" rx="8" fill="#e3ece5" stroke="#285345" stroke-width="2.3"/><circle cx="214" cy="58" r="11" fill="#184438"/><text x="214" y="62" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">2</text><text x="231" y="58" font-size="11" font-weight="700" fill="#183c31" text-anchor="start">Peak hours</text><path d="M206 78h132" stroke="#9bb1a3" stroke-width="1.5"/><text x="272.0" y="95.0" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">Spend ~11 a.m.–6</text><text x="272.0" y="108.5" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">p.m. in cool AC</text><text x="272.0" y="122.0" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">spaces</text><path d="M350 89h12" stroke="#184438" stroke-width="3" marker-end="url(#arrow)"/><rect x="366" y="44" width="152" height="90" rx="8" fill="#eef2e4" stroke="#285345" stroke-width="2.3"/><circle cx="384" cy="58" r="11" fill="#184438"/><text x="384" y="62" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">3</text><text x="401" y="58" font-size="11" font-weight="700" fill="#183c31" text-anchor="start">Check 2x/day</text><path d="M376 78h132" stroke="#9bb1a3" stroke-width="1.5"/><text x="442.0" y="95.0" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">Call/knock on solo &amp;</text><text x="442.0" y="108.5" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">older neighbors</text><path d="M520 89h12" stroke="#184438" stroke-width="3" marker-end="url(#arrow)"/><rect x="536" y="44" width="152" height="90" rx="8" fill="#d5e4da" stroke="#285345" stroke-width="2.3"/><circle cx="554" cy="58" r="11" fill="#184438"/><text x="554" y="62" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">4</text><text x="571" y="58" font-size="11" font-weight="700" fill="#183c31" text-anchor="start">Escalate 911</text><path d="M546 78h132" stroke="#9bb1a3" stroke-width="1.5"/><text x="612.0" y="95.0" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">Unanswered check or</text><text x="612.0" y="108.5" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">confusion -&gt; call</text><text x="612.0" y="122.0" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">911</text><rect x="26" y="139" width="668" height="18" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360" y="152" font-size="10.8" font-weight="650" fill="#642e1e" text-anchor="middle">Verify accessible transit and pet/service-animal rules before heat peaks</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Map free AC libraries &amp;</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">211 centers early</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Spend peak 11 a.m.–6</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">p.m. hours in AC</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Check solo &amp; older</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">neighbors twice daily</text></g>
  </g>
</svg>
