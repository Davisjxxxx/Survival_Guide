<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Chronic Wasting Disease (CWD) Surveillance and Prion Precautions</title>
  <desc id="desc">SYSTEM SEPARATION &amp; BOUNDARY: Keep the lot separate | Follow the applicable testing and movement rules | Do not eat a positive animal — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z06-P39 · SYSTEM SEPARATION &amp; BOUNDARY (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="system-boundary-cwd_prion-artwork"><rect x="34" y="46" width="210" height="84" rx="8" fill="#dce8df" stroke="#184438" stroke-width="3"/><rect x="276" y="46" width="168" height="84" rx="6" fill="#eef1e6" stroke="#4f6c5d" stroke-width="2.5"/><rect x="476" y="46" width="210" height="84" rx="8" fill="#f7e6dc" stroke="#8f381c" stroke-width="3"/><rect x="42" y="58" width="194" height="58" rx="5" fill="#fffdf7" fill-opacity="0.88" stroke="#184438"/><text x="139" y="82" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">Keep untested lots</text><text x="139" y="96" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">separate</text><rect x="264" y="60" width="192" height="54" rx="5" fill="#fffdf7" fill-opacity="0.92" stroke="#7c6928"/><text x="360" y="82" font-size="11.2" font-weight="700" fill="#3d3312" text-anchor="middle">Do not eat a CWD-</text><text x="360" y="96" font-size="11.2" font-weight="700" fill="#3d3312" text-anchor="middle">positive animal</text><rect x="484" y="58" width="194" height="58" rx="5" fill="#fffdf7" fill-opacity="0.88" stroke="#8f381c"/><text x="581" y="82" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">Follow laboratory and</text><text x="581" y="96" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">DNR guidance</text><rect x="34" y="138" width="652" height="19" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360" y="151" font-size="10.8" font-weight="650" fill="#642e1e" text-anchor="middle">A negative test cannot clear unrelated food hazards</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Keep the lot separate</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Follow the applicable</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">testing and movement</text><text x="265" y="218" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">rules</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Do not eat a positive</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">animal</text></g>
  </g>
</svg>
