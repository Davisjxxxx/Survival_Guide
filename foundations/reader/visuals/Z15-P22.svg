<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Outdoor sirens versus indoor warning receivers at night</title>
<desc id="desc">Left: an outdoor warning siren on a pole sends sound to a person outside; sirens are designed only to alert people who are outdoors. The sound reaching a closed house is not designed to wake people inside. Inside the bedroom, a battery-backed NOAA Weather Radio on the nightstand and a phone with emergency alerts turned on sound the warning beside the sleeper. Conceptual, not to scale.</desc>
