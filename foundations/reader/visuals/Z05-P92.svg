<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Wild Carrot (Daucus carota) vs Lethal Poison Hemlock &amp; Water Hemlock STOP Card</title>
  <desc id="desc">DIAGNOSTIC LOOKALIKE CONTRAST PLATE: Check Daucus carota traits | Contrast Conium maculatum | Keep WITHHELD_HOLD — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z05-P92 · DIAGNOSTIC LOOKALIKE CONTRAST PLATE (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="lookalike-diagnostic-root_pair-artwork"><rect x="28" y="38" width="318" height="96" rx="7" fill="#e6efe8" stroke="#184438" stroke-width="2.6"/><rect x="28" y="38" width="318" height="23" rx="5" fill="#184438"/><text x="187" y="54" font-size="10.8" font-weight="650" fill="#fffdf7" text-anchor="middle">SUBJECT · Daucus carota (Wild Carrot)</text><text x="40" y="77" font-size="10.5" font-weight="650" fill="#183c31" text-anchor="start">1. Bristly hairy green stem + lacy</text><text x="40" y="90" font-size="10.5" font-weight="650" fill="#183c31" text-anchor="start">bracts</text><text x="40" y="106" font-size="10.5" font-weight="650" fill="#183c31" text-anchor="start">2. Extreme fatal lookalike overlap!</text><circle cx="360" cy="86" r="15" fill="#fffdf7" stroke="#642e1e" stroke-width="2.2"/><text x="360" y="90" font-size="10.5" font-weight="650" fill="#642e1e" text-anchor="middle">VS</text><rect x="374" y="38" width="318" height="96" rx="7" fill="#f9eae3" stroke="#8f381c" stroke-width="2.6" stroke-dasharray="7 4"/><rect x="374" y="38" width="318" height="23" rx="5" fill="#8f381c"/><text x="533" y="54" font-size="10.8" font-weight="650" fill="#fffdf7" text-anchor="middle">TOXIC LOOKALIKE · Conium &amp; Cicuta (Hemlocks)</text><text x="386" y="77" font-size="10.5" font-weight="650" fill="#642e1e" text-anchor="start">! Smooth spotted or chambered stem</text><text x="386" y="106" font-size="10.5" font-weight="650" fill="#642e1e" text-anchor="start">! RAPID SEIZURES, PARALYSIS, DEATH</text><rect x="28" y="139" width="664" height="18" rx="4" fill="#f7dfd6" stroke="#8f381c" stroke-width="1.6"/><text x="360" y="152" font-size="10.5" font-weight="650" fill="#642e1e" text-anchor="middle">STOP: Unconditional no-forage rule on ALL wild Apiaceae umbels</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Check Daucus carota</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">traits</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Contrast Conium</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">maculatum</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Keep WITHHELD_HOLD</text></g>
  </g>
</svg>
