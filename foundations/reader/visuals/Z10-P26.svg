<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Handle chemical and electrical burns with scene isolation before care</title>
  <desc id="desc">SYSTEM SEPARATION &amp; BOUNDARY: Electrical: stay back until confirmed safe | Chemical: label, SDS or Poison Control first | 911: electrical injury, eye or airway — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z10-P26 · SYSTEM SEPARATION &amp; BOUNDARY (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="system-boundary-panel_gen-artwork"><rect x="34" y="46" width="196" height="84" rx="7" fill="#dce8df" stroke="#184438" stroke-width="2.8"/><rect x="50" y="64" width="28" height="46" rx="3" fill="#fffdf7" stroke="#184438" stroke-width="2"/><path d="M234 88h92" stroke="#184438" stroke-width="3" stroke-dasharray="6 4"/><rect x="330" y="54" width="60" height="68" rx="6" fill="#f5f1e2" stroke="#7c6928" stroke-width="2.5"/><path d="M394 88h92" stroke="#8f381c" stroke-width="3" stroke-dasharray="6 4"/><rect x="490" y="46" width="196" height="84" rx="7" fill="#f7e6dc" stroke="#8f381c" stroke-width="2.8"/><rect x="42" y="58" width="194" height="58" rx="5" fill="#fffdf7" fill-opacity="0.88" stroke="#184438"/><text x="139" y="82" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">ELECTRICAL HAZARD Stay</text><text x="139" y="96" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">back until confirmed</text><text x="139" y="110" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">safe</text><rect x="264" y="60" width="192" height="54" rx="5" fill="#fffdf7" fill-opacity="0.92" stroke="#7c6928"/><text x="360" y="82" font-size="11.2" font-weight="700" fill="#3d3312" text-anchor="middle">CHEMICAL CARE Label,</text><text x="360" y="96" font-size="11.2" font-weight="700" fill="#3d3312" text-anchor="middle">SDS or Poison Control</text><rect x="484" y="58" width="194" height="58" rx="5" fill="#fffdf7" fill-opacity="0.88" stroke="#8f381c"/><text x="581" y="82" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">EMERGENCY CARE 911:</text><text x="581" y="96" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">electrical, eye,</text><text x="581" y="110" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">airway</text><rect x="34" y="138" width="652" height="19" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360" y="151" font-size="10.8" font-weight="650" fill="#642e1e" text-anchor="middle">Never touch an energized victim; ask before wetting dry or water-reactive chemicals</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Electrical: stay back</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">until confirmed safe</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Chemical: label, SDS or</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Poison Control first</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">911: electrical injury,</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">eye or airway</text></g>
  </g>
</svg>
