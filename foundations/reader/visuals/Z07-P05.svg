iddle">Most native wildlife is legally protected</text><rect x="356" y="139" width="336" height="18" rx="4" fill="#faeee5" stroke="#a05332"/><text x="524" y="152" font-size="10.4" font-weight="650" fill="#642e1e" text-anchor="middle">Report rare-species threats to MN DNR</text></g>
