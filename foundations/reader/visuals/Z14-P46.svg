<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Separate low-acid foods (pressure canner ONLY) from high-acid foods</title>
  <desc id="desc">CONDITIONAL DECISION: pH &gt; 4.6 (meat/veg/beans) -&gt; PRESSURE ONLY | pH ≤ 4.6 (fruits/pickles) -&gt; tested water bath | 212°F boiling NEVER kills botulinum spores — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z14-P46 · CONDITIONAL DECISION (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="conditional-artwork"><rect x="40" y="42" width="640" height="25" rx="5" fill="#dce8df" stroke="#285345"/><text x="360" y="59" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Is the food naturally high-acid (pH ≤4.6) or USDA-acidified?</text><rect x="40" y="82" width="305" height="46" rx="6" fill="#f9faef" stroke="#688476"/><text x="66" y="104" font-size="10" font-weight="650" fill="#183c31" text-anchor="middle">YES</text><text x="93" y="101" font-size="11" font-weight="650" fill="#183c31" text-anchor="start">Process per exact tested</text><text x="93" y="114" font-size="11" font-weight="650" fill="#183c31" text-anchor="start">boiling-water or steam-</text><text x="93" y="127" font-size="11" font-weight="650" fill="#183c31" text-anchor="start">canning recipe</text><rect x="375" y="82" width="305" height="46" rx="6" fill="#f9faef" stroke="#688476"/><text x="401" y="104" font-size="10" font-weight="650" fill="#183c31" text-anchor="middle">NO</text><text x="428" y="101" font-size="11" font-weight="650" fill="#183c31" text-anchor="start">LOW-ACID (pH &gt;4.6:</text><text x="428" y="114" font-size="11" font-weight="650" fill="#183c31" text-anchor="start">meat/veg/soup) -&gt; PRESSURE</text><text x="428" y="127" font-size="11" font-weight="650" fill="#183c31" text-anchor="start">CANNER ONLY (240°F+)</text><text x="360" y="149" font-size="11" font-weight="650" fill="#672d18" text-anchor="middle">Boiling water (212°F) NEVER kills Clostridium botulinum spores — no exceptions</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">pH &gt; 4.6</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">(meat/veg/beans) -&gt;</text><text x="32" y="218" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">PRESSURE ONLY</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">pH ≤ 4.6</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">(fruits/pickles) -&gt;</text><text x="265" y="218" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">tested water bath</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">212°F boiling NEVER</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">kills botulinum spores</text></g>
  </g>
</svg>
