<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Dial gauge accuracy and weighted gauge settings on a pressure canner</title>
<desc id="desc">Left: a dial gauge with a 0 to 20 pound scale. An untested gauge reads 11 pounds while the true canner pressure is 9 pounds; a gauge that reads high causes under-processing. Dial gauges are checked for accuracy each year before use, adjusted when off by up to 2 pounds and replaced when off by more. Right: a weighted gauge on the vent pipe rocks or jiggles as the maker describes and needs no accuracy check; above 1,000 feet the tested table calls for the next heavier weight. Conceptual, not to scale.</desc>
