<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Natural Plant Toxins: Oxalates, Cyanogenic Compounds, Tannins and Alkaloids</title>
  <desc id="desc">COMPARATIVE CONFIGURATION: Classify major phytotoxin families | Separate raw hazard from folklore | Keep processing on specialist HOLD — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z05-P13 · COMPARATIVE CONFIGURATION (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="comparison-artwork"><rect x="30" y="44" width="208" height="104" rx="8" fill="#dce8df" stroke="#315245" stroke-width="2.5"/><rect x="30" y="44" width="208" height="24" rx="6" fill="#285345"/><text x="134.0" y="60" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">Oxalates / Tannins</text><text x="40" y="84" font-size="11.5" font-weight="600" fill="#183c31" text-anchor="start">Mouth burn &amp; GI/kidney</text><text x="40" y="98" font-size="11.5" font-weight="600" fill="#183c31" text-anchor="start">stress</text><rect x="38" y="122" width="192" height="20" rx="4" fill="#faeee5" stroke="#a05332"/><text x="134.0" y="136" font-size="10" font-weight="650" fill="#7a2f15" text-anchor="middle">Part/stage dependent; HOLD</text><rect x="256" y="44" width="208" height="104" rx="8" fill="#e5e9d5" stroke="#315245" stroke-width="2.5"/><rect x="256" y="44" width="208" height="24" rx="6" fill="#285345"/><text x="360.0" y="60" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">Cyanogenic / Saponin</text><text x="266" y="84" font-size="11.5" font-weight="600" fill="#183c31" text-anchor="start">Pits, wilted leaves,</text><text x="266" y="98" font-size="11.5" font-weight="600" fill="#183c31" text-anchor="start">raw stems</text><rect x="264" y="122" width="192" height="20" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360.0" y="136" font-size="10" font-weight="650" fill="#7a2f15" text-anchor="middle">Never chew pits or raw stems</text><rect x="482" y="44" width="208" height="104" rx="8" fill="#e4e8ee" stroke="#315245" stroke-width="2.5"/><rect x="482" y="44" width="208" height="24" rx="6" fill="#285345"/><text x="586.0" y="60" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">Alkaloids / Glycosides</text><text x="492" y="84" font-size="11.5" font-weight="600" fill="#183c31" text-anchor="start">Hemlock, yew,</text><text x="492" y="98" font-size="11.5" font-weight="600" fill="#183c31" text-anchor="start">nightshade</text><rect x="490" y="122" width="192" height="20" rx="4" fill="#faeee5" stroke="#a05332"/><text x="586.0" y="136" font-size="10" font-weight="650" fill="#7a2f15" text-anchor="middle">Rapid seizures/cardiac arrest</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Classify major</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">phytotoxin families</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Separate raw hazard from</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">folklore</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Keep processing on</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">specialist HOLD</text></g>
  </g>
