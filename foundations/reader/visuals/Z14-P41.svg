<text x="462" y="276" class="tiny">hard cheeses</text>
<g data-row="hard cheeses" data-col="ice crystals" data-result="refreeze"><circle cx="692" cy="271" r="9" fill="#fff" stroke="#205b68" stroke-width="2.6"/><path d="M687.5 271L691.1 274.8L696.7 267.4" fill="none" stroke="#205b68" stroke-width="3"/><text x="706" y="276" class="tiny">refreeze</text></g>
<g data-row="hard cheeses" data-col="over 40 F for 2 h" data-result="refreeze"><circle cx="790" cy="271" r="9" fill="#fff" stroke="#205b68" stroke-width="2.6"/><path d="M785.5 271L789.1 274.8L794.7 267.4" fill="none" stroke="#205b68" stroke-width="3"/><text x="804" y="276" class="tiny">refreeze</text></g>
<text x="462" y="322" class="tiny">sample rows: use the full printed chart</text>
<rect x="24" y="345" width="852" height="32" rx="4" fill="#f7e5d9"/>
