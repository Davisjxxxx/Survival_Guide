<text x="462" y="236" class="tiny">ice cream, frozen yogurt</text>
<g data-row="ice cream, frozen yogurt" data-col="ice crystals" data-result="discard"><circle cx="692" cy="231" r="9" fill="#fff" stroke="#8b3825" stroke-width="2.6"/><path d="M688 226.9L696 235.1M696 226.9L688 235.1" stroke="#8b3825" stroke-width="3"/><text x="706" y="236" class="tiny">discard</text></g>
<g data-row="ice cream, frozen yogurt" data-col="over 40 F for 2 h" data-result="discard"><circle cx="790" cy="231" r="9" fill="#fff" stroke="#8b3825" stroke-width="2.6"/><path d="M786 226.9L794 235.1M794 226.9L786 235.1" stroke="#8b3825" stroke-width="3"/><text x="804" y="236" class="tiny">discard</text></g>
