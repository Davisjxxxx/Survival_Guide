  <title id="title">Distinguish firm upland edges from quaking bogs, fens and deep marsh muck</title>
  <desc id="desc">CUTAWAY VIEW: Floating sphagnum bog mat | Deep cold muck &amp; hidden water | Stay on firm upland mineral ridge — Conceptual illustration, not to scale.</desc>
