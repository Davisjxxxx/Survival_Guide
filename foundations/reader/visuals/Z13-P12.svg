<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Set realistic expectations for portable solar recharging in Upper Midwest winters</title>
  <desc id="desc">TIME / SEASONAL PROGRESSION: Match Voc limits to battery manual | Winter clouds &amp; short days slash watts | Keep battery warm indoors; plan backup — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
