<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Respirable Crystalline Silica and Fibrous Mineral Stop Rules</title>
  <desc id="desc">GEOLOGICAL STRATA &amp; MATERIAL PROFILE: Recognize silica and fibrous veins | Avoid dry breaking or grinding | Isolate dust and wash hands — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z08-P06 · GEOLOGICAL STRATA &amp; MATERIAL PROFILE (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="geological-strata-dust_hazard-artwork"><rect x="28" y="38" width="236" height="96" rx="6" fill="#f7f4ea" stroke="#2c4b3f" stroke-width="2.2"/><path d="M46 118l44-24 26 24Z" fill="#9ea39b" stroke="#263d35" stroke-width="2"/><circle cx="118" cy="76" r="22" fill="#f2d6cc" stroke="#8f381c" stroke-width="2.2" stroke-dasharray="4 3"/><circle cx="152" cy="64" r="16" fill="#f7e4dc" stroke="#8f381c" stroke-width="1.8" stroke-dasharray="3 3"/><path d="M194 48v76" stroke="#8f381c" stroke-width="3" stroke-dasharray="6 4"/><text x="228" y="90" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">PPE</text><path d="M38 128h46M38 124v8M84 124v8" stroke="#183c31" stroke-width="1.8"/><rect x="278" y="38" width="414" height="28" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="278" y="38" width="26" height="28" rx="4" fill="#184438"/><text x="291" y="56" font-size="11" font-weight="650" fill="#fffdf7" text-anchor="middle">1</text><text x="314" y="56" font-size="11" font-weight="650" fill="#183c31" text-anchor="start">Fractured quartz/chert -&gt; silica dust</text><rect x="278" y="71" width="414" height="28" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="278" y="71" width="26" height="28" rx="4" fill="#184438"/><text x="291" y="89" font-size="11" font-weight="650" fill="#fffdf7" text-anchor="middle">2</text><text x="314" y="89" font-size="11" font-weight="650" fill="#183c31" text-anchor="start">Fibrous veins -&gt; possible asbestos</text><rect x="278" y="104" width="414" height="28" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="278" y="104" width="26" height="28" rx="4" fill="#184438"/><text x="291" y="122" font-size="11" font-weight="650" fill="#fffdf7" text-anchor="middle">3</text><text x="314" y="122" font-size="11" font-weight="650" fill="#183c31" text-anchor="start">Upwind exclusion &amp; wet/PPE control</text><rect x="28" y="139" width="320" height="18" rx="4" fill="#dceadf" stroke="#184438"/><text x="188" y="152" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="middle">Observe intact; avoid dry grinding</text><rect x="358" y="139" width="334" height="18" rx="4" fill="#faeee5" stroke="#a05332"/><text x="525" y="152" font-size="10.4" font-weight="650" fill="#642e1e" text-anchor="middle">STOP: Leave fibrous mineral veins intact</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Recognize silica and</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">fibrous veins</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Avoid dry breaking or</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">grinding</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Isolate dust and wash</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">hands</text></g>
  </g>
</svg>
