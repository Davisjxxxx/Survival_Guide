<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Carbon monoxide from improvised indoor heat</title>
<desc id="desc">Left: a closed room heated with an open gas oven, a charcoal grill and a camp stove. Carbon monoxide spreads through the room and reaches a person asleep on a couch; it is colourless and odourless and a cracked window does not clear it. Right: when home heat fails, people stay in warm layers in one interior room and go early to a warming centre or another place with power. Conceptual, not to scale.</desc>
