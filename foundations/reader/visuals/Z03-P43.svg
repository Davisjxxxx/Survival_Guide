<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Use non-combustion signals and lighting when fires are banned or unsafe</title>
  <desc id="desc">COMPARATIVE CONFIGURATION: LED light + spare batteries | Whistle &amp; high-vis fabric | Safe electronic/visual signaling — Conceptual illustration, not to scale.</desc>
