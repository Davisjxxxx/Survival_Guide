<svg class="v01-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Drainage and high refuge</title><desc id="desc">The flood path stays in the drainage. A separate dry route on the higher slope moves away from it.</desc>
