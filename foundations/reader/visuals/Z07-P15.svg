<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Recognizing Shoreline, Culvert, Bait-Pile and Cubby Hazard Cues</title>
  <desc id="desc">WILDLIFE SIGN, TRACK &amp; HABITAT PLATE: Watch for flagged stakes and cubbies | Detect strong fish or musk lure | Route wide without touching — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z07-P15 · WILDLIFE SIGN, TRACK &amp; HABITAT PLATE (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="wildlife-track-habitat_layers-artwork"><rect x="28" y="38" width="206" height="96" rx="6" fill="#f6f4eb" stroke="#2c4b3f" stroke-width="2.2"/><path d="M32 76L94 82L152 108L230 120V130H32Z" fill="#c7d4b6" stroke="#315245" stroke-width="1.8"/><path d="M126 94H230V120L152 108Z" fill="#a8cad4" opacity="0.8"/><path d="M54 76V52M46 64l8-14 8 14M74 78V56M66 68l8-14 8 14" stroke="#184438" stroke-width="2" fill="none"/><path d="M38 126h100M38 121v8M63 123v6M88 121v8M113 123v6M138 121v8" stroke="#183c31" stroke-width="1.6"/><rect x="248" y="38" width="216" height="44" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="248" y="38" width="22" height="44" rx="4" fill="#184438"/><text x="259" y="64" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">1</text><text x="276" y="56" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">Flagged stakes or marked</text><text x="276" y="70" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">saplings</text><rect x="472" y="38" width="216" height="44" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="472" y="38" width="22" height="44" rx="4" fill="#184438"/><text x="483" y="64" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">2</text><text x="500" y="56" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">Stick/box cubby or narrow</text><text x="500" y="70" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">funnel</text><rect x="248" y="88" width="216" height="44" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="248" y="88" width="22" height="44" rx="4" fill="#184438"/><text x="259" y="114" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">3</text><text x="276" y="106" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">Freshly raked dirt or</text><text x="276" y="120" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">wired anchor</text><rect x="472" y="88" width="216" height="44" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="472" y="88" width="22" height="44" rx="4" fill="#184438"/><text x="483" y="114" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">4</text><text x="500" y="106" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">Strong fish, musk, or</text><text x="500" y="120" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">carrion odor</text><rect x="28" y="139" width="290" height="18" rx="4" fill="#dceadf" stroke="#184438"/><text x="173" y="152" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="middle">Recognize early from safe trail</text><rect x="328" y="139" width="364" height="18" rx="4" fill="#faeee5" stroke="#a05332"/><text x="510" y="152" font-size="10.4" font-weight="650" fill="#642e1e" text-anchor="middle">Route wide; never inspect close-up</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Watch for flagged stakes</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">and cubbies</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Detect strong fish or</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">musk lure</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Route wide without</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">touching</text></g>
  </g>
</svg>
