<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Forward azimuth and exact reciprocal</title><desc id="desc">With the same north reference at both points, the A to B line has a 060 degree azimuth and the B to A line is its 240 degree reciprocal.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b3825"/></marker></defs>
<style>text{font:650 20px system-ui,sans-serif;fill:#183a30}.small{font-size:18px}.warn{fill:#8b3825}.arrow{stroke:#205b68;stroke-width:4;fill:none;marker-end:url(#a)}.reverse{stroke:#8b3825;stroke-width:4;fill:none;marker-end:url(#b)}</style>
<rect x="1" y="1" width="898" height="393" rx="12" fill="#f2f3e9" stroke="#789481" stroke-width="2"/>
<text x="24" y="32" class="small">Z11-P30 · TECHNICAL REVIEW · NOT TO SCALE</text>
<line x1="142" y1="287" x2="142" y2="94" stroke="#628073" stroke-dasharray="6 5" stroke-width="2"/><line x1="454" y1="107" x2="454" y2="62" stroke="#628073" stroke-dasharray="6 5" stroke-width="2"/><path d="M142 287L453.769 107" stroke="#205b68" stroke-width="5"/><path d="M231 235.6L346 169.2" class="arrow"/><path d="M367 157.1L255 221.8" class="reverse"/><path d="M142 221A66 66 0 0 1 199.158 254" fill="none" stroke="#205b68" stroke-width="3"/><circle id="azimuth-start" cx="142" cy="287" r="8" fill="#205b68"/><circle id="azimuth-end" cx="453.769" cy="107" r="8" fill="#8b3825"/><text x="128" y="81">N</text><text x="443" y="57">N</text><text x="91" y="320">Point A</text><text x="471" y="115">Landmark B</text><text x="226" y="264">060° forward</text><text x="493" y="193" class="warn">240° reciprocal</text><text x="493" y="224" class="small">Use the same north reference.</text>
<rect x="24" y="345" width="852" height="32" rx="4" fill="#f7e5d9"/><text x="37" y="367" class="small">A reciprocal differs by 180°. Confirm reference and landmark before travel.</text>
</svg>
