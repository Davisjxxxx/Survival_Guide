    <g id="hazard-exclusion-quarry-artwork"><rect x="28" y="38" width="224" height="96" rx="6" fill="#eef3ec" stroke="#285345" stroke-width="2.2"/><circle cx="140" cy="86" r="40" fill="#dceadf" stroke="#285345" stroke-width="2"/><circle cx="140" cy="86" r="24" fill="#f5e6c8" stroke="#7c6928" stroke-width="2" stroke-dasharray="5 3"/><circle cx="140" cy="86" r="10" fill="#d97254" stroke="#8f381c" stroke-width="2"/><path d="M44 62V44" stroke="#183c31" stroke-width="2" marker-end="url(#arrow)"/><text x="54" y="52" font-size="10" font-weight="650" fill="#183c31" text-anchor="middle">N</text><rect x="266" y="38" width="426" height="28" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="266" y="38" width="26" height="28" rx="4" fill="#8f381c"/><text x="279" y="56" font-size="10.8" font-weight="650" fill="#fffdf7" text-anchor="middle">1</text><text x="302" y="56" font-size="10.8" font-weight="650" fill="#183c31" text-anchor="start">Active quarry highwall &amp; pit: zero entry</text><rect x="266" y="71" width="426" height="28" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="266" y="71" width="26" height="28" rx="4" fill="#285345"/><text x="279" y="89" font-size="10.8" font-weight="650" fill="#fffdf7" text-anchor="middle">2</text><text x="302" y="89" font-size="10.8" font-weight="650" fill="#183c31" text-anchor="start">Highway shoulder: traffic strike zone</text><rect x="266" y="104" width="426" height="28" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="266" y="104" width="26" height="28" rx="4" fill="#285345"/><text x="279" y="122" font-size="10.8" font-weight="650" fill="#fffdf7" text-anchor="middle">3</text><text x="302" y="122" font-size="10.8" font-weight="650" fill="#183c31" text-anchor="start">Permitted low-slope site: lawful study</text><rect x="28" y="139" width="318" height="18" rx="4" fill="#dceadf" stroke="#184438"/><text x="187" y="152" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="middle"