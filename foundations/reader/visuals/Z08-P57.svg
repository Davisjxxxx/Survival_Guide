    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Secure explicit</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">landowner permission</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Exclude active quarries</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">and traffic</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Stay clear of vertical</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">pit walls</text></g>
