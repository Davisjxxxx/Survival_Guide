<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Private Land Permission, Gravel Pits and Quarry Hazards</title>
  <desc id="desc">SPATIAL HAZARD &amp; EXCLUSION ZONE MAP: Secure explicit landowner permission | Exclude active quarries and traffic | Stay clear of vertical pit walls — Conceptual illustration, not to scale.</desc>
