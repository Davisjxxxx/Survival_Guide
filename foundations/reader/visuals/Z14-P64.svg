  <title id="title">Package frozen foods airtight with expansion headspace and freeze fast at 0°F</title>
  <desc id="desc">CUTAWAY VIEW: Thick vapor-barrier wrap; press air out | Leave ½–1½ in liquid expansion headspace | Freeze fast spaced at ≤0°F (2–3 lb/cu ft) — Conceptual illustration, not to scale.</desc>
