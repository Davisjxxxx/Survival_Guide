<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Treat every USDA/NCHFP tested canning recipe as one indivisible system</title>
  <desc id="desc">SYSTEM SEPARATION &amp; BOUNDARY: Recipe + pH + cut + jar + headspace + PSI | Altering ANY variable breaks thermal safety | No tested recipe -&gt; FREEZE instead — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z14-P45 · SYSTEM SEPARATION &amp; BOUNDARY (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="system-boundary-canning_pressure-artwork"><rect x="44" y="50" width="206" height="82" rx="8" fill="#dbe6ea" stroke="#184438" stroke-width="3"/><path d="M40 50h214" stroke="#184438" stroke-width="6"/><circle cx="147" cy="44" r="9" fill="#fffdf7" stroke="#184438" stroke-width="2"/><rect x="280" y="54" width="160" height="74" rx="6" fill="#f5f1e2" stroke="#7c6928" stroke-width="2.5"/><rect x="470" y="50" width="206" height="82" rx="8" fill="#faeee5" stroke="#8f381c" stroke-width="2.8"/><rect x="42" y="58" width="194" height="58" rx="5" fill="#fffdf7" fill-opacity="0.88" stroke="#184438"/><text x="139" y="82" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">TESTED SYSTEM (LOCKED)</text><text x="139" y="96" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">Exact recipe, pH, cut,</text><text x="139" y="110" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">jar, headspace</text><rect x="264" y="60" width="192" height="54" rx="5" fill="#fffdf7" fill-opacity="0.92" stroke="#7c6928"/><text x="360" y="82" font-size="11.2" font-weight="700" fill="#3d3312" text-anchor="middle">HEAT PENETRATION No</text><text x="360" y="96" font-size="11.2" font-weight="700" fill="#3d3312" text-anchor="middle">flour/oil/jar tweaks</text><rect x="484" y="58" width="194" height="58" rx="5" fill="#fffdf7" fill-opacity="0.88" stroke="#8f381c"/><text x="581" y="82" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">UNTESTED DISHES</text><text x="581" y="96" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">Preserve safely by</text><text x="581" y="110" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">FREEZING</text><rect x="34" y="138" width="652" height="19" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360" y="151" font-size="10.8" font-weight="650" fill="#642e1e" text-anchor="middle">Altering ingredients, thickeners or jar sizes breaks validated botulism lethality</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Recipe + pH + cut + jar</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">+ headspace + PSI</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Altering ANY variable</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">breaks thermal safety</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">No tested recipe -&gt;</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">FREEZE instead</text></g>
  </g>
</svg>
