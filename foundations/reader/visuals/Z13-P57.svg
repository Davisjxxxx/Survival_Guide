<path d="M650 236c-18.2 0 -20.8 -18.2 -10.4 -31.2c2.6 7.8 7.8 10.4 7.8 2.6c0 -10.4 7.8 -15.6 13 -20.8c-2.6 13 10.4 18.2 7.8 33.8c-1.3 10.4 -10.4 15.6 -18.2 15.6z" fill="#e0703a" stroke="#8b3825" stroke-width="1.6"/><path d="M650 233.4c-6.5 0 -7.8 -7.8 -2.6 -13c1.3 3.9 5.2 5.2 6.5 0c1.3 6.5 0 13 -3.9 13z" fill="#f6c453"/>
<path d="M704 236c-14 0 -16 -14 -8 -24c2 6 6 8 6 2c0 -8 6 -12 10 -16c-2 10 8 14 6 26c-1 8 -8 12 -14 12z" fill="#e0703a" stroke="#8b3825" stroke-width="1.6"/><path d="M704 234c-5 0 -6 -6 -2 -10c1 3 4 4 5 0c1 5 0 10 -3 10z" fill="#f6c453"/>
<text x="560" y="120" class="tiny inv">smoke filling the room</text>
<text x="744" y="176" class="tiny">fire beyond</text>
<text x="744" y="197" class="tiny">one object</text>
<text x="532" y="264" class="tiny">no clear way out</text>
<text x="532" y="285" class="tiny">extinguisher empty or fire</text>
<text x="532" y="306" class="tiny">not out at once</text>
<rect x="24" y="345" width="852" height="32" rx="4" fill="#f7e5d9"/>
<text x="37" y="367" class="small">If unsure, or the fire is not small and contained: alert others, get out, call 911.</text>
</g>
</svg>
