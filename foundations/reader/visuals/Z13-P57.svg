<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">When a portable extinguisher is an option, and when to leave</title>
<desc id="desc">Left: a small fire confined to one pan or wastebasket. The user has alerted others, the fire department has been called, the user stands with a clear escape route behind them and sprays at the base of the fire. Below, the four PASS steps: pull the pin, aim low at the base, squeeze slowly and evenly, sweep side to side. Right: smoke filling the room, fire spreading beyond one object, or no clear escape route means leaving and calling 911. Conceptual, not to scale.</desc>
<defs><marker id="m-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="m-reverse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b3825"/></marker><marker id="m-load" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3b3b3b"/></marker><marker id="m-air" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6b7f8c"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183a30"/></marker></defs>
<style>text{font:650 19px system-ui,sans-serif;fill:#183a30}.small{font-size:17px}.tiny{font-size:15px}.head{font-size:18px;letter-spacing:.4px}.warn{fill:#8b3825}.ok{fill:#205b68}.mute{fill:#4c5d55}.inv{fill:#ffffff}.lead{fill:none;stroke:#365c50;stroke-width:1.6}</style>
<rect x="1" y="1" width="898" height="393" rx="12" fill="#f2f3e9" stroke="#789481" stroke-width="2"/>
<text x="24" y="32" class="small">Z13-P57 · TECHNICAL REVIEW · NOT TO SCALE</text>
<g id="z13-p57-artwork">
<rect x="24" y="46" width="470" height="290" rx="10" fill="#e7f0ea" stroke="#7ea08d" stroke-width="1.6"/>
<text x="40" y="72" class="head ok">✓ ONLY IF ALL ARE TRUE</text>
<rect x="512" y="46" width="364" height="290" rx="10" fill="#fbeee7" stroke="#c08a72" stroke-width="1.6"/>
<text x="528" y="72" class="head warn">✕ LEAVE, THEN CALL 911</text>
<rect x="40" y="88" width="438" height="148" fill="#f5f2e8" stroke="#183a30" stroke-width="2.2"/><rect x="40" y="228" width="438" height="8" fill="#cbbf9f"/>
<rect x="46" y="128" width="30" height="100" fill="#b6c9b9" stroke="#183a30" stroke-width="2"/><circle cx="70" cy="180" r="2.6" fill="#183a30"/>
<text x="84" y="110" class="tiny">clear escape route</text>
<text x="84" y="131" class="tiny">behind you</text>
<path class="lead" d="M90 118L64 128"/>
<circle cx="150" cy="139" r="11" fill="#4d6a78"/><path d="M137 152h26l3 40h-8l-.0 36h-7l-2-30l-2 30h-7v-36h-8z" fill="#4d6a78"/>
<rect x="166" y="162" width="18" height="40" rx="6" fill="#c0392b" stroke="#183a30" stroke-width="2"/><path d="M184 170q22-4 40 16" fill="none" stroke="#183a30" stroke-width="3"/>
<path d="M226 188L330 216" stroke="#e8e8e8" stroke-width="16" stroke-linecap="round" opacity=".9"/>
<path d="M226 188L326 214" fill="none" stroke="#183a30" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#m-ink)"/>
<path d="M326 228h56l-6-16h-44z" fill="#6b6b6b" stroke="#183a30" stroke-width="2"/>
<path d="M354 212c-11.9 0 -13.6 -11.9 -6.8 -20.4c1.7 5.1 5.1 6.8 5.1 1.7c0 -6.8 5.1 -10.2 8.5 -13.6c-1.7 8.5 6.8 11.9 5.1 22.1c-0.8 6.8 -6.8 10.2 -11.9 10.2z" fill="#e0703a" stroke="#8b3825" stroke-width="1.6"/><path d="M354 210.3c-4.2 0 -5.1 -5.1 -1.7 -8.5c0.8 2.5 3.4 3.4 4.2 0c0.8 4.2 0 8.5 -2.5 8.5z" fill="#f6c453"/>
<text x="318" y="110" class="tiny">small fire in one</text>
<text x="318" y="131" class="tiny">pan or wastebasket</text>
<path class="lead" d="M350 120L354 180"/>
<circle cx="57" cy="256" r="12" fill="#183a30"/><text x="57" y="262" class="small inv" text-anchor="middle">P</text>
<text x="76" y="262" class="tiny">pull the pin</text>
<circle cx="283" cy="256" r="12" fill="#183a30"/><text x="283" y="262" class="small inv" text-anchor="middle">A</text>
<text x="302" y="262" class="tiny">aim at the base</text>
<circle cx="57" cy="284" r="12" fill="#183a30"/><text x="57" y="290" class="small inv" text-anchor="middle">S</text>
<text x="76" y="290" class="tiny">squeeze slowly</text>
<circle cx="283" cy="284" r="12" fill="#183a30"/><text x="283" y="290" class="small inv" text-anchor="middle">S</text>
<text x="302" y="290" class="tiny">sweep side to side</text>
<text x="44" y="324" class="tiny">also: others alerted, 911 called, able, safe from smoke</text>
<rect x="530" y="88" width="330" height="150" fill="#f5f2e8" stroke="#183a30" stroke-width="2.2"/>
<path d="M530 88h330v54H530z" fill="#6f6f6f" fill-opacity=".55"/>
