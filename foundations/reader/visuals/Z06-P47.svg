<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Turn In Poachers (TIP) and Non-Confrontational Violation Reporting</title>
  <desc id="desc">CARE / ESCALATION LADDER: Stay safe and never confront suspects | Record time, place &amp; plate safely | Call MN DNR TIP promptly — Conceptual illustration, not to scale.</desc>
