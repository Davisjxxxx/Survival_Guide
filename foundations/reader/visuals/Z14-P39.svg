<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Track refrigerator and freezer safety continuously with appliance thermometers</title>
  <desc id="desc">SYSTEM SEPARATION &amp; BOUNDARY: Keep fridge ≤40°F &amp; freezer ≤0°F | Permanent thermometer inside EVERY unit | Frozen water jugs add freezer cold mass — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z14-P39 · SYSTEM SEPARATION &amp; BOUNDARY (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="system-boundary-cold_chain-artwork"><rect x="34" y="46" width="210" height="84" rx="8" fill="#d4e5ec" stroke="#245368" stroke-width="3"/><rect x="276" y="46" width="168" height="84" rx="6" fill="#f5f1e2" stroke="#7c6928" stroke-width="2.5"/><rect x="476" y="46" width="210" height="84" rx="8" fill="#f7e6dc" stroke="#8f381c" stroke-width="3"/><rect x="42" y="58" width="194" height="58" rx="5" fill="#fffdf7" fill-opacity="0.88" stroke="#184438"/><text x="139" y="82" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">SAFE FREEZER</text><text x="139" y="96" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">Thermometer ≤0°F</text><text x="139" y="110" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">(-18°C)</text><rect x="264" y="60" width="192" height="54" rx="5" fill="#fffdf7" fill-opacity="0.92" stroke="#7c6928"/><text x="360" y="82" font-size="11.2" font-weight="700" fill="#3d3312" text-anchor="middle">SAFE FRIDGE ≤40°F</text><text x="360" y="96" font-size="11.2" font-weight="700" fill="#3d3312" text-anchor="middle">Dedicated thermo</text><text x="360" y="110" font-size="11.2" font-weight="700" fill="#3d3312" text-anchor="middle">inside</text><rect x="484" y="58" width="194" height="58" rx="5" fill="#fffdf7" fill-opacity="0.88" stroke="#8f381c"/><text x="581" y="82" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">DANGER ZONE &gt;40°F</text><text x="581" y="96" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">Rapid bacterial growth</text><rect x="34" y="138" width="652" height="19" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360" y="151" font-size="10.8" font-weight="650" fill="#642e1e" text-anchor="middle">Numbered fridge dials (1–7) never show real temp — hang real thermometers</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Keep fridge ≤40°F &amp;</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">freezer ≤0°F</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Permanent thermometer</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">inside EVERY unit</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Frozen water jugs add</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">freezer cold mass</text></g>
  </g>
</svg>
