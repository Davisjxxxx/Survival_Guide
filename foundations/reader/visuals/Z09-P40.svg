    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z09-P40 · CUTAWAY VIEW (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="cutaway-artwork"><rect x="52" y="46" width="170" height="98" rx="8" fill="#dbe6ea" stroke="#315245" stroke-width="3"/><rect x="56" y="76" width="162" height="64" rx="4" fill="#5f98ad" opacity="0.45"/><path d="M56 118q40-10 81 0t81 0v22H56Z" fill="#9a8362"/><path d="M222 86h78" stroke="#315245" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="308" y="46" width="146" height="98" rx="8" fill="#f7f4e9" stroke="#315245" stroke-width="3"/><path d="M312 88h138M312 108h138" stroke="#6f8c7a" stroke-width="3" stroke-dasharray="6 4"/><path d="M454 95h68" stroke="#315245" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="530" y="46" width="146" height="98" rx="8" fill="#d9e7dc" stroke="#184438" stroke-width="3.5"/><path d="M528 46h150" stroke="#184438" stroke-width="7"/><text x="137" y="68" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Clean known bottle cut</text><text x="381" y="74" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Taped smooth rim guard</text><text x="603" y="98" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Raw/utility side ONLY</text><text x="381" y="134" font-size="11" font-weight="650" fill="#5d3420" text-anchor="middle">Never cut pressurized cans; isolate raw scoops from potable gear</text></g>
