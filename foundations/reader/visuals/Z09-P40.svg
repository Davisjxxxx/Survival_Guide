<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Fashion simple non-potable utility scoops and funnels safely</title>
  <desc id="desc">CUTAWAY VIEW: Clean known bottle body | Tape sharp cut rim smooth | Keep strictly on raw/utility side — Conceptual illustration, not to scale.</desc>
