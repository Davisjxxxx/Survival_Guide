<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">AFWA Best Management Practices: Animal Welfare and Selectivity</title>
  <desc id="desc">SEQUENTIAL INSTRUCTIONAL PLATE: Learn 5 scientific AFWA BMP pillars | Prioritize welfare and selectivity | Reject untested improvised gear — Conceptual illustration, not to scale.</desc>
