<svg class="v02-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Fuel lay airflow geometry versus smothered stack</title><desc id="desc">Comparison cutaway showing an open-base kindling structure feeding oxygen into tinder versus a dense flat wood pile choking flames.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#972f22"/></marker><marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183a30"/></marker></defs>
<style>.v02-svg text{font-family:system-ui,sans-serif;font-size:20px;font-weight:650;fill:#183a30}.v02-svg .sm{font-size:17px;font-weight:600;fill:#2b473e}.v02-svg .warn{font-size:19px;font-weight:700;fill:#8c281b}.v02-svg .heading{font-size:19px;letter-spacing:0.8px;font-weight:750;fill:#183a30}.v02-svg .guard{font-size:15.5px;font-weight:650;fill:#6d301f}.v02-svg .leader{fill:none;stroke:#365c50;stroke-width:2.5}.v02-svg .flow{fill:none;stroke:#205b68;stroke-width:4;marker-end:url(#arr)}.v02-svg .rflow{fill:none;stroke:#972f22;stroke-width:4;marker-end:url(#arr-r)}.v02-svg .gflow{fill:none;stroke:#183a30;stroke-width:3.5;marker-end:url(#arr-g)}.v02-svg .dash{fill:none;stroke:#365c50;stroke-width:2.5;stroke-dasharray:10 7}</style>
<rect x="1" y="1" width="898" height="393" rx="16" fill="#f4f6ed" stroke="#99ad9b" stroke-width="2"/>
<text class="heading" x="26" y="34">Z03-P18 · V02 TECHNICAL ILLUSTRATION · NOT TO SCALE</text>
<g id="v02-artwork">
    <!-- Left: Open airflow lay -->
    <line x1="55" y1="286" x2="415" y2="286" stroke="#5d653e" stroke-width="4"/>
    <ellipse cx="235" cy="272" rx="46" ry="14" fill="#d9a15b" stroke="#8c5a20" stroke-width="2.5"/>
    <line x1="120" y1="284" x2="242" y2="148" stroke="#6d4c2f" stroke-width="9"/>
    <line x1="350" y1="284" x2="228" y2="148" stroke="#6d4c2f" stroke-width="9"/>
    <line x1="168" y1="284" x2="238" y2="178" stroke="#8b6540" stroke-width="7"/>
    <path class="flow" d="M70 256h95"/><path class="flow" d="M400 256h-95"/>
    <text x="68" y="92">Correct: open air draft</text>
    <text class="sm" x="78" y="118">Match-to-pencil kindling spaced apart</text>
    <!-- Right: Smothered pile -->
    <line x1="485" y1="286" x2="845" y2="286" stroke="#5d653e" stroke-width="4"/>
    <rect x="550" y="256" width="230" height="24" rx="8" fill="#6d4c2f"/>
    <rect x="565" y="232" width="200" height="24" rx="8" fill="#5c3e24"/>
    <rect x="580" y="208" width="170" height="24" rx="8" fill="#4f351e"/>
    <path d="M625 192Q665 150 705 186" stroke="#7d8a84" stroke-width="6" fill="none" stroke-dasharray="8 6"/>
    <text class="warn" x="512" y="92">Wrong: smothered heavy logs</text>
    <text class="warn" x="528" y="118">Starves oxygen; thick wet smoke</text>
    </g>
<rect x="23" y="344" width="854" height="36" rx="7" fill="#f7e4d8"/>
<text class="guard" x="36" y="369">Stage fine, medium and thumb-thick fuel before lighting; keep flames strictly contained.</text>
</svg>
