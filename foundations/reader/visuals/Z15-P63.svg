    <g id="seasonal-timeline-crop_frost-artwork"><path d="M36 62h644" stroke="#184438" stroke-width="4" marker-end="url(#arrow)"/><circle cx="106.0" cy="62" r="8" fill="#184438" stroke="#fffdf7" stroke-width="2"/><text x="106.0" y="48" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Spring Check</text><rect x="28" y="76" width="156" height="58" rx="6" fill="#d5e5dc" stroke="#315245" stroke-width="2"/><text x="106.0" y="98" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Alarms, NOAA SAME,</text><text x="106.0" y="112" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">sump &amp; tornado drill</text><circle cx="274.0" cy="62" r="8" fill="#184438" stroke="#fffdf7" stroke-width="2"/><text x="274.0" y="48" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Summer Update</text><rect x="196" y="76" width="156" height="58" rx="6" fill="#e4ebd4" stroke="#315245" stroke-width="2"/><text x="274.0" y="98" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Swap kids gear, Rx &amp;</text><text x="274.0" y="112" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">cooling/HEPA stock</text><circle cx="442.0" cy="62" r="8" fill="#184438" stroke="#fffdf7" stroke-width="2"/><text x="442.0" y="48" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Fall Check</text><rect x="364" y="76" width="156" height="58" rx="6" fill="#f4ebd2" stroke="#315245" stroke-width="2"/><text x="442.0" y="98" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Rotate 6-mo water,</text><text x="442.0" y="112" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">winter kit &amp; shutoff</text><text x="442.0" y="126" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">walk</text><circle cx="610.0" cy="62" r="8" fill="#184438" stroke="#fffdf7" stroke-width="2"/><text x="610.0" y="48" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Year-Round</text><rect x="532" y="76" width="156" height="58" rx="6" fill="#f5dfd5" stroke="#315245" stroke-width="2"/><text x="610.0" y="98" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Update wallet cards</text><text x="610.0" y="112" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">whenever phones</text><text x="610.0" y="126" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">change</text><rect x="28" y="139" width="664" height="18" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360" y="152" font-size="10.8" font-weight="650" fill="#642e1e" text-anchor="middle">Two 30-minute refreshes yearly turn paper binders into calm muscle memory</text></g>
