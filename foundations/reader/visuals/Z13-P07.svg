<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Isolate generator circuits properly and never backfeed a wall outlet</title>
  <desc id="desc">CORRECT VS INCORRECT CONFIGURATION: Direct outdoor cord OR licensed transfer | NEVER backfeed wall or dryer outlets | Conceptual guide ≠ wiring certification — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z13-P07 · CORRECT VS INCORRECT CONFIGURATION (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="correct-vs-wrong-electrical-artwork"><rect x="28" y="38" width="322" height="100" rx="8" fill="#e1ece3" stroke="#184438" stroke-width="2.8"/><rect x="28" y="38" width="322" height="24" rx="6" fill="#184438"/><path d="M40 50l5 5 10-10" fill="none" stroke="#fffdf7" stroke-width="2.5" stroke-linecap="round"/><text x="198" y="54" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">ISOLATED SAFE CONNECTION</text><rect x="38" y="74" width="32" height="24" rx="4" fill="#c7d8ce" stroke="#184438" stroke-width="2"/><path d="M70 86h12" stroke="#184438" stroke-width="2" marker-end="url(#arrow)"/><rect x="84" y="74" width="18" height="24" rx="3" fill="#fffdf7" stroke="#184438" stroke-width="2"/><text x="112" y="79.0" font-size="10.8" font-weight="650" fill="#183c31" text-anchor="start">Direct heavy outdoor cords to</text><text x="112" y="92.5" font-size="10.8" font-weight="650" fill="#183c31" text-anchor="start">appliances</text><text x="112" y="111.0" font-size="10.8" font-weight="650" fill="#183c31" text-anchor="start">OR licensed inspected transfer</text><text x="112" y="124.5" font-size="10.8" font-weight="650" fill="#183c31" text-anchor="start">switch</text><rect x="370" y="38" width="322" height="100" rx="8" fill="#f8ebe3" stroke="#8f381c" stroke-width="2.8" stroke-dasharray="7 4"/><rect x="370" y="38" width="322" height="24" rx="6" fill="#8f381c"/><path d="M382 44l10 10m0-10l-10 10" fill="none" stroke="#fffdf7" stroke-width="2.5" stroke-linecap="round"/><text x="540" y="54" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">DEADLY OUTLET BACKFEED</text><rect x="380" y="74" width="32" height="24" rx="4" fill="#ecd2c5" stroke="#8f381c" stroke-width="2"/><path d="M414 86l12-7-5 12 12-5" fill="none" stroke="#8f381c" stroke-width="2.5"/><text x="446" y="79.0" font-size="10.8" font-weight="650" fill="#5a2310" text-anchor="start">Double-male cord into wall/dryer</text><text x="446" y="92.5" font-size="10.8" font-weight="650" fill="#5a2310" text-anchor="start">plug</text><text x="446" y="111.0" font-size="10.8" font-weight="650" fill="#5a2310" text-anchor="start">Energizes street lines &amp; kills</text><text x="446" y="124.5" font-size="10.8" font-weight="650" fill="#5a2310" text-anchor="start">linemen</text><rect x="28" y="141" width="664" height="17" rx="4" fill="#f5f1e2" stroke="#7c6928"/><text x="360" y="153" font-size="10.5" font-weight="650" fill="#3d3312" text-anchor="middle">Conceptual safety boundary ONLY — all panel transfer switches need licensed trades</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Direct outdoor cord OR</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">licensed transfer</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">NEVER backfeed wall or</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">dryer outlets</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Conceptual guide ≠</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">wiring certification</text></g>
  </g>
</svg>
