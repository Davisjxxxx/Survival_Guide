<svg class="v02-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Safe liquid-fuel stove refueling clearance zone</title><desc id="desc">Overhead spatial layout separating a cooled depressurized stove and fuel bottle on bare mineral ground well away from tents, flames and downwind ignition sources.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#972f22"/></marker><marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183a30"/></marker></defs>
<style>.v02-svg text{font-family:system-ui,sans-serif;font-size:20px;font-weight:650;fill:#183a30}.v02-svg .sm{font-size:17px;font-weight:600;fill:#2b473e}.v02-svg .warn{font-size:19px;font-weight:700;fill:#8c281b}.v02-svg .heading{font-size:19px;letter-spacing:0.8px;font-weight:750;fill:#183a30}.v02-svg .guard{font-size:15.5px;font-weight:650;fill:#6d301f}.v02-svg .leader{fill:none;stroke:#365c50;stroke-width:2.5}.v02-svg .flow{fill:none;stroke:#205b68;stroke-width:4;marker-end:url(#arr)}.v02-svg .rflow{fill:none;stroke:#972f22;stroke-width:4;marker-end:url(#arr-r)}.v02-svg .gflow{fill:none;stroke:#183a30;stroke-width:3.5;marker-end:url(#arr-g)}.v02-svg .dash{fill:none;stroke:#365c50;stroke-width:2.5;stroke-dasharray:10 7}</style>
<rect x="1" y="1" width="898" height="393" rx="16" fill="#f4f6ed" stroke="#99ad9b" stroke-width="2"/>
<text class="heading" x="26" y="34">Z03-P29 · V02 TECHNICAL ILLUSTRATION · NOT TO SCALE</text>
<g id="v02-artwork">
    <!-- Left: Refueling zone -->
    <circle cx="220" cy="196" r="108" fill="#e3f0ea" stroke="#183a30" stroke-width="3.5"/>
    <rect x="155" y="182" width="54" height="36" rx="6" fill="#bc785b" stroke="#6d301f" stroke-width="3"/>
    <rect x="235" y="158" width="46" height="60" rx="8" fill="#972f22" stroke="#5c1a12" stroke-width="3"/>
    <text x="90" y="76">Cool stove · cleared mineral soil</text>
    <text class="sm" x="148" y="248">Depressurize cool</text><text class="sm" x="148" y="272">Wipe any spills</text>
    <!-- Separation distance -->
    <line x1="335" y1="196" x2="565" y2="196" stroke="#972f22" stroke-width="4" stroke-dasharray="10 6"/>
    <text class="warn" x="358" y="176">Safe upwind gap</text>
    <text class="sm" x="352" y="226">Vapors sink &amp; travel</text>
    <!-- Right: Ignition / tent exclusion -->
    <rect x="575" y="96" width="275" height="202" rx="12" fill="#f7e4d8" stroke="#972f22" stroke-width="3.5"/>
    <polygon points="620,240 680,158 740,240" fill="#d7e2da" stroke="#183a30" stroke-width="3"/>
    <path d="M775 238q15-38 30 0z" fill="#d97236" stroke="#972f22" stroke-width="2.5"/>
    <text class="warn" x="600" y="132">Keep strictly away:</text>
    <text class="sm" x="602" y="274">Tents, flames &amp; hot stoves</text>
    </g>
<rect x="23" y="344" width="854" height="36" rx="7" fill="#f7e4d8"/>
<text class="guard" x="36" y="369">Never open or refill a hot stove; follow exact manufacturer fuel and priming instructions.</text>
</svg>
