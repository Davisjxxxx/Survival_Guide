<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Read elevation contours, low ground and water barriers</title>
  <desc id="desc">CUTAWAY VIEW: Tight lines = steep slope | V-contours point uphill | Blue features = barriers — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z11-R04 · CUTAWAY VIEW (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="cutaway-artwork"><path d="M30 82h205l25 54h200l25-54h205v68H30Z" fill="#bfb293" stroke="#5b5139" stroke-width="2.5"/><path d="M262 126h196v10H262Z" fill="#7d6e54"/><rect x="278" y="96" width="164" height="28" rx="5" fill="#5f98ad" opacity="0.55" stroke="#184438" stroke-width="2.5"/><path d="M238 66h244" stroke="#a05332" stroke-width="3" stroke-dasharray="7 5"/><path d="M105 56v22m510-22v22" stroke="#285345" stroke-width="3" marker-end="url(#arrow)"/><text x="130" y="52" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Tight lines = steep bluff</text><text x="360" y="114" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Uphill V = valley/stream</text><text x="590" y="52" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Blue = water/marsh barrier</text><text x="360" y="60" font-size="11" font-weight="650" fill="#8b3e1f" text-anchor="middle">Ely 1965: symbols only</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Tight lines = steep</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">slope</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">V-contours point uphill</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Blue features = barriers</text></g>
  </g>
</svg>
