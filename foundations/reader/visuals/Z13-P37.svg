<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Appliances on the water line during a drinking water advisory</title>
<desc id="desc">Left: a refrigerator cutaway. Advisory tap water enters from the house supply line, passes through the filter cartridge and feeds both the icemaker and the door dispenser. The icemaker is switched off, ice made from advisory water is discarded, and the filter is marked as not making advisory water safe. Right: a humidifier or CPAP water chamber is filled from a jug of safe water, not from the advisory tap. Conceptual drawing, not to scale.</desc>
