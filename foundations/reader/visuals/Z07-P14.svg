<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Short-Leash Dog Control and Trail-Edge Exclusion in Season</title>
  <desc id="desc">SPATIAL HAZARD &amp; EXCLUSION ZONE MAP: Keep dogs on short fixed leash | Stay centered on cleared trails | Keep dogs away from bait odors — Conceptual illustration, not to scale.</desc>
