    <g id="hazard-exclusion-pet_leash-artwork"><rect x="28" y="38" width="224" height="96" rx="6" fill="#eef3ec" stroke="#285345" stroke-width="2.2"/><path d="M36 86h208" stroke="#285345" stroke-width="6"/><rect x="36" y="42" width="208" height="24" fill="#f5dfd5" stroke="#8f381c" stroke-dasharray="5 3"/><rect x="36" y="106" width="208" height="24" fill="#f5dfd5" stroke="#8f381c" stroke-dasharray="5 3"/><text x="140" y="90" font-size="9.8" font-weight="650" fill="#fffdf7" text-anchor="middle">ON-LEASH TRAIL</text><path d="M44 62V44" stroke="#183c31" stroke-width="2" marker-end="url(#arrow)"/><text x="54" y="52" font-size="10" font-weight="650" fill="#183c31" text-anchor="middle">N</text><rect x="266" y="38" width="426" height="28" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="266" y="38" width="26" height="28" rx="4" fill="#8f381c"/><text x="279" y="56" font-size="10.8" font-weight="650" fill="#fffdf7" text-anchor="middle">1</text><text x="302" y="56" font-size="10.8" font-weight="650" fill="#183c31" text-anchor="start">Off-trail brush &amp; culverts: high risk</text><rect x="266" y="71" width="426" height="28" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="266" y="71" width="26" height="28" rx="4" fill="#285345"/><text x="279" y="89" font-size="10.8" font-weight="650" fill="#fffdf7" text-anchor="middle">2</text><text x="302" y="89" font-size="10.8" font-weight="650" fill="#183c31" text-anchor="start">Shoreline scent piles: strict exclusion</text><rect x="266" y="104" width="426" height="28" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="266" y="104" width="26" height="28" rx="4" fill="#285345"/><text x="279" y="122" font-size="10.8" font-weight="650" fill="#fffdf7" text-anchor="middle">3</text><text x="302" y="122" font-size="10.8" font-weight="650" fill="#183c31" text-anchor="start">Clear trail center: &lt;= 6 ft fixed leash</text><rect x="28" y="139" width="318" height="18" rx="4" fill="#dceadf" stroke="#184438"/><text x="187" y="152" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="middle">Prevention by leashing beats emergency release</text><rect x="356" y="139" width="336" height="18" rx="4" fill="#faeee5" stroke="#a05332"/><text x="524" y="152" font-size="10.4" font-weight="650" fill="#642e1e" text-anchor="middle">Carry 24-hr rural emergency vet contact</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Keep dogs on short fixed</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">leash</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Stay centered on cleared</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">trails</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Keep dogs away from bait</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">odors</text></g>
