<svg class="v02-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Filter dirty-side and clean-side separation</title><desc id="desc">Exploded gravity/squeeze filter assembly marking the raw dirty reservoir and hose strictly separated from the clean outlet spout and drinking bottle.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#972f22"/></marker><marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183a30"/></marker></defs>
<style>.v02-svg text{font-family:system-ui,sans-serif;font-size:20px;font-weight:650;fill:#183a30}.v02-svg .sm{font-size:17px;font-weight:600;fill:#2b473e}.v02-svg .warn{font-size:19px;font-weight:700;fill:#8c281b}.v02-svg .heading{font-size:19px;letter-spacing:0.8px;font-weight:750;fill:#183a30}.v02-svg .guard{font-size:15.5px;font-weight:650;fill:#6d301f}.v02-svg .leader{fill:none;stroke:#365c50;stroke-width:2.5}.v02-svg .flow{fill:none;stroke:#205b68;stroke-width:4;marker-end:url(#arr)}.v02-svg .rflow{fill:none;stroke:#972f22;stroke-width:4;marker-end:url(#arr-r)}.v02-svg .gflow{fill:none;stroke:#183a30;stroke-width:3.5;marker-end:url(#arr-g)}.v02-svg .dash{fill:none;stroke:#365c50;stroke-width:2.5;stroke-dasharray:10 7}</style>
<rect x="1" y="1" width="898" height="393" rx="16" fill="#f4f6ed" stroke="#99ad9b" stroke-width="2"/>
<text class="heading" x="26" y="34">Z04-P36 · V02 TECHNICAL ILLUSTRATION · NOT TO SCALE</text>
<g id="v02-artwork">
    <!-- Dirty zone box -->
    <rect x="40" y="70" width="330" height="248" rx="12" fill="#f7e4d8" stroke="#972f22" stroke-width="3" stroke-dasharray="10 6"/>
    <text class="warn" x="64" y="102">DIRTY SIDE (raw water)</text>
    <path d="M90 130h120v115a16 16 0 0 1-16 16H106a16 16 0 0 1-16-16z" fill="#c9b489" stroke="#6d301f" stroke-width="3.5"/>
    <text class="sm" x="108" y="195">Raw pouch</text>
    <path class="rflow" d="M210 190h140"/>
    <text class="sm" x="64" y="294">Keep dirty hose off clean cap</text>
    <!-- Filter cartridge -->
    <rect x="378" y="152" width="144" height="76" rx="14" fill="#d7e2da" stroke="#183a30" stroke-width="4"/>
    <text x="412" y="186">Filter</text><text class="sm" x="400" y="210">Flow arrow -></text>
    <!-- Clean zone box -->
    <rect x="530" y="70" width="330" height="248" rx="12" fill="#e3f0ea" stroke="#183a30" stroke-width="3"/>
    <text x="556" y="102">CLEAN SIDE (treated)</text>
    <path class="flow" d="M522 190h118"/>
    <rect x="655" y="135" width="110" height="130" rx="12" fill="#b7dfec" stroke="#205b68" stroke-width="3.5"/>
    <rect x="682" y="118" width="56" height="17" rx="4" fill="#183a30"/>
    <text class="sm" x="676" y="205">Clean jar</text>
    <text class="sm" x="556" y="294">Cover clean spout; no drips</text>
    </g>
<rect x="23" y="344" width="854" height="36" rx="7" fill="#f7e4d8"/>
<text class="guard" x="36" y="369">One drop of raw water on threads or clean outlet recontaminates treated water.</text>
</svg>
