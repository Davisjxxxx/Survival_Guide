    <g id="sequence-plate-winter_twig-artwork"><rect x="26" y="44" width="152" height="90" rx="8" fill="#dce8df" stroke="#285345" stroke-width="2.3"/><circle cx="44" cy="58" r="11" fill="#184438"/><text x="44" y="62" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">1</text><text x="61" y="58" font-size="11" font-weight="700" fill="#183c31" text-anchor="start">1. Branching</text><path d="M36 78h132" stroke="#9bb1a3" stroke-width="1.5"/><text x="102.0" y="95.0" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">Opposite vs</text><text x="102.0" y="108.5" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">alternate nodes</text><path d="M180 89h12" stroke="#184438" stroke-width="3" marker-end="url(#arrow)"/><rect x="196" y="44" width="152" height="90" rx="8" fill="#e3ece5" stroke="#285345" stroke-width="2.3"/><circle cx="214" cy="58" r="11" fill="#184438"/><text x="214" y="62" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">2</text><text x="231" y="58" font-size="11" font-weight="700" fill="#183c31" text-anchor="start">2. Bud scales</text><path d="M206 78h132" stroke="#9bb1a3" stroke-width="1.5"/><text x="272.0" y="95.0" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">Single cap vs</text><text x="272.0" y="108.5" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">overlapping</text><path d="M350 89h12" stroke="#184438" stroke-width="3" marker-end="url(#arrow)"/><rect x="366" y="44" width="152" height="90" rx="8" fill="#eef2e4" stroke="#285345" stroke-width="2.3"/><circle cx="384" cy="58" r="11" fill="#184438"/><text x="384" y="62" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">3</text><text x="401" y="58" font-size="11" font-weight="700" fill="#183c31" text-anchor="start">3. Leaf scar</text><path d="M376 78h132" stroke="#9bb1a3" stroke-width="1.5"/><text x="442.0" y="95.0" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">Shape &amp; bundle-scar</text><text x="442.0" y="108.5" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">dots</text><path d="M520 89h12" stroke="#184438" stroke-width="3" marker-end="url(#arrow)"/><rect x="536" y="44" width="152" height="90" rx="8" fill="#d5e4da" stroke="#285345" stroke-width="2.3"/><circle cx="554" cy="58" r="11" fill="#184438"/><text x="554" y="62" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">4</text><text x="571" y="58" font-size="11" font-weight="700" fill="#183c31" text-anchor="start">4. Vine check</text><path d="M546 78h132" stroke="#9bb1a3" stroke-width="1.5"/><text x="612.0" y="95.0" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">Never touch/burn</text><text x="612.0" y="108.5" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">fuzzy vines</text><rect x="26" y="139" width="668" height="18" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360" y="152" font-size="10.8" font-weight="650" fill="#642e1e" text-anchor="middle">Dormant winter poison ivy retains active urushiol oil</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Check Plantae (Woody</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">traits</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Contrast Dormant</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Toxicodendron</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Keep WITHHELD_HOLD</text></g>
