<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Winter Twig, Bud-Scale and Bark Phenology Identification Key</title>
  <desc id="desc">SEQUENTIAL INSTRUCTIONAL PLATE: Check Plantae (Woody traits | Contrast Dormant Toxicodendron | Keep WITHHELD_HOLD — Conceptual illustration, not to scale.</desc>
