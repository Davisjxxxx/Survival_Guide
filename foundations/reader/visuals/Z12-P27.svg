<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Understand radiant solar load, hot ground reflection and sun-protective clothing</title>
  <desc id="desc">MATERIAL CROSS-SECTION: Direct sun + hot ground bounce | Loose light fabric blocks UV | Ventilated shade off hot sand — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z12-P27 · MATERIAL CROSS-SECTION (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="cross-section-artwork"><rect x="70" y="42" width="450" height="26" fill="#c5d8de" stroke="#315245" stroke-width="1.8"/><text x="295" y="59" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Wide-brim hat + UV eyewear + loose UPF shirt</text><rect x="70" y="68" width="450" height="26" fill="#e5d4a1" stroke="#315245" stroke-width="1.8"/><text x="295" y="85" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Breathable shaded airflow cooling skin</text><rect x="70" y="94" width="450" height="26" fill="#cadbc6" stroke="#315245" stroke-width="1.8"/><text x="295" y="111" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Elevated rest pad off scorching desert ground</text><rect x="70" y="120" width="450" height="26" fill="#b7a98d" stroke="#315245" stroke-width="1.8"/><text x="295" y="137" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">140-160°F sun-baked sand &amp; reflective slickrock</text><path d="M555 48v88" stroke="#a05332" stroke-width="3.5" marker-end="url(#arrow)"/><path d="M585 138V52" stroke="#366c7d" stroke-width="3.5" marker-end="url(#arrow)"/><text x="605" y="80" font-size="11.5" font-weight="650" fill="#183c31" text-anchor="start">Loose light</text><text x="605" y="95" font-size="11.5" font-weight="650" fill="#183c31" text-anchor="start">clothing reduces</text><text x="605" y="110" font-size="11.5" font-weight="650" fill="#183c31" text-anchor="start">radiant load &amp;</text><text x="605" y="125" font-size="11.5" font-weight="650" fill="#183c31" text-anchor="start">sunburn fluid</text><text x="605" y="140" font-size="11.5" font-weight="650" fill="#183c31" text-anchor="start">loss</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Direct sun + hot ground</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">bounce</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Loose light fabric</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">blocks UV</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Ventilated shade off hot</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">sand</text></g>
  </g>
</svg>
