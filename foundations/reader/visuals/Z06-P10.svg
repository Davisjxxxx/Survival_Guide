    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z06-P10 · WILDLIFE SIGN, TRACK &amp; HABITAT PLATE (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="wildlife-track-fish_anatomy-artwork"><rect x="28" y="38" width="206" height="96" rx="6" fill="#f6f4eb" stroke="#2c4b3f" stroke-width="2.2"/><path d="M52 86q56-34 114-4l30-18-10 22 10 22-30-18q-58 30-114-4Z" fill="#b7d2d9" stroke="#183c31" stroke-width="2.2"/><path d="M88 64l28-14 14 14M74 86q42-4 82 0" fill="none" stroke="#315245" stroke-width="2" stroke-dasharray="4 3"/><circle cx="72" cy="82" r="3.5" fill="#183c31"/><path d="M38 126h100M38 121v8M63 123v6M88 121v8M113 123v6M138 121v8" stroke="#183c31" stroke-width="1.6"/><rect x="248" y="38" width="216" height="44" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="248" y="38" width="22" height="44" rx="4" fill="#184438"/><text x="259" y="64" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">1</text><text x="276" y="56" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">Jaw hinge past eye</text><text x="276" y="70" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">(largemouth)</text><rect x="472" y="38" width="216" height="44" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="472" y="38" width="22" height="44" rx="4" fill="#184438"/><text x="483" y="64" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">2</text><text x="500" y="56" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">Jaw ends below eye</text><text x="500" y="70" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">(smallmouth)</text><rect x="248" y="88" width="216" height="44" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="248" y="88" width="22" height="44" rx="4" fill="#184438"/><text x="259" y="114" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">3</text><text x="276" y="106" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">Dorsal spine count on</text><text x="276" y="120" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">crappies</text><rect x="472" y="88" width="216" height="44" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="472" y="88" width="22" height="44" rx="4" fill="#184438"/><text x="483" y="114" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">4</text><text x="500" y="106" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">Check lake Quality</text><text x="500" y="120" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">Sunfish limits</text><rect x="28" y="139" width="290" height="18" rx="4" fill="#dceadf" stroke="#184438"/><text x="173" y="152" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="middle">Verify lake-specific reduced limits</text><rect x="328" y="139" width="364" height="18" rx="4" fill="#faeee5" stroke="#a05332"/><text x="510" y="152" font-size="10.4" font-weight="650" fill="#642e1e" text-anchor="middle">Keep air exposure minimal on release</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Separate largemouth vs</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">smallmouth</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Check special</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">sunfish/crappie limits</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Avoid stressing shallow</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">nests</text></g>
  </g>
