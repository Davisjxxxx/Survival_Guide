<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Bass, Sunfish and Crappie Spawning Conservation Boundaries</title>
  <desc id="desc">WILDLIFE SIGN, TRACK &amp; HABITAT PLATE: Separate largemouth vs smallmouth | Check special sunfish/crappie limits | Avoid stressing shallow nests — Conceptual illustration, not to scale.</desc>
