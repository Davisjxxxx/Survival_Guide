    <g id="geological-strata-clay_soil-artwork"><rect x="28" y="38" width="236" height="96" rx="6" fill="#f7f4ea" stroke="#2c4b3f" stroke-width="2.2"/><rect x="32" y="42" width="228" height="20" fill="#8b7a5e"/><rect x="32" y="62" width="228" height="28" fill="#b79c73"/><rect x="32" y="90" width="228" height="22" fill="#9a8d82"/><rect x="32" y="112" width="228" height="18" fill="#c7c4ba" stroke-dasharray="4 3"/><path d="M62 46v78M142 46v78M222 46v78" stroke="#245368" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/><path d="M38 128h46M38 124v8M84 124v8" stroke="#183c31" stroke-width="1.8"/><rect x="278" y="38" width="414" height="28" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="278" y="38" width="26" height="28" rx="4" fill="#184438"/><text x="291" y="56" font-size="11" font-weight="650" fill="#fffdf7" text-anchor="middle">1</text><text x="314" y="56" font-size="11" font-weight="650" fill="#183c31" text-anchor="start">Coarse sand: drains fast, weak stake grip</text><rect x="278" y="71" width="414" height="28" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="278" y="71" width="26" height="28" rx="4" fill="#184438"/><text x="291" y="89" font-size="11" font-weight="650" fill="#fffdf7" text-anchor="middle">2</text><text x="314" y="89" font-size="11" font-weight="650" fill="#183c31" text-anchor="start">Loam mix: moderate drainage &amp; hold</text><rect x="278" y="104" width="414" height="28" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="278" y="104" width="26" height="28" rx="4" fill="#184438"/><text x="291" y="122" font-size="11" font-weight="650" fill="#fffdf7" text-anchor="middle">3</text><text x="314" y="122" font-size="11" font-weight="650" fill="#183c31" text-anchor="start">Dense clay: ponds water, slick mud</text><rect x="28" y="139" width="320" height="18" rx="4" fill="#dceadf" stroke="#184438"/><text x="188" y="152" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="middle">Check drainage before storm arrives</text><rect x="358" y="139" width="334" height="18" rx="4" fill="#faeee5" stroke="#a05332"/><text x="525" y="152" font-size="10.4" font-weight="650" fill="#642e1e" text-anchor="middle">Wet clay flats pool cold runoff</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Compare sandy drainage</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">vs clay ponding</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Watch frost-heave and</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">mud slump</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Choose elevated firm</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">ground</text></g>
