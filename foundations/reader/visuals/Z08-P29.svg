<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Sand, Silt and Loam Drainage Behavior for Site Assessment</title>
  <desc id="desc">GEOLOGICAL STRATA &amp; MATERIAL PROFILE: Compare sandy drainage vs clay ponding | Watch frost-heave and mud slump | Choose elevated firm ground — Conceptual illustration, not to scale.</desc>
