<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Distinguish commercial &quot;Best By&quot; quality dates from actual food-safety limits</title>
  <desc id="desc">COMPARATIVE CONFIGURATION: &quot;Best By&quot; = quality (EXCEPT infant formula!) | Acid cans age faster than low-acid cans | Never invent 25-yr home-canned shelf lives — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z14-P77 · COMPARATIVE CONFIGURATION (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="comparison-artwork"><rect x="30" y="44" width="208" height="104" rx="8" fill="#dce8df" stroke="#315245" stroke-width="2.5"/><rect x="30" y="44" width="208" height="24" rx="6" fill="#285345"/><text x="134.0" y="60" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">Infant Formula</text><text x="40" y="84" font-size="11.5" font-weight="600" fill="#183c31" text-anchor="start">STRICT hard Use-By</text><text x="40" y="98" font-size="11.5" font-weight="600" fill="#183c31" text-anchor="start">safety/nutrition limit</text><rect x="38" y="122" width="192" height="20" rx="4" fill="#faeee5" stroke="#a05332"/><text x="134.0" y="136" font-size="10" font-weight="650" fill="#7a2f15" text-anchor="middle">NEVER use expired</text><rect x="256" y="44" width="208" height="104" rx="8" fill="#e5e9d5" stroke="#315245" stroke-width="2.5"/><rect x="256" y="44" width="208" height="24" rx="6" fill="#285345"/><text x="360.0" y="60" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">Acidic Cans</text><text x="266" y="84" font-size="11.5" font-weight="600" fill="#183c31" text-anchor="start">Tomatoes/fruit corrode</text><text x="266" y="98" font-size="11.5" font-weight="600" fill="#183c31" text-anchor="start">linings faster</text><rect x="264" y="122" width="192" height="20" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360.0" y="136" font-size="10" font-weight="650" fill="#7a2f15" text-anchor="middle">~12–18 mo quality</text><rect x="482" y="44" width="208" height="104" rx="8" fill="#e4e8ee" stroke="#315245" stroke-width="2.5"/><rect x="482" y="44" width="208" height="24" rx="6" fill="#285345"/><text x="586.0" y="60" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">Low-Acid / Home</text><text x="492" y="84" font-size="11.5" font-weight="600" fill="#183c31" text-anchor="start">Intact cans ~2–5 yr;</text><text x="492" y="98" font-size="11.5" font-weight="600" fill="#183c31" text-anchor="start">home-canned ~1 yr</text><rect x="490" y="122" width="192" height="20" rx="4" fill="#faeee5" stroke="#a05332"/><text x="586.0" y="136" font-size="10" font-weight="650" fill="#7a2f15" text-anchor="middle">No 25-yr guarantees</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">&quot;Best By&quot; = quality</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">(EXCEPT infant formula!)</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Acid cans age faster</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">than low-acid cans</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Never invent 25-yr home-</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">canned shelf lives</text></g>
  </g>
</svg>
