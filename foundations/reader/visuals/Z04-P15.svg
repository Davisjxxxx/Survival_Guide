<svg class="v02-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Visual clarity versus biological and chemical hazards</title><desc id="desc">Three water containers showing turbid sediment, clear water carrying invisible pathogens, and clear water carrying dissolved chemical toxins.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#972f22"/></marker><marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183a30"/></marker></defs>
<style>.v02-svg text{font-family:system-ui,sans-serif;font-size:20px;font-weight:650;fill:#183a30}.v02-svg .sm{font-size:17px;font-weight:600;fill:#2b473e}.v02-svg .warn{font-size:19px;font-weight:700;fill:#8c281b}.v02-svg .heading{font-size:19px;letter-spacing:0.8px;font-weight:750;fill:#183a30}.v02-svg .guard{font-size:15.5px;font-weight:650;fill:#6d301f}.v02-svg .leader{fill:none;stroke:#365c50;stroke-width:2.5}.v02-svg .flow{fill:none;stroke:#205b68;stroke-width:4;marker-end:url(#arr)}.v02-svg .rflow{fill:none;stroke:#972f22;stroke-width:4;marker-end:url(#arr-r)}.v02-svg .gflow{fill:none;stroke:#183a30;stroke-width:3.5;marker-end:url(#arr-g)}.v02-svg .dash{fill:none;stroke:#365c50;stroke-width:2.5;stroke-dasharray:10 7}</style>
<rect x="1" y="1" width="898" height="393" rx="16" fill="#f4f6ed" stroke="#99ad9b" stroke-width="2"/>
<text class="heading" x="26" y="34">Z04-P15 · V02 TECHNICAL ILLUSTRATION · NOT TO SCALE</text>
<g id="v02-artwork">
    <!-- Flask 1: Turbid -->
    <path d="M90 120h80v30l28 105a14 14 0 0 1-13 18H75a14 14 0 0 1-13-18l28-105z" fill="#d9c698" stroke="#5c4b2b" stroke-width="3.5"/>
    <path d="M72 238h116l-10 35H82z" fill="#8b6f3d" opacity=".75"/>
    <circle cx="106" cy="212" r="4" fill="#5c4b2b"/><circle cx="138" cy="195" r="5" fill="#5c4b2b"/><circle cx="152" cy="225" r="3.5" fill="#5c4b2b"/>
    <text x="58" y="88">1. Turbid water</text><text class="sm" x="55" y="302">Visible silt; blocks UV</text><text class="sm" x="62" y="324">and chlorine contact</text>
    <!-- Flask 2: Clear + Microbes -->
    <path d="M405 120h80v30l28 105a14 14 0 0 1-13 18H390a14 14 0 0 1-13-18l28-105z" fill="#cfe6ee" stroke="#205b68" stroke-width="3.5"/>
    <circle cx="445" cy="215" r="36" fill="#fff" stroke="#972f22" stroke-width="3" stroke-dasharray="6 4"/>
    <ellipse cx="436" cy="206" rx="9" ry="5" fill="#972f22"/><circle cx="457" cy="222" r="5" fill="#972f22"/><path d="M432 225l12-6" stroke="#972f22" stroke-width="3"/>
    <text x="358" y="88">2. Clear + microbes</text><text class="warn" x="342" y="302">Invisible cysts &amp; viruses</text><text class="sm" x="352" y="324">Needs validated kill</text>
    <!-- Flask 3: Clear + Chemical -->
    <path d="M715 120h80v30l28 105a14 14 0 0 1-13 18H700a14 14 0 0 1-13-18l28-105z" fill="#d7e8ec" stroke="#6d301f" stroke-width="3.5"/>
    <polygon points="755,178 784,230 726,230" fill="#edce8a" stroke="#8c281b" stroke-width="3"/>
    <text class="warn" x="749" y="222">!</text>
    <text x="665" y="88">3. Clear + toxins</text><text class="warn" x="652" y="302">Metals, fuels, HABs</text><text class="sm" x="655" y="324">Boiling fails; reject</text>
    </g>
<rect x="23" y="344" width="854" height="36" rx="7" fill="#f7e4d8"/>
<text class="guard" x="36" y="369">Clarity never proves potability. Separate settling, pathogen kill and chemical rejection.</text>
</svg>
