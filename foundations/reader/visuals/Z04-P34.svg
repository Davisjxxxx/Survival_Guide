<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Understand what pore-size filtration removes and what passes through</title>
  <desc id="desc">MATERIAL CROSS-SECTION: Cysts and bacteria blocked | Viruses pass standard pores | Chemicals pass mechanical media — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z04-P34 · MATERIAL CROSS-SECTION (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="cross-section-artwork"><rect x="70" y="42" width="450" height="26" fill="#c5d8de" stroke="#315245" stroke-width="1.8"/><text x="295" y="59" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Protozoan cysts (1-15 um: blocked ≤1 um)</text><rect x="70" y="68" width="450" height="26" fill="#e5d4a1" stroke="#315245" stroke-width="1.8"/><text x="295" y="85" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Bacteria (0.2-2 um: blocked ≤0.2 um)</text><rect x="70" y="94" width="450" height="26" fill="#cadbc6" stroke="#315245" stroke-width="1.8"/><text x="295" y="111" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Viruses (0.02-0.1 um: pass typical filters)</text><rect x="70" y="120" width="450" height="26" fill="#b7a98d" stroke="#315245" stroke-width="1.8"/><text x="295" y="137" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Dissolved chemicals (pass mechanical pores)</text><path d="M555 48v88" stroke="#a05332" stroke-width="3.5" marker-end="url(#arrow)"/><path d="M585 138V52" stroke="#366c7d" stroke-width="3.5" marker-end="url(#arrow)"/><text x="605" y="80" font-size="11.5" font-weight="650" fill="#183c31" text-anchor="start">Pair filtration</text><text x="605" y="95" font-size="11.5" font-weight="650" fill="#183c31" text-anchor="start">with</text><text x="605" y="110" font-size="11.5" font-weight="650" fill="#183c31" text-anchor="start">disinfection for</text><text x="605" y="125" font-size="11.5" font-weight="650" fill="#183c31" text-anchor="start">viral risk</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Cysts and bacteria</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">blocked</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Viruses pass standard</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">pores</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Chemicals pass</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">mechanical media</text></g>
  </g>
</svg>
