<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Jerusalem Artichoke (Helianthus tuberosus) vs Toxic Tuberous Composites</title>
  <desc id="desc">BOTANICAL DIAGNOSTIC MORPHOLOGY: Check Helianthus tuberosus traits | Contrast Toxic non-sunflower | Keep WITHHELD_HOLD — Conceptual illustration, not to scale.</desc>
