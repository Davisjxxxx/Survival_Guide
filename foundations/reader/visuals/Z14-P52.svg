<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Operate a boiling-water canner with a full boil and the required water cover over the jars</title>
  <desc id="desc">CUTAWAY VIEW: Rack; 1 in water over jars, 2 in if over 30 min | Start timer ONLY at full rolling boil | Turn off, lid off &amp; rest 5 min pre-lift — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z14-P52 · CUTAWAY VIEW (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="cutaway-artwork"><rect x="52" y="46" width="170" height="98" rx="8" fill="#dbe6ea" stroke="#315245" stroke-width="3"/><rect x="56" y="76" width="162" height="64" rx="4" fill="#a5c6cf" opacity="0.45"/><path d="M56 118q40-10 81 0t81 0v22H56Z" fill="#9a8362"/><path d="M222 86h78" stroke="#315245" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="308" y="46" width="146" height="98" rx="8" fill="#f7f4e9" stroke="#315245" stroke-width="3"/><path d="M312 88h138M312 108h138" stroke="#6f8c7a" stroke-width="3" stroke-dasharray="6 4"/><path d="M454 95h68" stroke="#315245" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="530" y="46" width="146" height="98" rx="8" fill="#d9e7dc" stroke="#184438" stroke-width="3.5"/><path d="M528 46h150" stroke="#184438" stroke-width="7"/><text x="137" y="68" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">1–2 in rolling boil OVER lids</text><text x="381" y="74" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Start timer ONLY at full boil</text><text x="603" y="98" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Bottom rack; rest 5 min post-boil</text><text x="381" y="134" font-size="11" font-weight="650" fill="#5d3420" text-anchor="middle">Boil stops -&gt; restart timer from ZERO</text><rect x="492" y="130" width="204" height="20" rx="4" fill="#faeee5" stroke="#a05332"/><text x="594" y="144" font-size="10.5" font-weight="650" fill="#7a2f15" text-anchor="middle">Tilt lid away to prevent scalds</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Rack; 1 in water over</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">jars, 2 in if over 30</text><text x="32" y="218" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">min</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Start timer ONLY at full</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">rolling boil</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Turn off, lid off &amp; rest</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">5 min pre-lift</text></g>
  </g>
</svg>
