<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Minnesota State Parks and Scientific and Natural Areas Rules</title>
  <desc id="desc">JURISDICTION, SEASON &amp; LEGAL BOUNDARY: Check State Park vs SNA status | Keep rocks, soil and wood in place | Stay on designated trails in SNAs — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z08-P56 · JURISDICTION, SEASON &amp; LEGAL BOUNDARY (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="regulation-boundary-mn_parks-artwork"><rect x="28" y="38" width="200" height="96" rx="7" fill="#184438" stroke="#183c31" stroke-width="2"/><text x="128" y="60" font-size="11" font-weight="650" fill="#dceadf" text-anchor="middle">AUTHORITY GATE</text><text x="128" y="82" font-size="11.5" font-weight="700" fill="#fffdf7" text-anchor="middle">Minnesota DNR · State</text><text x="128" y="98" font-size="11.5" font-weight="700" fill="#fffdf7" text-anchor="middle">Parks &amp; SNAs</text><path d="M230 86h20" stroke="#184438" stroke-width="3" marker-end="url(#arrow)"/><rect x="256" y="38" width="436" height="28" rx="5" fill="#f9faef" stroke="#315245" stroke-width="1.8"/><rect x="256" y="38" width="26" height="28" rx="4" fill="#2b5d4e"/><text x="269" y="56" font-size="10.8" font-weight="650" fill="#fffdf7" text-anchor="middle">1</text><text x="292" y="56" font-size="10.8" font-weight="650" fill="#183c31" text-anchor="start">Check DNR land-type map before entering site</text><rect x="256" y="71" width="436" height="28" rx="5" fill="#f9faef" stroke="#315245" stroke-width="1.8"/><rect x="256" y="71" width="26" height="28" rx="4" fill="#2b5d4e"/><text x="269" y="89" font-size="10.8" font-weight="650" fill="#fffdf7" text-anchor="middle">2</text><text x="292" y="89" font-size="10.8" font-weight="650" fill="#183c31" text-anchor="start">Zero collecting of rocks, soil, or plants in parks</text><rect x="256" y="104" width="436" height="28" rx="5" fill="#f9faef" stroke="#315245" stroke-width="1.8"/><rect x="256" y="104" width="26" height="28" rx="4" fill="#2b5d4e"/><text x="269" y="122" font-size="10.8" font-weight="650" fill="#fffdf7" text-anchor="middle">3</text><text x="292" y="122" font-size="10.8" font-weight="650" fill="#183c31" text-anchor="start">Obey strict SNA zero-disturbance &amp; no-fire rules</text><rect x="28" y="139" width="664" height="18" rx="4" fill="#f7dfd6" stroke="#8f381c" stroke-width="1.6"/><text x="360" y="152" font-size="10.6" font-weight="650" fill="#642e1e" text-anchor="middle">STOP: Leave all rocks, minerals &amp; wood undisturbed</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Check State Park vs SNA</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">status</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Keep rocks, soil and</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">wood in place</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Stay on designated</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">trails in SNAs</text></g>
  </g>
</svg>
