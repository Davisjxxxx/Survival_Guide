<svg class="v02-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Bowline fixed utility loop topology</title><desc id="desc">Clear rope-topology diagram of a bowline showing the standing part, collar bight, working end passing around the standing part and back through the collar, plus mandatory stopper knot.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#972f22"/></marker><marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183a30"/></marker></defs>
<style>.v02-svg text{font-family:system-ui,sans-serif;font-size:20px;font-weight:650;fill:#183a30}.v02-svg .sm{font-size:17px;font-weight:600;fill:#2b473e}.v02-svg .warn{font-size:19px;font-weight:700;fill:#8c281b}.v02-svg .heading{font-size:19px;letter-spacing:0.8px;font-weight:750;fill:#183a30}.v02-svg .guard{font-size:15.5px;font-weight:650;fill:#6d301f}.v02-svg .leader{fill:none;stroke:#365c50;stroke-width:2.5}.v02-svg .flow{fill:none;stroke:#205b68;stroke-width:4;marker-end:url(#arr)}.v02-svg .rflow{fill:none;stroke:#972f22;stroke-width:4;marker-end:url(#arr-r)}.v02-svg .gflow{fill:none;stroke:#183a30;stroke-width:3.5;marker-end:url(#arr-g)}.v02-svg .dash{fill:none;stroke:#365c50;stroke-width:2.5;stroke-dasharray:10 7}</style>
<rect x="1" y="1" width="898" height="393" rx="16" fill="#f4f6ed" stroke="#99ad9b" stroke-width="2"/>
<text class="heading" x="26" y="34">Z09-P14 · V02 TECHNICAL ILLUSTRATION · NOT TO SCALE</text>
<g id="v02-artwork">
    <!-- Standing part top-left -->
    <line x1="80" y1="168" x2="295" y2="168" stroke="#183a30" stroke-width="11" stroke-linecap="round"/>
    <!-- Collar bight -->
    <path d="M295 168C355 168 365 112 315 112C265 112 265 224 345 224" fill="none" stroke="#205b68" stroke-width="11" stroke-linecap="round"/>
    <!-- Fixed loop right -->
    <path d="M345 224C465 274 635 266 635 182C635 102 475 96 362 152" fill="none" stroke="#183a30" stroke-width="11" stroke-linecap="round"/>
    <!-- Working end wrapping around standing part and locking back -->
    <path d="M362 152C322 152 248 134 248 168C248 202 325 202 360 198L422 198" fill="none" stroke="#bc785b" stroke-width="10" stroke-linecap="round"/>
    <!-- Stopper knot on tail -->
    <circle cx="436" cy="198" r="14" fill="#972f22" stroke="#5c1a12" stroke-width="3"/>
    <!-- Labels -->
    <text x="68" y="132">Standing part</text>
    <text x="262" y="88">Collar bight</text>
    <text x="535" y="88">Fixed utility loop</text>
    <text class="warn" x="395" y="268">Mandatory stopper knot</text>
    <path class="leader" d="M436 215v32"/>
    <text class="sm" x="68" y="314">Non-slip under steady load · backup tail on slick synthetic cord</text>
    </g>
<rect x="23" y="344" width="854" height="36" rx="7" fill="#f7e4d8"/>
<text class="guard" x="36" y="369">Dress and load-test gently; conceptual utility knot only—NOT life-safety rigging.</text>
</svg>
