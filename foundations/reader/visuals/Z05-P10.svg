<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Foraging Law: State Parks, SNAs, National Parks and Rare Plants</title>
  <desc id="desc">JURISDICTION, SEASON &amp; LEGAL BOUNDARY: Verify exact public-land statute | Obey zero-take in SNAs &amp; rare flora | Check current State Park rules — Conceptual illustration, not to scale.</desc>
