th="2"/><text x="610.0" y="48" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Summer Air</text><rect x="532" y="76" width="156" height="58" rx="6" fill="#f5dfd5" stroke="#315245" stroke-width="2"/><text x="610.0" y="98" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Check cooling</text><text x="610.0" y="112" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">backups &amp; HEPA smoke</text><text x="610.0" y="126" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">filter</text><rect x="28" y="139" width="664" height="18" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360" y="152" font-size="10.8" font-weight="650" fill="#642e1e" text-anchor="middle">Repair failing sump pumps and cracked wellheads before spring floods hit</text></g>
