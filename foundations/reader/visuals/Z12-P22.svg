<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Execute shore-based witness Reach-Throw-Don&#x27;t-Go ice rescue safely</title>
  <desc id="desc">DECISION TREE: Call 911 &amp; stay on solid shore | Reach w/ pole or throw float line | Brace low; NEVER walk out on ice — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z12-P22 · DECISION TREE (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="decision-tree-artwork"><polygon points="125,44 215,82 125,120 35,82" fill="#e6eee6" stroke="#184438" stroke-width="2.8"/><text x="125" y="79" font-size="11" font-weight="700" fill="#183c31" text-anchor="middle">911 called &amp;</text><text x="125" y="93" font-size="11" font-weight="700" fill="#183c31" text-anchor="middle">anchored on</text><text x="125" y="107" font-size="11" font-weight="700" fill="#183c31" text-anchor="middle">shore?</text><path d="M215 82h60" stroke="#285345" stroke-width="3" marker-end="url(#arrow)"/><text x="244" y="75" font-size="10" font-weight="650" fill="#184438" text-anchor="middle">YES</text><polygon points="365,44 455,82 365,120 275,82" fill="#e6eee6" stroke="#184438" stroke-width="2.8"/><text x="365" y="79" font-size="11" font-weight="700" fill="#183c31" text-anchor="middle">Pole reach or</text><text x="365" y="93" font-size="11" font-weight="700" fill="#183c31" text-anchor="middle">float throw</text><text x="365" y="107" font-size="11" font-weight="700" fill="#183c31" text-anchor="middle">safe?</text><path d="M455 82h55" stroke="#285345" stroke-width="3" marker-end="url(#arrow)"/><text x="482" y="75" font-size="10" font-weight="650" fill="#184438" text-anchor="middle">YES</text><rect x="516" y="54" width="166" height="56" rx="8" fill="#d3e6d6" stroke="#184438" stroke-width="3"/><text x="599" y="79" font-size="11.5" font-weight="700" fill="#183c31" text-anchor="middle">Pull low from firm</text><text x="599" y="93" font-size="11.5" font-weight="700" fill="#183c31" text-anchor="middle">land</text><path d="M125 120v14h240v-14" fill="none" stroke="#a05332" stroke-width="2.5"/><text x="142" y="131" font-size="9.5" font-weight="650" fill="#8b3e1f" text-anchor="middle">NO</text><text x="382" y="131" font-size="9.5" font-weight="650" fill="#8b3e1f" text-anchor="middle">NO</text><rect x="115" y="132" width="490" height="22" rx="5" fill="#faeee5" stroke="#a05332" stroke-width="2"/><text x="360" y="147" font-size="11" font-weight="650" fill="#7a2f15" text-anchor="middle">UNREACHABLE: Stay alive on shore, track victim &amp; guide arriving rescue</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Call 911 &amp; stay on solid</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">shore</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Reach w/ pole or throw</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">float line</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Brace low; NEVER walk</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">out on ice</text></g>
  </g>
</svg>
