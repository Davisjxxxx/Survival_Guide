<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Recognize circulatory shock and insulate patients while withholding oral fluids</title>
  <desc id="desc">CONCEPTUAL ORIENTATION &amp; ZONE GUIDE: Spot pale clammy skin &amp; confusion | Control bleed &amp; insulate from ground | Keep NPO; expedite EMS transport — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z10-P05 · CONCEPTUAL ORIENTATION &amp; ZONE GUIDE (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="anatomy-zone-thermal_core-artwork"><rect x="28" y="42" width="176" height="94" rx="8" fill="#e6eee8" stroke="#285345" stroke-width="2.4"/><ellipse cx="116" cy="89" rx="44" ry="34" fill="#d4e5ec" stroke="#245368" stroke-width="2.2" stroke-dasharray="5 3"/><ellipse cx="116" cy="89" rx="22" ry="18" fill="#e9c89f" stroke="#8f381c" stroke-width="2.5"/><text x="116" y="93" font-size="10.5" font-weight="650" fill="#642e1e" text-anchor="middle">CORE</text><rect x="218" y="42" width="474" height="27" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="218" y="42" width="26" height="27" rx="4" fill="#184438"/><text x="231" y="60" font-size="11" font-weight="650" fill="#fffdf7" text-anchor="middle">1</text><text x="254" y="60" font-size="11.2" font-weight="650" fill="#183c31" text-anchor="start">Watch pale cool clammy skin, fast weak pulse, dizziness or confusion</text><rect x="218" y="74" width="474" height="27" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="218" y="74" width="26" height="27" rx="4" fill="#184438"/><text x="231" y="92" font-size="11" font-weight="650" fill="#fffdf7" text-anchor="middle">2</text><text x="254" y="92" font-size="11.2" font-weight="650" fill="#183c31" text-anchor="start">Insulate underneath (ground pad) and overhead to protect core warmth</text><rect x="218" y="106" width="474" height="27" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="218" y="106" width="26" height="27" rx="4" fill="#184438"/><text x="231" y="124" font-size="11" font-weight="650" fill="#fffdf7" text-anchor="middle">3</text><text x="254" y="124" font-size="11.2" font-weight="650" fill="#183c31" text-anchor="start">Keep patient strictly NPO (no food, water or alcohol by mouth)</text><rect x="28" y="139" width="324" height="18" rx="4" fill="#dceadf" stroke="#184438"/><text x="190" y="152" font-size="10.5" font-weight="650" fill="#183c31" text-anchor="middle">Control bleeding + insulate + call 911</text><rect x="364" y="139" width="328" height="18" rx="4" fill="#faeee5" stroke="#a05332"/><text x="528" y="152" font-size="10.5" font-weight="650" fill="#642e1e" text-anchor="middle">Declining alertness -&gt; airway &amp; EMS urgent</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Spot pale clammy skin &amp;</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">confusion</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Control bleed &amp; insulate</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">from ground</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Keep NPO; expedite EMS</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">transport</text></g>
  </g>
</svg>
