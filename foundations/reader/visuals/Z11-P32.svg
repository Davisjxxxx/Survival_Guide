<svg class="v02-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Boxing around an obstacle with 90-degree paced offsets</title><desc id="desc">Plan-view box detour around a compact obstacle: four 90-degree turns, an offset leg counted in paces, a return leg paced to the same distance with extra paces where slope or brush shortens the stride, and a regained line that stays approximate until checked against the map. A matching count does not confirm position. Conceptual, not to scale.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#972f22"/></marker><marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183a30"/></marker></defs>
<style>.v02-svg text{font-family:system-ui,sans-serif;font-size:19px;font-weight:650;fill:#183a30}.v02-svg .sm{font-size:16.5px;font-weight:600;fill:#2b473e}.v02-svg .warn{font-size:18.5px;font-weight:700;fill:#8c281b}.v02-svg .heading{font-size:19px;letter-spacing:0.8px;font-weight:750;fill:#183a30}.v02-svg .guard{font-size:15.5px;font-weight:650;fill:#6d301f}.v02-svg .leader{fill:none;stroke:#365c50;stroke-width:2.5}.v02-svg .flow{fill:none;stroke:#205b68;stroke-width:4;marker-end:url(#arr)}.v02-svg .rflow{fill:none;stroke:#972f22;stroke-width:4;marker-end:url(#arr-r)}.v02-svg .gflow{fill:none;stroke:#183a30;stroke-width:3.5;marker-end:url(#arr-g)}.v02-svg .dash{fill:none;stroke:#365c50;stroke-width:2.5;stroke-dasharray:10 7}</style>
<rect x="1" y="1" width="898" height="393" rx="16" fill="#f4f6ed" stroke="#99ad9b" stroke-width="2"/>
<text class="heading" x="26" y="34">Z11-P32 · W2C REVISION OF V02 · NOT TO SCALE</text>
<g id="v02-artwork">
    <!-- Pond obstacle -->
    <ellipse cx="450" cy="218" rx="135" ry="52" fill="#9ac9da" stroke="#205b68" stroke-width="3.5"/>
    <text x="450" y="254" text-anchor="middle">Pond / blowdown</text>
    <!-- Original bearing line -->
    <line x1="75" y1="218" x2="295" y2="218" stroke="#183a30" stroke-width="4"/>
    <line x1="605" y1="218" x2="835" y2="218" stroke="#183a30" stroke-width="4"/>
    <line x1="295" y1="218" x2="605" y2="218" stroke="#365c50" stroke-width="2" stroke-dasharray="8 6"/>
    <!-- 90-deg box detour -->
    <path class="flow" d="M250 218V108"/><path class="flow" d="M250 108h400"/><path class="flow" d="M650 108v104"/>
    <text x="72" y="196">Original bearing</text>
    <text x="72" y="138">1. Turn 90°</text><text class="sm" x="72" y="164">Count paces (N)</text>
    <text x="330" y="94">2. Resume bearing past obstacle</text>
    <text x="670" y="138">3. Turn 90° back</text><text class="sm" x="670" y="164">Same distance: about N,</text><text class="sm" x="670" y="186">add paces on slope, brush</text>
    <text x="665" y="252">4. Resume line</text><text class="sm" x="665" y="276">approximate: check map</text>
    </g>
<rect x="23" y="344" width="854" height="36" rx="7" fill="#f7e4d8"/>
<text class="guard" x="36" y="369">Paced offsets are approximate; a matching count does not confirm position. Check the map.</text>
</svg>
