<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Build fertile soil with finished compost while avoiding raw manure hazards</title>
  <desc id="desc">CORRECT VS INCORRECT CONFIGURATION: Finished dark compost boosts clay/sand | Zero pet waste; raw manure ≥90–120 d | Exclude meat, grease &amp; blighted stems — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z14-P05 · CORRECT VS INCORRECT CONFIGURATION (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="correct-vs-wrong-canning-artwork"><rect x="28" y="38" width="322" height="100" rx="8" fill="#e1ece3" stroke="#184438" stroke-width="2.8"/><rect x="28" y="38" width="322" height="24" rx="6" fill="#184438"/><path d="M40 50l5 5 10-10" fill="none" stroke="#fffdf7" stroke-width="2.5" stroke-linecap="round"/><text x="198" y="54" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">FINISHED PLANT COMPOST</text><rect x="44" y="74" width="28" height="32" rx="4" fill="#d3e3ea" stroke="#184438" stroke-width="2"/><path d="M42 74h32M50 69h16" stroke="#184438" stroke-width="3"/><circle cx="88" cy="86" r="9" fill="#fffdf7" stroke="#184438" stroke-width="2"/><text x="112" y="79.0" font-size="10.8" font-weight="650" fill="#183c31" text-anchor="start">Dark crumbly earthy compost boosts</text><text x="112" y="92.5" font-size="10.8" font-weight="650" fill="#183c31" text-anchor="start">soil</text><text x="112" y="111.0" font-size="10.8" font-weight="650" fill="#183c31" text-anchor="start">Aged livestock manure ≥90–120 d</text><text x="112" y="124.5" font-size="10.8" font-weight="650" fill="#183c31" text-anchor="start">pre-harvest</text><rect x="370" y="38" width="322" height="100" rx="8" fill="#f8ebe3" stroke="#8f381c" stroke-width="2.8" stroke-dasharray="7 4"/><rect x="370" y="38" width="322" height="24" rx="6" fill="#8f381c"/><path d="M382 44l10 10m0-10l-10 10" fill="none" stroke="#fffdf7" stroke-width="2.5" stroke-linecap="round"/><text x="540" y="54" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">RAW MANURE / PET WASTE</text><rect x="386" y="74" width="30" height="32" rx="4" fill="#ecd2c5" stroke="#8f381c" stroke-width="2" stroke-dasharray="4 3"/><path d="M384 74l34 32M418 74l-34 32" stroke="#8f381c" stroke-width="2"/><text x="446" y="79.0" font-size="10.8" font-weight="650" fill="#5a2310" text-anchor="start">Fresh manure near harvest spreads</text><text x="446" y="92.5" font-size="10.8" font-weight="650" fill="#5a2310" text-anchor="start">E. coli</text><text x="446" y="111.0" font-size="10.8" font-weight="650" fill="#5a2310" text-anchor="start">Dog/cat/human waste banned in food</text><text x="446" y="124.5" font-size="10.8" font-weight="650" fill="#5a2310" text-anchor="start">beds</text><rect x="28" y="141" width="664" height="17" rx="4" fill="#f5f1e2" stroke="#7c6928"/><text x="360" y="153" font-size="10.5" font-weight="650" fill="#3d3312" text-anchor="middle">Exclude meat, grease &amp; blighted vines from backyard compost piles</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Finished dark compost</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">boosts clay/sand</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Zero pet waste; raw</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">manure ≥90–120 d</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Exclude meat, grease &amp;</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">blighted stems</text></g>
  </g>
</svg>
