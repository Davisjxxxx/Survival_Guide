.5" font-weight="650" fill="#183c31" text-anchor="middle">Avoid shipping</text><text x="594" y="107" font-size="11.5" font-weight="650" fill="#183c31" text-anchor="middle">lanes, hug safe</text><text x="594" y="122" font-size="11.5" font-weight="650" fill="#183c31" text-anchor="middle">shore &amp; use</text><text x="594" y="137" font-size="11.5" font-weight="650" fill="#183c31" text-anchor="middle">compass/horn/VHF</text></g>
