<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Recognize sea-fog disorientation, shipping lanes and low-visibility vessel collision risks</title>
  <desc id="desc">FAILURE-MODE ANALYSIS: Advection sea fog rolls in fast | Large ships cannot see kayaks | Hug safe shore outside ship lanes — Conceptual illustration, not to scale.</desc>
