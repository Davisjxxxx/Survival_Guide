<text x="498" y="264" class="tiny">beef, pork, veal, lamb; fish 145 F</text>
<rect x="24" y="345" width="852" height="32" rx="4" fill="#f7e5d9"/>
<text x="37" y="367" class="small">Not at temperature: return it to the heat; wash plates that held raw meat before reuse.</text>
