<path d="M190 214L300 104" stroke="#9aa1a5" stroke-width="5"/><circle cx="300" cy="104" r="20" fill="#ffffff" stroke="#183a30" stroke-width="2.4"/><path d="M300 104l9-7" stroke="#183a30" stroke-width="2.4"/>
