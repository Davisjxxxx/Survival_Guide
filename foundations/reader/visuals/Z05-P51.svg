xt-anchor="start">veined leaf</text><rect x="472" y="88" width="216" height="44" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="472" y="88" width="22" height="44" rx="4" fill="#184438"/><text x="483" y="114" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">4</text><text x="500" y="106" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">Exclude smooth-leaf</text><text x="500" y="120" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">buckthorn</text><rect x="28" y="139" width="276" height="18" rx="4" fill="#dceadf" stroke="#184438"/><text x="166" y="152" font-size="10.3" font-weight="650" fill="#183c31" text-anchor="middle">Mini-cones + stalked winter bud</text><rect x="314" y="139" width="378" height="18" rx="4" fill="#f7dfd6" stroke="#8f381c" stroke-width="1.6"/><text x="503" y="152" font-size="10.3" font-weight="650" fill="#642e1e" text-anchor="middle">HOLD: Habitat/ecology ID reference only</text></g>
