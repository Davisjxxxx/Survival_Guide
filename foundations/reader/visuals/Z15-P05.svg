<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Maintain household communication cards, out-of-area relays, and rally points</title>
  <desc id="desc">SEQUENTIAL INSTRUCTIONAL PLATE: Out-of-area relay contact + SMS texts | 2 rally points: block &amp; out-of-neighborhood | Paper wallet/backpack card for everyone — Conceptual illustration, not to scale.</desc>
