<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Multi-View Diagnostic Photography and Provenance Standards</title>
  <desc id="desc">SPECIMEN VOUCHER &amp; MULTI-VIEW PROTOCOL: Shoot habitat, habit &amp; close details | Include underside, base &amp; cm scale | Keep documentary vs diagnostic clear — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z05-P15 · SPECIMEN VOUCHER &amp; MULTI-VIEW PROTOCOL (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="specimen-doc-photo_proto-artwork"><rect x="28" y="38" width="156" height="96" rx="6" fill="#f9faef" stroke="#285345" stroke-width="2"/><rect x="28" y="38" width="156" height="22" rx="4" fill="#285345"/><text x="106" y="53" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">VIEW 1</text><path d="M40 72v-6h6M172 72v-6h-6M40 120v6h6M172 120v6h-6" fill="none" stroke="#6f8c7a" stroke-width="1.8"/><text x="106" y="84" font-size="10.6" font-weight="650" fill="#183c31" text-anchor="middle">Wide habitat &amp;</text><text x="106" y="98" font-size="10.6" font-weight="650" fill="#183c31" text-anchor="middle">host</text><path d="M185 86h9" stroke="#285345" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="196" y="38" width="156" height="96" rx="6" fill="#f9faef" stroke="#285345" stroke-width="2"/><rect x="196" y="38" width="156" height="22" rx="4" fill="#285345"/><text x="274" y="53" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">VIEW 2</text><path d="M208 72v-6h6M340 72v-6h-6M208 120v6h6M340 120v6h-6" fill="none" stroke="#6f8c7a" stroke-width="1.8"/><text x="274" y="84" font-size="10.6" font-weight="650" fill="#183c31" text-anchor="middle">Whole</text><text x="274" y="98" font-size="10.6" font-weight="650" fill="#183c31" text-anchor="middle">plant/cluster</text><path d="M353 86h9" stroke="#285345" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="364" y="38" width="156" height="96" rx="6" fill="#f9faef" stroke="#285345" stroke-width="2"/><rect x="364" y="38" width="156" height="22" rx="4" fill="#285345"/><text x="442" y="53" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">VIEW 3</text><path d="M376 72v-6h6M508 72v-6h-6M376 120v6h6M508 120v6h-6" fill="none" stroke="#6f8c7a" stroke-width="1.8"/><text x="442" y="84" font-size="10.6" font-weight="650" fill="#183c31" text-anchor="middle">Macro</text><text x="442" y="98" font-size="10.6" font-weight="650" fill="#183c31" text-anchor="middle">leaf/flower/cap</text><path d="M521 86h9" stroke="#285345" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="532" y="38" width="156" height="96" rx="6" fill="#f9faef" stroke="#285345" stroke-width="2"/><rect x="532" y="38" width="156" height="22" rx="4" fill="#285345"/><text x="610" y="53" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">VIEW 4</text><path d="M544 72v-6h6M676 72v-6h-6M544 120v6h6M676 120v6h-6" fill="none" stroke="#6f8c7a" stroke-width="1.8"/><text x="610" y="84" font-size="10.6" font-weight="650" fill="#183c31" text-anchor="middle">Underside, base +</text><text x="610" y="98" font-size="10.6" font-weight="650" fill="#183c31" text-anchor="middle">cm</text><rect x="28" y="139" width="330" height="18" rx="4" fill="#dceadf" stroke="#184438"/><text x="193" y="152" font-size="10.3" font-weight="650" fill="#183c31" text-anchor="middle">Single-angle photos fail ID</text><rect x="366" y="139" width="326" height="18" rx="4" fill="#f7dfd6" stroke="#8f381c"/><text x="529" y="152" font-size="10.3" font-weight="650" fill="#642e1e" text-anchor="middle">HOLD: Expert validation required</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Shoot habitat, habit &amp;</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">close details</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Include underside, base</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">&amp; cm scale</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Keep documentary vs</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">diagnostic clear</text></g>
