<rect x="24" y="46" width="200" height="290" rx="10" fill="#e7f0ea" stroke="#7ea08d" stroke-width="1.6"/>
<text x="40" y="72" class="head ok">1 WASH</text>
<text x="38" y="272" class="tiny">soap, then rinse</text>
<text x="38" y="293" class="tiny">completely</text>
<rect x="238" y="46" width="200" height="290" rx="10" fill="#e7f0ea" stroke="#7ea08d" stroke-width="1.6"/>
<text x="254" y="72" class="head ok">2 SANITIZE</text>
<text x="252" y="272" class="tiny">1 tsp bleach per</text>
<text x="252" y="293" class="tiny">quart; cap, shake</text>
<text x="252" y="314" class="tiny">over all surfaces</text>
<rect x="452" y="46" width="200" height="290" rx="10" fill="#e7f0ea" stroke="#7ea08d" stroke-width="1.6"/>
<text x="468" y="72" class="head ok">3 EMPTY, DRY</text>
<text x="466" y="272" class="tiny">wait 30 s or more,</text>
<text x="466" y="293" class="tiny">pour out, air-dry</text>
<rect x="666" y="46" width="200" height="290" rx="10" fill="#e7f0ea" stroke="#7ea08d" stroke-width="1.6"/>
<text x="682" y="72" class="head ok">4 FILL, LABEL</text>
<text x="680" y="272" class="tiny">safe water; label</text>
<text x="680" y="293" class="tiny">drinking water + date</text>
