ght="18" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360" y="152" font-size="10.8" font-weight="650" fill="#642e1e" text-anchor="middle">STOP: Leave physical evidence intact for Conservation Officers</text></g>
