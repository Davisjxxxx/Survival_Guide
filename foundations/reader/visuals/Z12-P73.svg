<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Manage dry-to-flooded and drought-to-wildfire abrupt landscape shifts</title>
  <desc id="desc">ENVIRONMENTAL RELATIONSHIP: Parched fuels = wildfire/bans | Hard dry soil = sudden flash flood | Keep 2 exits &amp; full carried water — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z12-P73 · ENVIRONMENTAL RELATIONSHIP (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="environment-artwork"><path d="M28 58L220 112L375 138L520 105L692 64V150H28Z" fill="#cad7b8" stroke="#53684a" stroke-width="2.5"/><path d="M280 124q95 24 190-6l-20 30H295Z" fill="#639db2"/><path d="M90 54l95 26m445-22l-95 24" stroke="#477a90" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="40" y="122" width="190" height="22" rx="4" fill="#faeee5" stroke="#a05332"/><text x="135" y="137" font-size="10.5" font-weight="650" fill="#7a2f15" text-anchor="middle">Parched fuels -&gt; Red Flag fire</text><rect x="265" y="122" width="190" height="22" rx="4" fill="#f7f4e9" stroke="#73877b"/><text x="360" y="137" font-size="10.5" font-weight="650" fill="#183c31" text-anchor="middle">Hard dry soil -&gt; flash flood</text><rect x="490" y="122" width="190" height="22" rx="4" fill="#dceadf" stroke="#184438"/><text x="585" y="137" font-size="10.5" font-weight="650" fill="#183c31" text-anchor="middle">Keep 2 exits &amp; full water</text><text x="360" y="56" font-size="11.5" font-weight="650" fill="#2b5566" text-anchor="middle">Drought drives BOTH extreme wildfire bans and violent cloudburst runoff</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Parched fuels =</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">wildfire/bans</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Hard dry soil = sudden</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">flash flood</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Keep 2 exits &amp; full</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">carried water</text></g>
  </g>
</svg>
