  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z06-P26 · WILDLIFE SIGN, TRACK &amp; HABITAT PLATE (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="wildlife-track-gait-artwork"><rect x="28" y="38" width="206" height="96" rx="6" fill="#f6f4eb" stroke="#2c4b3f" stroke-width="2.2"/><circle cx="52" cy="108" r="8" fill="#315245"/><circle cx="86" cy="68" r="8" fill="#315245"/><circle cx="124" cy="108" r="8" fill="#315245"/><circle cx="160" cy="68" r="8" fill="#315245"/><circle cx="196" cy="108" r="8" fill="#315245"/><path d="M52 108h144M52 68h144" stroke="#8f381c" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M38 126h100M38 121v8M63 123v6M88 121v8M113 123v6M138 121v8" stroke="#183c31" stroke-width="1.6"/><rect x="248" y="38" width="216" height="44" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="248" y="38" width="22" height="44" rx="4" fill="#184438"/><text x="259" y="64" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">1</text><text x="276" y="56" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">Diagonal walker: deer,</text><text x="276" y="70" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">fox, bobcat</text><rect x="472" y="38" width="216" height="44" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="472" y="38" width="22" height="44" rx="4" fill="#184438"/><text x="483" y="64" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">2</text><text x="500" y="56" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">Bounder: mink, weasel,</text><text x="500" y="70" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">fisher</text><rect x="248" y="88" width="216" height="44" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="248" y="88" width="22" height="44" rx="4" fill="#184438"/><text x="259" y="114" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">3</text><text x="276" y="106" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">Hopper: rabbit</text><text x="276" y="120" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">(staggered), squirrel</text><rect x="472" y="88" width="216" height="44" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="472" y="88" width="22" height="44" rx="4" fill="#184438"/><text x="483" y="114" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">4</text><text x="500" y="106" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">Waddler: wide track</text><text x="500" y="120" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">(bear, beaver)</text><rect x="28" y="139" width="290" height="18" rx="4" fill="#dceadf" stroke="#184438"/><text x="173" y="152" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="middle">Measure 3-5 m stride &amp; straddle</text><rect x="328" y="139" width="364" height="18" rx="4" fill="#faeee5" stroke="#a05332"/><text x="510" y="152" font-size="10.4" font-weight="650" fill="#642e1e" text-anchor="middle">Deep snow alters normal gait patterns</text></g>
