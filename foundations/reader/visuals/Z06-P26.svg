<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Animal Gait Patterns: Walkers, Bounders, Hoppers and Gallopers</title>
  <desc id="desc">WILDLIFE SIGN, TRACK &amp; HABITAT PLATE: Step back to read multi-meter gait | Measure stride and trail straddle | Combine gait with track anatomy — Conceptual illustration, not to scale.</desc>
