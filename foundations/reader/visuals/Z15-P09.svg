<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Stage household supplies and vehicles before Blizzard and Ice Storm Warnings hit</title>
  <desc id="desc">TIME / SEASONAL PROGRESSION: Watch day: fuel, Rx, charge, shovel in | Clear vents &amp; test CO/smoke alarms | Warning issued -&gt; cancel ALL non-essential drive — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z15-P09 · TIME / SEASONAL PROGRESSION (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="seasonal-timeline-storm_lead-artwork"><path d="M36 62h644" stroke="#184438" stroke-width="4" marker-end="url(#arrow)"/><circle cx="106.0" cy="62" r="8" fill="#184438" stroke="#fffdf7" stroke-width="2"/><text x="106.0" y="48" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Watch -24 h</text><rect x="28" y="76" width="156" height="58" rx="6" fill="#d5e5dc" stroke="#315245" stroke-width="2"/><text x="106.0" y="98" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Fuel cars, fill Rx,</text><text x="106.0" y="112" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">stock water &amp; pantry</text><circle cx="274.0" cy="62" r="8" fill="#184438" stroke="#fffdf7" stroke-width="2"/><text x="274.0" y="48" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Pre-Storm</text><rect x="196" y="76" width="156" height="58" rx="6" fill="#e4ebd4" stroke="#315245" stroke-width="2"/><text x="274.0" y="98" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Charge all power</text><text x="274.0" y="112" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">banks; bring shovel</text><text x="274.0" y="126" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">in</text><circle cx="442.0" cy="62" r="8" fill="#184438" stroke="#fffdf7" stroke-width="2"/><text x="442.0" y="48" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Safety Check</text><rect x="364" y="76" width="156" height="58" rx="6" fill="#f4ebd2" stroke="#315245" stroke-width="2"/><text x="442.0" y="98" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Test CO/smoke alarms</text><text x="442.0" y="112" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">&amp; note PVC vents</text><circle cx="610.0" cy="62" r="8" fill="#184438" stroke="#fffdf7" stroke-width="2"/><text x="610.0" y="48" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Warning Hit</text><rect x="532" y="76" width="156" height="58" rx="6" fill="#f5dfd5" stroke="#315245" stroke-width="2"/><text x="610.0" y="98" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Cancel ALL non-</text><text x="610.0" y="112" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">essential highway</text><text x="610.0" y="126" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">travel</text><rect x="28" y="139" width="664" height="18" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360" y="152" font-size="10.8" font-weight="650" fill="#642e1e" text-anchor="middle">Dot No-Travel &amp; Blizzard Warnings close highways faster than plows clear</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Watch day: fuel, Rx,</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">charge, shovel in</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Clear vents &amp; test</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">CO/smoke alarms</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Warning issued -&gt; cancel</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">ALL non-essential drive</text></g>
  </g>
</svg>
