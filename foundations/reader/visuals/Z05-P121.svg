<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Green-Spored Parasol (Chlorophyllum molybdites) Lawn Poisoning Leader</title>
  <desc id="desc">FUNGAL ANATOMICAL CUTAWAY: Check Chlorophyllum molybdit traits | Contrast Macrolepiota procera | Keep WITHHELD_HOLD — Conceptual illustration, not to scale.</desc>
