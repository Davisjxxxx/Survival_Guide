<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">No Emergency Legal Exemption for Traps or Snares</title>
  <desc id="desc">CORRECT VS INCORRECT CONFIGURATION: Reject emergency trap-exemption myths | Prioritize warmth, water &amp; rescue | Avoid wasting calories on snares — Conceptual illustration, not to scale.</desc>
