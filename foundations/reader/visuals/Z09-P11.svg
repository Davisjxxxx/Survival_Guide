<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Evaluate salvaged and natural cordage under abrasion and tension</title>
  <desc id="desc">MECHANISM DIAGRAM: Inspect full fiber length | Moving wraps suffer rapid wear | Gentle check ≠ load rating — Conceptual illustration, not to scale.</desc>
