<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Separate first-flush debris and roof runoff from raw storage</title>
  <desc id="desc">CUTAWAY VIEW: Discard initial washout | Screen coarse raw debris | Treat before clean storage — Conceptual illustration, not to scale.</desc>
