e="11.5" font-weight="650" fill="#183c31" text-anchor="middle">cold; never rely on</text><text x="594" y="122" font-size="11.5" font-weight="650" fill="#183c31" text-anchor="middle">friction in</text><text x="594" y="137" font-size="11.5" font-weight="650" fill="#183c31" text-anchor="middle">emergencies</text></g>
