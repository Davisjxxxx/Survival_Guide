<svg class="v02-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Preventing residential frozen plumbing pipes cutaway</title><desc id="desc">Exterior-wall cutaway showing cold air hitting an uninsulated exterior pipe versus open vanity cabinet doors admitting warm interior air and gentle faucet drip.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#972f22"/></marker><marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183a30"/></marker></defs>
<style>.v02-svg text{font-family:system-ui,sans-serif;font-size:19px;font-weight:650;fill:#183a30}.v02-svg .sm{font-size:16.5px;font-weight:600;fill:#2b473e}.v02-svg .warn{font-size:18.5px;font-weight:700;fill:#8c281b}.v02-svg .heading{font-size:19px;letter-spacing:0.8px;font-weight:750;fill:#183a30}.v02-svg .guard{font-size:15.5px;font-weight:650;fill:#6d301f}.v02-svg .leader{fill:none;stroke:#365c50;stroke-width:2.5}.v02-svg .flow{fill:none;stroke:#205b68;stroke-width:4;marker-end:url(#arr)}.v02-svg .rflow{fill:none;stroke:#972f22;stroke-width:4;marker-end:url(#arr-r)}.v02-svg .gflow{fill:none;stroke:#183a30;stroke-width:3.5;marker-end:url(#arr-g)}.v02-svg .dash{fill:none;stroke:#365c50;stroke-width:2.5;stroke-dasharray:10 7}</style>
<rect x="1" y="1" width="898" height="393" rx="16" fill="#f4f6ed" stroke="#99ad9b" stroke-width="2"/>
<text class="heading" x="26" y="34">Z13-P27 · V02 TECHNICAL ILLUSTRATION · NOT TO SCALE</text>
<g id="v02-artwork">
    <!-- Cold exterior wall left -->
    <rect x="55" y="78" width="90" height="236" fill="#bcd0d8" stroke="#205b68" stroke-width="3.5"/>
    <text class="sm" x="66" y="188">Subzero</text><text class="sm" x="66" y="214">exterior</text>
    <!-- Wall cavity with insulated pipe -->
    <rect x="145" y="78" width="110" height="236" fill="#e5d7b3" stroke="#5d653e" stroke-width="3"/>
    <rect x="188" y="128" width="24" height="184" fill="#63a4bd" stroke="#205b68" stroke-width="3"/>
    <!-- Warm interior vanity with open door -->
    <rect x="255" y="168" width="220" height="146" fill="#f5eedc" stroke="#183a30" stroke-width="3.5"/>
    <path class="rflow" d="M440 242H245"/>
    <text x="275" y="148">Open under-sink doors</text>
    <text class="sm" x="266" y="286">Warm room air reaches pipe</text>
    <!-- Right tips -->
    <text x="518" y="114">• Disconnect outdoor hoses early</text>
    <text x="518" y="154">• Insulate crawlspace &amp; garage pipes</text>
    <text x="518" y="194">• Keep heat &gt;= 55°F when away</text>
    <text class="warn" x="518" y="238">• NEVER thaw pipes with torches</text>
    <text class="sm" x="518" y="264">or open flames (house fire risk)</text>
    <text x="518" y="302">• Know main water shutoff location</text>
    </g>
<rect x="23" y="344" width="854" height="36" rx="7" fill="#f7e4d8"/>
<text class="guard" x="36" y="369">Shut main water valve immediately if a pipe bursts; never use open flames or torches to thaw pipes.</text>
</svg>
