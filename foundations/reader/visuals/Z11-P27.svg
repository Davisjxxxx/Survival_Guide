<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Understand map datums (WGS84 vs NAD27) and coordinate mismatch risk</title>
  <desc id="desc">FAILURE-MODE ANALYSIS: WGS84/NAD83 GPS point | Older NAD27 map grid | Shift offset -&gt; match datums! — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z11-P27 · FAILURE-MODE ANALYSIS (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="failure-mode-artwork"><rect x="34" y="52" width="192" height="84" rx="8" fill="#f7e5dc" stroke="#a05332" stroke-width="3"/><rect x="34" y="52" width="192" height="22" rx="6" fill="#a05332"/><text x="130" y="67" font-size="10.5" font-weight="650" fill="#fffdf7" text-anchor="middle">FAILURE CAUSE</text><text x="130" y="92" font-size="11.5" font-weight="650" fill="#5a2310" text-anchor="middle">Plotting modern</text><text x="130" y="107" font-size="11.5" font-weight="650" fill="#5a2310" text-anchor="middle">WGS84 GPS</text><text x="130" y="122" font-size="11.5" font-weight="650" fill="#5a2310" text-anchor="middle">coordinates onto</text><text x="130" y="137" font-size="11.5" font-weight="650" fill="#5a2310" text-anchor="middle">older NAD27 paper</text><text x="130" y="152" font-size="11.5" font-weight="650" fill="#5a2310" text-anchor="middle">grid</text><path d="M228 94h34" stroke="#a05332" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="266" y="52" width="192" height="84" rx="8" fill="#f6f1d9" stroke="#8a7228" stroke-width="3"/><rect x="266" y="52" width="192" height="22" rx="6" fill="#8a7228"/><text x="362" y="67" font-size="10.5" font-weight="650" fill="#fffdf7" text-anchor="middle">RECOGNIZE CUE</text><text x="362" y="92" font-size="11.5" font-weight="650" fill="#443810" text-anchor="middle">Plotted dot shifts</text><text x="362" y="107" font-size="11.5" font-weight="650" fill="#443810" text-anchor="middle">tens to hundreds of</text><text x="362" y="122" font-size="11.5" font-weight="650" fill="#443810" text-anchor="middle">meters off actual</text><text x="362" y="137" font-size="11.5" font-weight="650" fill="#443810" text-anchor="middle">terrain</text><path d="M460 94h34" stroke="#285345" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="498" y="52" width="192" height="84" rx="8" fill="#dceadf" stroke="#184438" stroke-width="3"/><rect x="498" y="52" width="192" height="22" rx="6" fill="#184438"/><text x="594" y="67" font-size="10.5" font-weight="650" fill="#fffdf7" text-anchor="middle">CORRECT / ABORT</text><text x="594" y="92" font-size="11.5" font-weight="650" fill="#183c31" text-anchor="middle">Match GPS datum to</text><text x="594" y="107" font-size="11.5" font-weight="650" fill="#183c31" text-anchor="middle">map margin or use</text><text x="594" y="122" font-size="11.5" font-weight="650" fill="#183c31" text-anchor="middle">current WGS84/NAD83</text><text x="594" y="137" font-size="11.5" font-weight="650" fill="#183c31" text-anchor="middle">topo</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">WGS84/NAD83 GPS point</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Older NAD27 map grid</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Shift offset -&gt; match</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">datums!</text></g>
