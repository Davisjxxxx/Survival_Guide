<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Canning methods USDA does not recommend, and the tested equipment</title>
<desc id="desc">Left: jars processed in a conventional oven, open-kettle filling with jars turned upside down, a microwave oven, a dishwasher and a paraffin wax seal are each crossed out; USDA does not recommend them because they do not prevent all risks of spoilage. Right: a boiling-water canner with water over the jar tops and a pressure canner holding at least four quart jars, used with a tested recipe. Conceptual, not to scale.</desc>
