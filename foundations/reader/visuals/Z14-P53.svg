<text x="520" y="271" class="tiny">no low-acid foods</text>
<rect x="24" y="345" width="852" height="32" rx="4" fill="#f7e5d9"/>
<text x="37" y="367" class="small">Recipe, adjusted time or equipment outside these limits: use the correct tested method.</text>
