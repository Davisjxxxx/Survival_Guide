<svg class="v02-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Stranded winter vehicle exhaust clearance and CO protection</title><desc id="desc">Side elevation of a snow-drifted stranded vehicle showing the mandatory clear tailpipe tunnel, slightly cracked downwind window, bright roof/antenna cloth, and staying inside.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#972f22"/></marker><marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183a30"/></marker></defs>
<style>.v02-svg text{font-family:system-ui,sans-serif;font-size:19px;font-weight:650;fill:#183a30}.v02-svg .sm{font-size:16.5px;font-weight:600;fill:#2b473e}.v02-svg .warn{font-size:18.5px;font-weight:700;fill:#8c281b}.v02-svg .heading{font-size:19px;letter-spacing:0.8px;font-weight:750;fill:#183a30}.v02-svg .guard{font-size:15.5px;font-weight:650;fill:#6d301f}.v02-svg .leader{fill:none;stroke:#365c50;stroke-width:2.5}.v02-svg .flow{fill:none;stroke:#205b68;stroke-width:4;marker-end:url(#arr)}.v02-svg .rflow{fill:none;stroke:#972f22;stroke-width:4;marker-end:url(#arr-r)}.v02-svg .gflow{fill:none;stroke:#183a30;stroke-width:3.5;marker-end:url(#arr-g)}.v02-svg .dash{fill:none;stroke:#365c50;stroke-width:2.5;stroke-dasharray:10 7}</style>
<rect x="1" y="1" width="898" height="393" rx="16" fill="#f4f6ed" stroke="#99ad9b" stroke-width="2"/>
<text class="heading" x="26" y="34">Z15-P13 · V02 TECHNICAL ILLUSTRATION · NOT TO SCALE</text>
<g id="v02-artwork">
    <!-- Snow bank & road -->
    <path d="M45 288Q160 220 265 272H855V312H45Z" fill="#e2eef2" stroke="#205b68" stroke-width="3"/>
    <!-- Vehicle silhouette -->
    <path d="M275 268V218L340 166H565L635 218V268Z" fill="#d7e2da" stroke="#183a30" stroke-width="4"/>
    <rect x="355" y="178" width="90" height="36" rx="4" fill="#eef4f2" stroke="#183a30" stroke-width="2.5"/>
    <rect x="462" y="178" width="88" height="36" rx="4" fill="#eef4f2" stroke="#183a30" stroke-width="2.5"/>
    <circle cx="348" cy="272" r="28" fill="#364247"/><circle cx="572" cy="272" r="28" fill="#364247"/>
    <!-- Bright visibility cloth on antenna -->
    <line x1="590" y1="168" x2="590" y2="106" stroke="#183a30" stroke-width="4"/>
    <polygon points="590,108 652,120 590,136" fill="#d97236" stroke="#972f22" stroke-width="2.5"/>
    <!-- Cleared exhaust tailpipe left -->
    <rect x="235" y="254" width="42" height="12" fill="#4f5c57"/>
    <path class="rflow" d="M230 260H125"/>
    <text class="warn" x="55" y="128">1. Keep tailpipe CLEAR</text><text class="warn" x="55" y="156">of snow before idling!</text>
    <path class="leader" d="M180 168l48 80"/>
    <text x="665" y="126">2. Tie bright cloth</text>
    <text x="665" y="174">3. Crack downwind</text><text class="sm" x="665" y="200">window slightly</text>
    <text x="665" y="246">4. Stay with car;</text><text class="sm" x="665" y="272">run briefly for heat</text>
    </g>
<rect x="23" y="344" width="854" height="36" rx="7" fill="#f7e4d8"/>
<text class="guard" x="36" y="369">A snow-blocked exhaust pipe fills the cabin with lethal CO within minutes; stay inside in whiteouts.</text>
</svg>
