<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Small Game Ecology: Cottontails, Snowshoe Hares and Squirrels</title>
  <desc id="desc">WILDLIFE SIGN, TRACK &amp; HABITAT PLATE: Match species to brush or boreal cover | Note 45-degree clipped woody twigs | Enforce tularemia glove hygiene — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z06-P22 · WILDLIFE SIGN, TRACK &amp; HABITAT PLATE (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="wildlife-track-tracks-artwork"><rect x="28" y="38" width="206" height="96" rx="6" fill="#f6f4eb" stroke="#2c4b3f" stroke-width="2.2"/><ellipse cx="82" cy="96" rx="16" ry="12" fill="#4f6c5d"/><ellipse cx="62" cy="74" rx="6" ry="9" fill="#315245"/><ellipse cx="75" cy="64" rx="6" ry="9" fill="#315245"/><ellipse cx="91" cy="64" rx="6" ry="9" fill="#315245"/><ellipse cx="102" cy="74" rx="6" ry="9" fill="#315245"/><path d="M148 112c-12-16-8-42 6-52c4 14 4 38-6 52ZM176 112c12-16 8-42-6-52c-4 14-4 38 6 52Z" fill="#5e4b35"/><path d="M38 126h100M38 121v8M63 123v6M88 121v8M113 123v6M138 121v8" stroke="#183c31" stroke-width="1.6"/><rect x="248" y="38" width="216" height="44" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="248" y="38" width="22" height="44" rx="4" fill="#184438"/><text x="259" y="64" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">1</text><text x="276" y="56" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">Hind prints land ahead of</text><text x="276" y="70" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">fronts</text><rect x="472" y="38" width="216" height="44" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="472" y="38" width="22" height="44" rx="4" fill="#184438"/><text x="483" y="64" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">2</text><text x="500" y="56" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">Staggered fronts =</text><text x="500" y="70" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">rabbit/hare</text><rect x="248" y="88" width="216" height="44" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="248" y="88" width="22" height="44" rx="4" fill="#184438"/><text x="259" y="114" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">3</text><text x="276" y="106" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">Paired fronts = tree</text><text x="276" y="120" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">squirrel</text><rect x="472" y="88" width="216" height="44" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="472" y="88" width="22" height="44" rx="4" fill="#184438"/><text x="483" y="114" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">4</text><text x="500" y="106" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">Clean 45-deg incisor twig</text><text x="500" y="120" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">cut</text><rect x="28" y="139" width="290" height="18" rx="4" fill="#dceadf" stroke="#184438"/><text x="173" y="152" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="middle">Measure stride &amp; hind-foot length</text><rect x="328" y="139" width="364" height="18" rx="4" fill="#faeee5" stroke="#a05332"/><text x="510" y="152" font-size="10.4" font-weight="650" fill="#642e1e" text-anchor="middle">Wear gloves; reject sick rabbits (tularemia)</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Match species to brush</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">or boreal cover</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Note 45-degree clipped</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">woody twigs</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Enforce tularemia glove</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">hygiene</text></g>
  </g>
</svg>
