<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Map two independent neighborhood exit routes and override unsafe GPS detours</title>
  <desc id="desc">ENVIRONMENTAL RELATIONSHIP: Mark ≥2 opposite exit routes on PAPER map | Obey live deputies &amp; DOT over GPS apps | Never bypass road barricades or water — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z15-P51 · ENVIRONMENTAL RELATIONSHIP (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="environment-artwork"><path d="M28 136Q185 150 325 110T692 68V150H28Z" fill="#cbd7bc" stroke="#566b4e" stroke-width="2.5"/><path d="M72 64h142" stroke="#a05332" stroke-width="4" marker-end="url(#arrow)"/><rect x="522" y="54" width="128" height="44" rx="7" fill="#dfeae0" stroke="#184438" stroke-width="3"/><rect x="40" y="122" width="190" height="22" rx="4" fill="#faeee5" stroke="#a05332"/><text x="135" y="137" font-size="10.5" font-weight="650" fill="#7a2f15" text-anchor="middle">Primary Route A (monitored)</text><rect x="265" y="122" width="190" height="22" rx="4" fill="#f7f4e9" stroke="#73877b"/><text x="360" y="137" font-size="10.5" font-weight="650" fill="#183c31" text-anchor="middle">Flood/fire closure + GPS trap</text><rect x="490" y="122" width="190" height="22" rx="4" fill="#dceadf" stroke="#184438"/><text x="585" y="137" font-size="10.5" font-weight="650" fill="#183c31" text-anchor="middle">Independent Opposite Route B</text><text x="360" y="56" font-size="11.5" font-weight="650" fill="#2b5566" text-anchor="middle">Keep PAPER county map in car — obey deputies/DOT over GPS apps</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Mark ≥2 opposite exit</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">routes on PAPER map</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Obey live deputies &amp; DOT</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">over GPS apps</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Never bypass road</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">barricades or water</text></g>
  </g>
</svg>
