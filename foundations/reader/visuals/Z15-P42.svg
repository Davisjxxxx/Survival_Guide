<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Anticipate cascading infrastructure failures during prolonged grid blackouts</title>
  <desc id="desc">MECHANISM DIAGRAM: Grid loss kills gas pumps, ATMs &amp; cell towers | Keep fuel &gt;1/2 tank, cash, water &amp; paper list | Utilities restore hospitals &amp; mains before taps — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z15-P42 · MECHANISM DIAGRAM (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="mechanism-artwork"><rect x="38" y="54" width="168" height="68" rx="10" fill="#d3e3dc" stroke="#285345" stroke-width="3"/><text x="122" y="84" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Wide-area grid</text><text x="122" y="99" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">blackout</text><path d="M208 88h56" stroke="#285345" stroke-width="4" marker-end="url(#arrow)"/><ellipse cx="360" cy="88" rx="88" ry="42" fill="#c97b42" fill-opacity="0.28" stroke="#c97b42" stroke-width="3.5"/><text x="360" y="84" font-size="12" font-weight="700" fill="#183c31" text-anchor="middle">Gas pumps, ATMs,</text><text x="360" y="99" font-size="12" font-weight="700" fill="#183c31" text-anchor="middle">towers &amp; wells</text><text x="360" y="114" font-size="12" font-weight="700" fill="#183c31" text-anchor="middle">fail</text><path d="M450 88h56" stroke="#285345" stroke-width="4" marker-end="url(#arrow)"/><rect x="514" y="54" width="168" height="68" rx="10" fill="#e5ebd8" stroke="#285345" stroke-width="3"/><text x="598" y="84" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Half-tank, cash,</text><text x="598" y="99" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">water &amp; paper</text><text x="598" y="114" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">buffers</text><path d="M360 130v14" stroke="#a05332" stroke-width="3"/><rect x="215" y="136" width="290" height="20" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360" y="150" font-size="10.5" font-weight="650" fill="#7a2f15" text-anchor="middle">Restore hospitals &amp; mains before rural taps</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Grid loss kills gas</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">pumps, ATMs &amp; cell</text><text x="32" y="218" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">towers</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Keep fuel &gt;1/2 tank,</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">cash, water &amp; paper list</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Utilities restore</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">hospitals &amp; mains before</text><text x="498" y="218" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">taps</text></g>
  </g>
</svg>
