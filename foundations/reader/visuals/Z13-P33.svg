<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">How much drinking water to store for a household</title>
<desc id="desc">A household of four. Left: the minimum of 1 gallon per person per day for 3 days drawn as a grid of 12 one-gallon jugs, one row per person and one column per day. Centre: the 2-week goal of 56 gallons drawn as eleven 5-gallon containers and one 1-gallon jug. Right: more water for pregnancy, illness, pets or a hot climate, and storage in a cool place (50 to 70 degrees F) out of direct sunlight and away from gasoline and pesticides. Conceptual, not to scale.</desc>
