<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Isolate suspect canned food and follow official disposal guidance</title>
  <desc id="desc">CONDITIONAL DECISION: Isolate suspect jar and prevent exposure | Use official disposal instructions | Call for help if exposure is suspected — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z14-P62 · CONDITIONAL DECISION (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="conditional-artwork"><rect x="40" y="42" width="640" height="25" rx="5" fill="#dce8df" stroke="#285345"/><text x="360" y="59" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Has anyone eaten the suspect preserved food?</text><rect x="40" y="82" width="305" height="46" rx="6" fill="#f9faef" stroke="#688476"/><text x="66" y="104" font-size="10" font-weight="650" fill="#183c31" text-anchor="middle">YES</text><text x="93" y="101" font-size="11" font-weight="650" fill="#183c31" text-anchor="start">Call Poison Control or public</text><text x="93" y="114" font-size="11" font-weight="650" fill="#183c31" text-anchor="start">health. Symptoms need</text><text x="93" y="127" font-size="11" font-weight="650" fill="#183c31" text-anchor="start">emergency care.</text><rect x="375" y="82" width="305" height="46" rx="6" fill="#f9faef" stroke="#688476"/><text x="401" y="104" font-size="10" font-weight="650" fill="#183c31" text-anchor="middle">NO</text><text x="428" y="101" font-size="11" font-weight="650" fill="#183c31" text-anchor="start">Keep the jar isolated and</text><text x="428" y="114" font-size="11" font-weight="650" fill="#183c31" text-anchor="start">obtain official disposal</text><text x="428" y="127" font-size="11" font-weight="650" fill="#183c31" text-anchor="start">instructions.</text><text x="360" y="149" font-size="11" font-weight="650" fill="#672d18" text-anchor="middle">Never taste, open a sealed suspect jar, or improvise disposal</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Isolate suspect jar and</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">prevent exposure</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Use official disposal</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">instructions</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Call for help if</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">exposure is suspected</text></g>
  </g>
</svg>
