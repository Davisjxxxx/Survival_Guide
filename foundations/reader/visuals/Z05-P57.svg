<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Lowbush Blueberry (Vaccinium angustifolium) vs Toxic Bog Heaths</title>
  <desc id="desc">BOTANICAL DIAGNOSTIC MORPHOLOGY: Check Vaccinium angustifoliu traits | Contrast Kalmia polifolia | Keep WITHHELD_HOLD — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z05-P57 · BOTANICAL DIAGNOSTIC MORPHOLOGY (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="botanical-morphology-berry_shrub-artwork"><rect x="28" y="38" width="206" height="96" rx="6" fill="#f6f7ef" stroke="#2c4b3f" stroke-width="2.2"/><path d="M44 114L176 54" stroke="#5e4b35" stroke-width="3.2"/><ellipse cx="86" cy="70" rx="20" ry="9" transform="rotate(-35 86 70)" fill="#94b698" stroke="#184438" stroke-width="1.8"/><ellipse cx="134" cy="96" rx="20" ry="9" transform="rotate(28 134 96)" fill="#94b698" stroke="#184438" stroke-width="1.8"/><circle cx="164" cy="68" r="7.5" fill="#4f3d59" stroke="#183c31" stroke-width="1.6"/><circle cx="182" cy="74" r="7.5" fill="#4f3d59" stroke="#183c31" stroke-width="1.6"/><circle cx="172" cy="88" r="7.5" fill="#4f3d59" stroke="#183c31" stroke-width="1.6"/><circle cx="192" cy="86" r="7.5" fill="#4f3d59" stroke="#183c31" stroke-width="1.6"/><path d="M38 127h72M38 123v7M74 123v7M110 123v7" stroke="#183c31" stroke-width="1.6"/><rect x="248" y="38" width="216" height="44" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="248" y="38" width="22" height="44" rx="4" fill="#184438"/><text x="259" y="64" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">1</text><text x="276" y="56" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">Low woody acid-soil shrub</text><rect x="472" y="38" width="216" height="44" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="472" y="38" width="22" height="44" rx="4" fill="#184438"/><text x="483" y="64" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">2</text><text x="500" y="56" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">Dusty blue berry +</text><text x="500" y="70" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">5-point crown</text><rect x="248" y="88" width="216" height="44" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="248" y="88" width="22" height="44" rx="4" fill="#184438"/><text x="259" y="114" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">3</text><text x="276" y="106" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">Many tiny soft seeds</text><text x="276" y="120" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">inside</text><rect x="472" y="88" width="216" height="44" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="472" y="88" width="22" height="44" rx="4" fill="#184438"/><text x="483" y="114" font-size="10.6" font-weight="650" fill="#fffdf7" text-anchor="middle">4</text><text x="500" y="106" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">Exclude toxic bog heaths</text><text x="500" y="120" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="start">&amp; SNAs</text><rect x="28" y="139" width="276" height="18" rx="4" fill="#dceadf" stroke="#184438"/><text x="166" y="152" font-size="10.3" font-weight="650" fill="#183c31" text-anchor="middle">Crown star close-up + leaf margin</text><rect x="314" y="139" width="378" height="18" rx="4" fill="#f7dfd6" stroke="#8f381c" stroke-width="1.6"/><text x="503" y="152" font-size="10.3" font-weight="650" fill="#642e1e" text-anchor="middle">HOLD: Verify land rules; consumption withheld</text></g>
