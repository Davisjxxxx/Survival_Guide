<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Hunting and Angling Trip Plans and Emergency Incident Reporting</title>
  <desc id="desc">SEQUENTIAL INSTRUCTIONAL PLATE: Leave exact water/unit plan ashore | Carry bleeding &amp; thermal essentials | Activate 911 early for trauma — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z06-P48 · SEQUENTIAL INSTRUCTIONAL PLATE (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="sequence-plate-hunt_plan-artwork"><rect x="26" y="44" width="152" height="90" rx="8" fill="#dce8df" stroke="#285345" stroke-width="2.3"/><circle cx="44" cy="58" r="11" fill="#184438"/><text x="44" y="62" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">1</text><text x="61" y="58" font-size="11" font-weight="700" fill="#183c31" text-anchor="start">1. Trip plan</text><path d="M36 78h132" stroke="#9bb1a3" stroke-width="1.5"/><text x="102.0" y="95.0" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">Lake/unit &amp; overdue</text><text x="102.0" y="108.5" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">time</text><path d="M180 89h12" stroke="#184438" stroke-width="3" marker-end="url(#arrow)"/><rect x="196" y="44" width="152" height="90" rx="8" fill="#e3ece5" stroke="#285345" stroke-width="2.3"/><circle cx="214" cy="58" r="11" fill="#184438"/><text x="214" y="62" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">2</text><text x="231" y="58" font-size="11" font-weight="700" fill="#183c31" text-anchor="start">2. Pack safety</text><path d="M206 78h132" stroke="#9bb1a3" stroke-width="1.5"/><text x="272.0" y="95.0" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">PFD, blaze, bleed &amp;</text><text x="272.0" y="108.5" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">light</text><path d="M350 89h12" stroke="#184438" stroke-width="3" marker-end="url(#arrow)"/><rect x="366" y="44" width="152" height="90" rx="8" fill="#eef2e4" stroke="#285345" stroke-width="2.3"/><circle cx="384" cy="58" r="11" fill="#184438"/><text x="384" y="62" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">3</text><text x="401" y="58" font-size="11" font-weight="700" fill="#183c31" text-anchor="start">3. Clear gear</text><path d="M376 78h132" stroke="#9bb1a3" stroke-width="1.5"/><text x="442.0" y="95.0" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">Unload arms if</text><text x="442.0" y="108.5" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">injury hits</text><path d="M520 89h12" stroke="#184438" stroke-width="3" marker-end="url(#arrow)"/><rect x="536" y="44" width="152" height="90" rx="8" fill="#d5e4da" stroke="#285345" stroke-width="2.3"/><circle cx="554" cy="58" r="11" fill="#184438"/><text x="554" y="62" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">4</text><text x="571" y="58" font-size="11" font-weight="700" fill="#183c31" text-anchor="start">4. Call 911</text><path d="M546 78h132" stroke="#9bb1a3" stroke-width="1.5"/><text x="612.0" y="95.0" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">Exact access &amp; GPS</text><text x="612.0" y="108.5" font-size="10.8" font-weight="600" fill="#183c31" text-anchor="middle">coords</text><rect x="26" y="139" width="668" height="18" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360" y="152" font-size="10.8" font-weight="650" fill="#642e1e" text-anchor="middle">Emergency rescue always overrides hunting or fishing plans</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Leave exact water/unit</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">plan ashore</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Carry bleeding &amp; thermal</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">essentials</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Activate 911 early for</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">trauma</text></g>
  </g>
</svg>
