<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Recognize firm thresholds when 30-day home resilience must yield to aid or exit</title>
  <desc id="desc">DECISION TREE: 5 hard red lines: Meds/Temp/CO/H2O/Order | Relocation is plan SUCCESS, not failure | Exit with daylight, fuel &amp; energy intact — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z15-P62 · DECISION TREE (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="decision-tree-artwork"><polygon points="125,44 215,82 125,120 35,82" fill="#e6eee6" stroke="#184438" stroke-width="2.8"/><text x="125" y="79" font-size="11" font-weight="700" fill="#183c31" text-anchor="middle">Meds/H2O &gt;48 h</text><text x="125" y="93" font-size="11" font-weight="700" fill="#183c31" text-anchor="middle">&amp; safe temp?</text><path d="M215 82h60" stroke="#285345" stroke-width="3" marker-end="url(#arrow)"/><text x="244" y="75" font-size="10" font-weight="650" fill="#184438" text-anchor="middle">YES</text><polygon points="365,44 455,82 365,120 275,82" fill="#e6eee6" stroke="#184438" stroke-width="2.8"/><text x="365" y="79" font-size="11" font-weight="700" fill="#183c31" text-anchor="middle">Zero</text><text x="365" y="93" font-size="11" font-weight="700" fill="#183c31" text-anchor="middle">CO/gas/sewage</text><text x="365" y="107" font-size="11" font-weight="700" fill="#183c31" text-anchor="middle">&amp; no order?</text><path d="M455 82h55" stroke="#285345" stroke-width="3" marker-end="url(#arrow)"/><text x="482" y="75" font-size="10" font-weight="650" fill="#184438" text-anchor="middle">YES</text><rect x="516" y="54" width="166" height="56" rx="8" fill="#d3e6d6" stroke="#184438" stroke-width="3"/><text x="599" y="79" font-size="11.5" font-weight="700" fill="#183c31" text-anchor="middle">Continue steady</text><text x="599" y="93" font-size="11.5" font-weight="700" fill="#183c31" text-anchor="middle">home pacing</text><path d="M125 120v14h240v-14" fill="none" stroke="#a05332" stroke-width="2.5"/><text x="142" y="131" font-size="9.5" font-weight="650" fill="#8b3e1f" text-anchor="middle">NO</text><text x="382" y="131" font-size="9.5" font-weight="650" fill="#8b3e1f" text-anchor="middle">NO</text><rect x="115" y="132" width="490" height="22" rx="5" fill="#faeee5" stroke="#a05332" stroke-width="2"/><text x="360" y="147" font-size="11" font-weight="650" fill="#7a2f15" text-anchor="middle">RELOCATE OR CALL 911 NOW: Crossing ANY of the 5 red lines = plan SUCCESS</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">5 hard red lines:</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Meds/Temp/CO/H2O/Order</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Relocation is plan</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">SUCCESS, not failure</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Exit with daylight, fuel</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">&amp; energy intact</text></g>
  </g>
</svg>
