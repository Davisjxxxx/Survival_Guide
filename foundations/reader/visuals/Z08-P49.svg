<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Biological, Chemical and UV Degradation of Natural Materials</title>
  <desc id="desc">NON-DESTRUCTIVE MINERAL OBSERVATION PLATE: Check moisture rot and insect dust | Inspect UV chalking and rust | Retire degraded items early — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z08-P49 · NON-DESTRUCTIVE MINERAL OBSERVATION PLATE (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="mineral-test-degradation-artwork"><rect x="28" y="38" width="164" height="96" rx="6" fill="#eef3ee" stroke="#285345" stroke-width="2.2"/><path d="M46 56h128M46 76h128M46 96h128M46 116h128" stroke="#6f8c7a" stroke-width="2"/><rect x="36" y="44" width="22" height="10" rx="2" fill="#315245" opacity="0.45"/><text x="186" y="53" font-size="9.4" font-weight="650" fill="#183c31" text-anchor="end">1-2 Soft</text><rect x="36" y="64" width="40" height="10" rx="2" fill="#315245" opacity="0.61"/><text x="186" y="73" font-size="9.4" font-weight="650" fill="#183c31" text-anchor="end">3-5 Mid</text><rect x="36" y="84" width="58" height="10" rx="2" fill="#315245" opacity="0.77"/><text x="186" y="93" font-size="9.4" font-weight="650" fill="#183c31" text-anchor="end">6-7 Quartz</text><rect x="36" y="104" width="76" height="10" rx="2" fill="#315245" opacity="0.93"/><text x="186" y="113" font-size="9.4" font-weight="650" fill="#183c31" text-anchor="end">8-10 Hard</text><rect x="206" y="38" width="236" height="44" rx="6" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="206" y="38" width="24" height="44" rx="4" fill="#285345"/><text x="218" y="64" font-size="11" font-weight="650" fill="#fffdf7" text-anchor="middle">1</text><text x="238" y="56" font-size="10.6" font-weight="650" fill="#183c31" text-anchor="start">Fungal rot: soft &amp; musty</text><text x="238" y="70" font-size="10.6" font-weight="650" fill="#183c31" text-anchor="start">smell</text><rect x="452" y="38" width="236" height="44" rx="6" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="452" y="38" width="24" height="44" rx="4" fill="#285345"/><text x="464" y="64" font-size="11" font-weight="650" fill="#fffdf7" text-anchor="middle">2</text><text x="484" y="56" font-size="10.6" font-weight="650" fill="#183c31" text-anchor="start">Insects: pinholes &amp; fine</text><text x="484" y="70" font-size="10.6" font-weight="650" fill="#183c31" text-anchor="start">frass</text><rect x="206" y="88" width="236" height="44" rx="6" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="206" y="88" width="24" height="44" rx="4" fill="#285345"/><text x="218" y="114" font-size="11" font-weight="650" fill="#fffdf7" text-anchor="middle">3</text><text x="238" y="106" font-size="10.6" font-weight="650" fill="#183c31" text-anchor="start">UV sun: chalky brittle</text><text x="238" y="120" font-size="10.6" font-weight="650" fill="#183c31" text-anchor="start">fibers</text><rect x="452" y="88" width="236" height="44" rx="6" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="452" y="88" width="24" height="44" rx="4" fill="#285345"/><text x="464" y="114" font-size="11" font-weight="650" fill="#fffdf7" text-anchor="middle">4</text><text x="484" y="106" font-size="10.6" font-weight="650" fill="#183c31" text-anchor="start">Corrosion: rust swell at</text><text x="484" y="120" font-size="10.6" font-weight="650" fill="#183c31" text-anchor="start">eyes</text><rect x="28" y="139" width="290" height="18" rx="4" fill="#dceadf" stroke="#184438"/><text x="173" y="152" font-size="10.4" font-weight="650" fill="#183c31" text-anchor="middle">Inspect in daylight before use</text><rect x="328" y="139" width="364" height="18" rx="4" fill="#faeee5" stroke="#a05332"/><text x="510" y="152" font-size="10.4" font-weight="650" fill="#642e1e" text-anchor="middle">Retire degraded gear before failure</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Check moisture rot and</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">insect dust</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Inspect UV chalking and</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">rust</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Retire degraded items</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">early</text></g>
  </g>
</svg>
