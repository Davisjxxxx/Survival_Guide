<svg class="v02-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Safe home-canned jar storage cutaway</title><desc id="desc">Shelf cross-section showing labeled band-free sealed jars stored single-layer (no stacking) in a cool 50-70 F dark dry cupboard away from hot pipes or freezing walls.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#972f22"/></marker><marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183a30"/></marker></defs>
<style>.v02-svg text{font-family:system-ui,sans-serif;font-size:19px;font-weight:650;fill:#183a30}.v02-svg .sm{font-size:16.5px;font-weight:600;fill:#2b473e}.v02-svg .warn{font-size:18.5px;font-weight:700;fill:#8c281b}.v02-svg .heading{font-size:19px;letter-spacing:0.8px;font-weight:750;fill:#183a30}.v02-svg .guard{font-size:15.5px;font-weight:650;fill:#6d301f}.v02-svg .leader{fill:none;stroke:#365c50;stroke-width:2.5}.v02-svg .flow{fill:none;stroke:#205b68;stroke-width:4;marker-end:url(#arr)}.v02-svg .rflow{fill:none;stroke:#972f22;stroke-width:4;marker-end:url(#arr-r)}.v02-svg .gflow{fill:none;stroke:#183a30;stroke-width:3.5;marker-end:url(#arr-g)}.v02-svg .dash{fill:none;stroke:#365c50;stroke-width:2.5;stroke-dasharray:10 7}</style>
<rect x="1" y="1" width="898" height="393" rx="16" fill="#f4f6ed" stroke="#99ad9b" stroke-width="2"/>
<text class="heading" x="26" y="34">Z14-P60 · V02 TECHNICAL ILLUSTRATION · NOT TO SCALE</text>
<g id="v02-artwork">
    <!-- Shelf -->
    <rect x="55" y="256" width="510" height="20" fill="#8b6f3d" stroke="#472d18" stroke-width="3"/>
    <!-- 3 neat unstacked jars -->
    <rect x="92" y="152" width="96" height="102" rx="10" fill="#eef4f2" stroke="#183a30" stroke-width="3.5"/>
    <rect x="98" y="182" width="84" height="66" fill="#bc785b" opacity=".75"/>
    <rect x="104" y="142" width="72" height="10" fill="#c9b489" stroke="#5c4b2b" stroke-width="2.5"/>
    <rect x="242" y="152" width="96" height="102" rx="10" fill="#eef4f2" stroke="#183a30" stroke-width="3.5"/>
    <rect x="248" y="182" width="84" height="66" fill="#8eb5a7" opacity=".8"/>
    <rect x="254" y="142" width="72" height="10" fill="#c9b489" stroke="#5c4b2b" stroke-width="2.5"/>
    <rect x="392" y="152" width="96" height="102" rx="10" fill="#eef4f2" stroke="#183a30" stroke-width="3.5"/>
    <rect x="398" y="182" width="84" height="66" fill="#d9a15b" opacity=".8"/>
    <rect x="404" y="142" width="72" height="10" fill="#c9b489" stroke="#5c4b2b" stroke-width="2.5"/>
    <text x="82" y="112">Ring bands OFF · labeled · single layer</text>
    <text class="sm" x="110" y="302">Cool (50–70°F), dark, dry shelf</text>
    <!-- Right rejection box -->
    <rect x="595" y="92" width="265" height="214" rx="12" fill="#f7e4d8" stroke="#972f22" stroke-width="3"/>
    <text class="warn" x="615" y="128">Reject &amp; NEVER taste:</text>
    <text x="615" y="166">• Bulging / unsealed lid</text>
    <text x="615" y="200">• Spurting or fizzing</text>
    <text x="615" y="234">• Mold, odor or leak</text>
    <text class="sm" x="615" y="276">Bands off prevent false</text>
    <text class="sm" x="615" y="298">re-seals hiding spoilage</text>
    </g>
<rect x="23" y="344" width="854" height="36" rx="7" fill="#f7e4d8"/>
<text class="guard" x="36" y="369">Store clean, labelled jars with bands off. Follow NCHFP spoilage and disposal advice.</text>
</svg>
