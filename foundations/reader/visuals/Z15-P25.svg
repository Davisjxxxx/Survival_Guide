<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Vertical refuge when dry evacuation is cut off</title><desc id="desc">A home section places floodwater at the lower level. An internal arrow goes up to the highest open level. A closed attic is marked as a trap. The roof is last resort only.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b3825"/></marker></defs>
<style>text{font:650 20px system-ui,sans-serif;fill:#183a30}.small{font-size:18px}.warn{fill:#8b3825}.arrow{stroke:#205b68;stroke-width:4;fill:none;marker-end:url(#a)}.reverse{stroke:#8b3825;stroke-width:4;fill:none;marker-end:url(#b)}</style>
<rect x="1" y="1" width="898" height="393" rx="12" fill="#f2f3e9" stroke="#789481" stroke-width="2"/>
<text x="24" y="32" class="small">Z15-P25 · TECHNICAL REVIEW · NOT TO SCALE</text>
<path d="M56 161L262 71L469 161Z" fill="#ddd6be" stroke="#315747" stroke-width="4"/><rect x="75" y="161" width="376" height="165" fill="#f4ecd9" stroke="#315747" stroke-width="4"/><path d="M75 227H451M75 165H451" stroke="#315747" stroke-width="3"/><path d="M34 276Q60 266 87 275T140 275T193 275T246 275T299 275T352 275T405 275T478 275V327H34Z" fill="#83b2bf" opacity=".9"/><path d="M120 268L164 239L207 205" class="arrow"/><text x="219" y="209">Highest open level</text><text x="215" y="135" class="warn">Closed attic</text><path d="M194 116l16 18m0-18l-16 18" stroke="#923a25" stroke-width="4"/><text x="511" y="115">If trapped in a building</text><text x="511" y="155" class="small">Go up. Avoid enclosed attics.</text><text x="511" y="194" class="small">Roof only if necessary.</text><text x="511" y="234" class="small">Call for help and signal.</text>
<rect x="24" y="345" width="852" height="32" rx="4" fill="#f7e5d9"/><text x="37" y="367" class="small">Use a safe dry evacuation route if available. Keep out of floodwater.</text>
</svg>
