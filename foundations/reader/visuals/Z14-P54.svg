<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Operate a pressure canner cleanly: 10-minute steam vent and target PSI</title>
  <desc id="desc">SYSTEM SEPARATION &amp; BOUNDARY: Clear vent pipe -&gt; 10 MIN FULL STEAM VENT | Apply weight -&gt; reach altitude-adjusted PSI | Hold steady PSI full time; avoid swings — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z14-P54 · SYSTEM SEPARATION &amp; BOUNDARY (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="system-boundary-canning_pressure-artwork"><rect x="44" y="50" width="206" height="82" rx="8" fill="#dbe6ea" stroke="#184438" stroke-width="3"/><path d="M40 50h214" stroke="#184438" stroke-width="6"/><circle cx="147" cy="44" r="9" fill="#fffdf7" stroke="#184438" stroke-width="2"/><rect x="280" y="54" width="160" height="74" rx="6" fill="#f5f1e2" stroke="#7c6928" stroke-width="2.5"/><rect x="470" y="50" width="206" height="82" rx="8" fill="#faeee5" stroke="#8f381c" stroke-width="2.8"/><rect x="42" y="58" width="194" height="58" rx="5" fill="#fffdf7" fill-opacity="0.88" stroke="#184438"/><text x="139" y="82" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">10-MIN FULL STEAM VENT</text><text x="139" y="96" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">Purges cold insulating</text><text x="139" y="110" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">air first</text><rect x="264" y="60" width="192" height="54" rx="5" fill="#fffdf7" fill-opacity="0.92" stroke="#7c6928"/><text x="360" y="82" font-size="11.2" font-weight="700" fill="#3d3312" text-anchor="middle">ALTITUDE TARGET PSI</text><text x="360" y="96" font-size="11.2" font-weight="700" fill="#3d3312" text-anchor="middle">Hold steady 240°F+</text><rect x="484" y="58" width="194" height="58" rx="5" fill="#fffdf7" fill-opacity="0.88" stroke="#8f381c"/><text x="581" y="82" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">SEALED LOW-ACID JARS</text><text x="581" y="96" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">Botulinum spores</text><text x="581" y="110" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">destroyed</text><rect x="34" y="138" width="652" height="19" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360" y="151" font-size="10.8" font-weight="650" fill="#642e1e" text-anchor="middle">Skipping the 10-minute vent leaves cool air pockets &amp; under-processed jars</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Clear vent pipe -&gt; 10</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">MIN FULL STEAM VENT</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Apply weight -&gt; reach</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">altitude-adjusted PSI</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Hold steady PSI full</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">time; avoid swings</text></g>
  </g>
</svg>
