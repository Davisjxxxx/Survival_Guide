<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Position a breathing unresponsive patient in a stable recovery posture</title>
  <desc id="desc">CONCEPTUAL ORIENTATION &amp; ZONE GUIDE: Confirm normal breath &amp; no spine risk | Roll gently onto side; drain airway | Insulate &amp; monitor breathing continuously — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z10-P10 · CONCEPTUAL ORIENTATION &amp; ZONE GUIDE (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="anatomy-zone-airway_bleed-artwork"><rect x="28" y="42" width="176" height="94" rx="8" fill="#e6eee8" stroke="#285345" stroke-width="2.4"/><circle cx="116" cy="60" r="11" fill="#fffdf7" stroke="#184438" stroke-width="2.2"/><rect x="96" y="75" width="40" height="36" rx="8" fill="#cde0d4" stroke="#184438" stroke-width="2.2"/><path d="M96 84L72 104M136 84l24 20M106 111v20M126 111v20" stroke="#184438" stroke-width="3" stroke-linecap="round"/><circle cx="136" cy="92" r="5" fill="#8f381c"/><rect x="218" y="42" width="474" height="27" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="218" y="42" width="26" height="27" rx="4" fill="#184438"/><text x="231" y="60" font-size="11" font-weight="650" fill="#fffdf7" text-anchor="middle">1</text><text x="254" y="60" font-size="11.2" font-weight="650" fill="#183c31" text-anchor="start">Verify normal rhythmic breathing &amp; zero suspected spinal trauma</text><rect x="218" y="74" width="474" height="27" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="218" y="74" width="26" height="27" rx="4" fill="#184438"/><text x="231" y="92" font-size="11" font-weight="650" fill="#fffdf7" text-anchor="middle">2</text><text x="254" y="92" font-size="11.2" font-weight="650" fill="#183c31" text-anchor="start">Roll smoothly onto side with top knee bent forward for stability</text><rect x="218" y="106" width="474" height="27" rx="5" fill="#f9faef" stroke="#4f6c5d" stroke-width="1.8"/><rect x="218" y="106" width="26" height="27" rx="4" fill="#184438"/><text x="231" y="124" font-size="11" font-weight="650" fill="#fffdf7" text-anchor="middle">3</text><text x="254" y="124" font-size="11.2" font-weight="650" fill="#183c31" text-anchor="start">Angle mouth slightly downward to drain fluids; insulate from ground</text><rect x="28" y="139" width="324" height="18" rx="4" fill="#dceadf" stroke="#184438"/><text x="190" y="152" font-size="10.5" font-weight="650" fill="#183c31" text-anchor="middle">Side posture keeps airway open &amp; draining</text><rect x="364" y="139" width="328" height="18" rx="4" fill="#faeee5" stroke="#a05332"/><text x="528" y="152" font-size="10.5" font-weight="650" fill="#642e1e" text-anchor="middle">Breathing stops -&gt; roll back &amp; start CPR</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Confirm normal breath &amp;</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">no spine risk</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Roll gently onto side;</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">drain airway</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Insulate &amp; monitor</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">breathing continuously</text></g>
  </g>
</svg>
