<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Account for children, older adults, disabilities, and pets in every plan</title>
  <desc id="desc">COMPARATIVE CONFIGURATION: Buddy plans + spare Rx/mobility/hearing | Carriers, tags &amp; food staged for ALL pets | Leave EARLY when access needs add time — Conceptual illustration, not to scale.</desc>
