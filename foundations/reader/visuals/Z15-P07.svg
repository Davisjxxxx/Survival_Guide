ines &amp; 7-d</text><text x="492" y="112" font-size="11.5" font-weight="600" fill="#183c31" text-anchor="start">food/H2O</text><rect x="490" y="122" width="192" height="20" rx="4" fill="#faeee5" stroke="#a05332"/><text x="586.0" y="136" font-size="10" font-weight="650" fill="#7a2f15" text-anchor="middle">Never leave chained</text></g>
