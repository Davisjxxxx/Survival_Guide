<svg class="v01-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">External chemical incident versus internal CO or gas</title><desc id="desc">Two panels show authorities managing an external plume and immediate exit during an indoor carbon monoxide or gas hazard.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
<path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker></defs>
<style>.v01-svg text{font-family:system-ui,sans-serif;font-size:24px;font-weight:650;fill:#183a30}
.v01-svg .heading{font-size:21px;letter-spacing:1px;font-weight:750}.v01-svg .guard{font-size:23px;fill:#6d301f}
.v01-svg .leader{fill:none;stroke:#365c50;stroke-width:3}.v01-svg .flow{fill:none;stroke:#205b68;stroke-width:5;marker-end:url(#arrow)}
.v01-svg .dashed{fill:none;stroke:#365c50;stroke-width:3;stroke-dasharray:12 9}</style>
<rect x="1" y="1" width="898" height="393" rx="16" fill="#f4f6ed" stroke="#99ad9b" stroke-width="2"/>
<text class="heading" x="26" y="37">Z15-P48 · V01 TECHNICAL ILLUSTRATION · NOT TO SCALE</text>
<g id="v01-artwork"><rect x="30" y="84" width="405" height="228" rx="12" fill="#dce8de" stroke="#244f42" stroke-width="3"/><rect x="465" y="84" width="405" height="228" rx="12" fill="#f1dfd2" stroke="#244f42" stroke-width="3"/><text x="52" y="118">External chemical release</text><text x="486" y="118">Internal gas or CO</text><path d="M222 216v-55l50-30 53 34v51zM500 221v-55l54-30 50 33v52z" fill="#f8f4e8" stroke="#254f41" stroke-width="4"/><path d="M61 156q39-31 64 0q33-17 52 9q-4 22-46 21H73z" fill="#9185a2" stroke="#514a66" stroke-width="4"/><path class="flow" d="M619 193h169"/><text x="54" y="254">Follow official room,</text><text x="54" y="286">ventilation and exit advice.</text><text x="489" y="254">Leave immediately.</text><text x="489" y="286">Call from safety.</text></g>
<rect x="23" y="342" width="854" height="38" rx="7" fill="#f7e4d8"/>
<text class="guard" x="36" y="369">Identify the situation before borrowing a shelter procedure.</text>
