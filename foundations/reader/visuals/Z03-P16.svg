<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Gather dead and downed wood lawfully without damaging live trees</title>
  <desc id="desc">ENVIRONMENTAL RELATIONSHIP: Verify unit wood rules | Use dead downed sticks only | Protect live trees &amp; habitat — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z03-P16 · ENVIRONMENTAL RELATIONSHIP (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="environment-artwork"><path d="M28 144h664" stroke="#7d8a68" stroke-width="5"/><path d="M44 74h120M44 98h105" stroke="#4b7c90" stroke-width="4" marker-end="url(#arrow)"/><path d="M220 144V58l-28 24h56Z" fill="#6e7c5a" stroke="#315245" stroke-width="2.5"/><path d="M235 64l95 52" stroke="#a05332" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M510 144l45-42 45 42Z" fill="#285345"/><rect x="40" y="122" width="190" height="22" rx="4" fill="#faeee5" stroke="#a05332"/><text x="135" y="137" font-size="10.5" font-weight="650" fill="#7a2f15" text-anchor="middle">Live trees / snags (leave)</text><rect x="265" y="122" width="190" height="22" rx="4" fill="#f7f4e9" stroke="#73877b"/><text x="360" y="137" font-size="10.5" font-weight="650" fill="#183c31" text-anchor="middle">Lawful downed dead sticks</text><rect x="490" y="122" width="190" height="22" rx="4" fill="#dceadf" stroke="#184438"/><text x="585" y="137" font-size="10.5" font-weight="650" fill="#183c31" text-anchor="middle">Designated park ring</text><text x="360" y="56" font-size="11.5" font-weight="650" fill="#2b5566" text-anchor="middle">Verify unit gathering rules &amp; certified local firewood laws</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Verify unit wood rules</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Use dead downed sticks</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">only</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Protect live trees &amp;</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">habitat</text></g>
  </g>
