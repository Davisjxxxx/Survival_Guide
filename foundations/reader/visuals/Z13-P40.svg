<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Protect private wellheads from snowmelt, runoff, fuel, and septic drainage</title>
  <desc id="desc">SYSTEM SEPARATION &amp; BOUNDARY: Intact sealed cap well above grade | Slope soil away; mark tall for plows | Keep fuel, salt &amp; septic far downslope — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z13-P40 · SYSTEM SEPARATION &amp; BOUNDARY (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="system-boundary-well_septic-artwork"><path d="M30 84L260 88L460 112L690 116V134H30Z" fill="#c9d5b8" stroke="#4f6549" stroke-width="2.2"/><rect x="92" y="46" width="22" height="82" fill="#d3e3ea" stroke="#184438" stroke-width="2.5"/><path d="M360 44v90" stroke="#8f381c" stroke-width="3.5" stroke-dasharray="7 5"/><rect x="492" y="92" width="170" height="32" rx="5" fill="#d9c6b0" stroke="#8f381c" stroke-width="2.2"/><rect x="42" y="58" width="194" height="58" rx="5" fill="#fffdf7" fill-opacity="0.88" stroke="#184438"/><text x="139" y="82" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">ELEVATED WELLHEAD</text><text x="139" y="96" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">Sealed sanitary cap +</text><text x="139" y="110" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">tall marker</text><rect x="264" y="60" width="192" height="54" rx="5" fill="#fffdf7" fill-opacity="0.92" stroke="#7c6928"/><text x="360" y="82" font-size="11.2" font-weight="700" fill="#3d3312" text-anchor="middle">UPSLOPE SETBACK Soil</text><text x="360" y="96" font-size="11.2" font-weight="700" fill="#3d3312" text-anchor="middle">grades away</text><rect x="484" y="58" width="194" height="58" rx="5" fill="#fffdf7" fill-opacity="0.88" stroke="#8f381c"/><text x="581" y="82" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">RUNOFF &amp; SEPTIC Fuel,</text><text x="581" y="96" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">salt, manure,</text><text x="581" y="110" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">drainfield</text><rect x="34" y="138" width="652" height="19" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360" y="151" font-size="10.8" font-weight="650" fill="#642e1e" text-anchor="middle">A snowplow-cracked well casing opens a direct path for surface bacteria</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Intact sealed cap well</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">above grade</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Slope soil away; mark</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">tall for plows</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Keep fuel, salt &amp; septic</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">far downslope</text></g>
  </g>
</svg>
