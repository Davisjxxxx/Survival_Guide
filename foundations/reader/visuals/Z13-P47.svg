<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Protect residential septic systems during electrical outages</title>
  <desc id="desc">SYSTEM SEPARATION &amp; BOUNDARY: Know gravity vs pump-assisted septic | Cut showers/laundry/flushes in blackout | Never park or plow snow over drainfield — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z13-P47 · SYSTEM SEPARATION &amp; BOUNDARY (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="system-boundary-well_septic-artwork"><path d="M30 84L260 88L460 112L690 116V134H30Z" fill="#c9d5b8" stroke="#4f6549" stroke-width="2.2"/><rect x="92" y="46" width="22" height="82" fill="#d3e3ea" stroke="#184438" stroke-width="2.5"/><path d="M360 44v90" stroke="#8f381c" stroke-width="3.5" stroke-dasharray="7 5"/><rect x="492" y="92" width="170" height="32" rx="5" fill="#d9c6b0" stroke="#8f381c" stroke-width="2.2"/><rect x="42" y="58" width="194" height="58" rx="5" fill="#fffdf7" fill-opacity="0.88" stroke="#184438"/><text x="139" y="82" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">HOME PLUMBING Pause</text><text x="139" y="96" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">laundry, showers &amp;</text><text x="139" y="110" font-size="11.2" font-weight="700" fill="#183c31" text-anchor="middle">flushes</text><rect x="264" y="60" width="192" height="54" rx="5" fill="#fffdf7" fill-opacity="0.92" stroke="#7c6928"/><text x="360" y="82" font-size="11.2" font-weight="700" fill="#3d3312" text-anchor="middle">LIFT-PUMP OUTAGE</text><text x="360" y="96" font-size="11.2" font-weight="700" fill="#3d3312" text-anchor="middle">Limited reserve tank</text><rect x="484" y="58" width="194" height="58" rx="5" fill="#fffdf7" fill-opacity="0.88" stroke="#8f381c"/><text x="581" y="82" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">SEPTIC &amp; DRAINFIELD No</text><text x="581" y="96" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">cars or snowplows</text><text x="581" y="110" font-size="11.2" font-weight="700" fill="#642e1e" text-anchor="middle">above</text><rect x="34" y="138" width="652" height="19" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360" y="151" font-size="10.8" font-weight="650" fill="#642e1e" text-anchor="middle">High indoor water use on a dead septic lift pump backs raw sewage into basements</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Know gravity vs pump-</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">assisted septic</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Cut</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">showers/laundry/flushes</text><text x="265" y="218" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">in blackout</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Never park or plow snow</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">over drainfield</text></g>
  </g>
</svg>
