  <title id="title">Flower Symmetry, Inflorescence Types and Apiaceae Umbel Stop Rule</title>
  <desc id="desc">BOTANICAL DIAGNOSTIC MORPHOLOGY: Identify radial vs bilateral flowers | Flag compound umbel clusters | Enforce Apiaceae hemlock stop rule — Conceptual illustration, not to scale.</desc>
