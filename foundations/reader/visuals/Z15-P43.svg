<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Manage multi-day electrical outages safely without indoor combustion or fires</title>
  <desc id="desc">TIME / SEASONAL PROGRESSION: LED low-mode, shut cold doors &amp; unplug surges | Zero indoor gens/stoves/ovens EVERY day | Track daily temp &amp; reserves; move early — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z15-P43 · TIME / SEASONAL PROGRESSION (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="seasonal-timeline-outage_30d-artwork"><path d="M36 62h644" stroke="#184438" stroke-width="4" marker-end="url(#arrow)"/><circle cx="106.0" cy="62" r="8" fill="#184438" stroke="#fffdf7" stroke-width="2"/><text x="106.0" y="48" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Hour 1</text><rect x="28" y="76" width="156" height="58" rx="6" fill="#d5e5dc" stroke="#315245" stroke-width="2"/><text x="106.0" y="98" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">LEDs (no candles),</text><text x="106.0" y="112" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">shut cold doors,</text><text x="106.0" y="126" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">unplug</text><circle cx="274.0" cy="62" r="8" fill="#184438" stroke="#fffdf7" stroke-width="2"/><text x="274.0" y="48" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Days 1–2</text><rect x="196" y="76" width="156" height="58" rx="6" fill="#e4ebd4" stroke="#315245" stroke-width="2"/><text x="274.0" y="98" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Cold-food triage;</text><text x="274.0" y="112" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">outdoor-only ≥20 ft</text><text x="274.0" y="126" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">gen</text><circle cx="442.0" cy="62" r="8" fill="#184438" stroke="#fffdf7" stroke-width="2"/><text x="442.0" y="48" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Days 3–7</text><rect x="364" y="76" width="156" height="58" rx="6" fill="#f4ebd2" stroke="#315245" stroke-width="2"/><text x="442.0" y="98" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Daily temp/reserve</text><text x="442.0" y="112" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">log; zero indoor</text><text x="442.0" y="126" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">fuel</text><circle cx="610.0" cy="62" r="8" fill="#184438" stroke="#fffdf7" stroke-width="2"/><text x="610.0" y="48" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Exit Gate</text><rect x="532" y="76" width="156" height="58" rx="6" fill="#f5dfd5" stroke="#315245" stroke-width="2"/><text x="610.0" y="98" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">Relocate early if</text><text x="610.0" y="112" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">cold/heat/meds hit</text><text x="610.0" y="126" font-size="11" font-weight="650" fill="#183c31" text-anchor="middle">floor</text><rect x="28" y="139" width="664" height="18" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360" y="152" font-size="10.8" font-weight="650" fill="#642e1e" text-anchor="middle">Fatigue on Day 4 NEVER excuses pulling a generator into a garage or porch</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">LED low-mode, shut cold</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">doors &amp; unplug surges</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Zero indoor</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">gens/stoves/ovens EVERY</text><text x="265" y="218" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">day</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Track daily temp &amp;</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">reserves; move early</text></g>
  </g>
</svg>
