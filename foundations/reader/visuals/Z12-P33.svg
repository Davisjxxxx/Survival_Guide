<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Pull completely off roadways with lights off during blinding desert dust storms</title>
  <desc id="desc">FAILURE-MODE ANALYSIS: Pull COMPLETELY off highway | Foot off brake; ALL lights OFF | Wait belted inside until dust clears — Conceptual illustration, not to scale.</desc>
