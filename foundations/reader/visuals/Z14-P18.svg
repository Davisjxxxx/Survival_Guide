<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Understand open-pollinated vs hybrid seeds and dry seed-saving limits</title>
  <desc id="desc">COMPARATIVE CONFIGURATION: Save ONLY open-pollinated (not F1 hybrid) | Start with self-pollinating beans/peas/tomato | Cool-dry fully; test germination pre-spring — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z14-P18 · COMPARATIVE CONFIGURATION (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="comparison-artwork"><rect x="30" y="44" width="208" height="104" rx="8" fill="#dce8df" stroke="#315245" stroke-width="2.5"/><rect x="30" y="44" width="208" height="24" rx="6" fill="#285345"/><text x="134.0" y="60" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">Easy Self-Pollinate</text><text x="40" y="84" font-size="11.5" font-weight="600" fill="#183c31" text-anchor="start">OP peas, beans,</text><text x="40" y="98" font-size="11.5" font-weight="600" fill="#183c31" text-anchor="start">lettuce &amp; heirloom</text><text x="40" y="112" font-size="11.5" font-weight="600" fill="#183c31" text-anchor="start">tomato</text><rect x="38" y="122" width="192" height="20" rx="4" fill="#faeee5" stroke="#a05332"/><text x="134.0" y="136" font-size="10" font-weight="650" fill="#7a2f15" text-anchor="middle">Grows true cleanly</text><rect x="256" y="44" width="208" height="104" rx="8" fill="#e5e9d5" stroke="#315245" stroke-width="2.5"/><rect x="256" y="44" width="208" height="24" rx="6" fill="#285345"/><text x="360.0" y="60" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">Cross-Pollinators</text><text x="266" y="84" font-size="11.5" font-weight="600" fill="#183c31" text-anchor="start">Squash, corn &amp;</text><text x="266" y="98" font-size="11.5" font-weight="600" fill="#183c31" text-anchor="start">brassicas cross easily</text><rect x="264" y="122" width="192" height="20" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360.0" y="136" font-size="10" font-weight="650" fill="#7a2f15" text-anchor="middle">Never eat bitter squash</text><rect x="482" y="44" width="208" height="104" rx="8" fill="#e4e8ee" stroke="#315245" stroke-width="2.5"/><rect x="482" y="44" width="208" height="24" rx="6" fill="#285345"/><text x="586.0" y="60" font-size="11.5" font-weight="650" fill="#fffdf7" text-anchor="middle">F1 Hybrids</text><text x="492" y="84" font-size="11.5" font-weight="600" fill="#183c31" text-anchor="start">Safe to grow but</text><text x="492" y="98" font-size="11.5" font-weight="600" fill="#183c31" text-anchor="start">traits split</text><text x="492" y="112" font-size="11.5" font-weight="600" fill="#183c31" text-anchor="start">unpredictably</text><rect x="490" y="122" width="192" height="20" rx="4" fill="#faeee5" stroke="#a05332"/><text x="586.0" y="136" font-size="10" font-weight="650" fill="#7a2f15" text-anchor="middle">Not true-to-type</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Save ONLY open-</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">pollinated (not F1</text><text x="32" y="218" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">hybrid)</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Start with self-</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">pollinating</text><text x="265" y="218" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">beans/peas/tomato</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Cool-dry fully; test</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">germination pre-spring</text></g>
  </g>
</svg>
