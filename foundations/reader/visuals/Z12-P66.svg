<svg class="v02-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">Cold-water HELP and group HUDDLE heat-preservation postures</title><desc id="desc">Two floating profiles wearing buckled USCG life jackets: solo Heat Escape Lessening Posture (knees drawn tight to chest) and multi-person HUDDLE keeping torsos pressed close.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#205b68"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#972f22"/></marker><marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183a30"/></marker></defs>
<style>.v02-svg text{font-family:system-ui,sans-serif;font-size:19px;font-weight:650;fill:#183a30}.v02-svg .sm{font-size:16.5px;font-weight:600;fill:#2b473e}.v02-svg .warn{font-size:18.5px;font-weight:700;fill:#8c281b}.v02-svg .heading{font-size:19px;letter-spacing:0.8px;font-weight:750;fill:#183a30}.v02-svg .guard{font-size:15.5px;font-weight:650;fill:#6d301f}.v02-svg .leader{fill:none;stroke:#365c50;stroke-width:2.5}.v02-svg .flow{fill:none;stroke:#205b68;stroke-width:4;marker-end:url(#arr)}.v02-svg .rflow{fill:none;stroke:#972f22;stroke-width:4;marker-end:url(#arr-r)}.v02-svg .gflow{fill:none;stroke:#183a30;stroke-width:3.5;marker-end:url(#arr-g)}.v02-svg .dash{fill:none;stroke:#365c50;stroke-width:2.5;stroke-dasharray:10 7}</style>
<rect x="1" y="1" width="898" height="393" rx="16" fill="#f4f6ed" stroke="#99ad9b" stroke-width="2"/>
<text class="heading" x="26" y="34">Z12-P66 · V02 TECHNICAL ILLUSTRATION · NOT TO SCALE</text>
<g id="v02-artwork">
    <!-- Water horizon -->
    <rect x="45" y="178" width="810" height="132" fill="#8ec2d4" stroke="#205b68" stroke-width="3"/>
    <!-- Left: Solo HELP posture -->
    <circle cx="235" cy="158" r="24" fill="#e4c7a5" stroke="#684b35" stroke-width="3"/>
    <rect x="208" y="184" width="54" height="58" rx="12" fill="#d97236" stroke="#6d301f" stroke-width="3.5"/>
    <path d="M235 242Q278 270 296 228Q278 206 254 226" fill="none" stroke="#183a30" stroke-width="14" stroke-linecap="round"/>
    <text x="92" y="92">Solo: HELP posture (with PFD)</text>
    <text class="sm" x="85" y="120">Arms crossed · knees high · keep still</text>
    <!-- Right: Group HUDDLE -->
    <circle cx="605" cy="158" r="22" fill="#e4c7a5" stroke="#684b35" stroke-width="3"/>
    <circle cx="655" cy="154" r="22" fill="#e4c7a5" stroke="#684b35" stroke-width="3"/>
    <circle cx="705" cy="158" r="22" fill="#e4c7a5" stroke="#684b35" stroke-width="3"/>
    <rect x="582" y="182" width="146" height="68" rx="18" fill="#d97236" stroke="#6d301f" stroke-width="3.5"/>
    <text x="515" y="92">Group: HUDDLE posture (with PFDs)</text>
    <text class="sm" x="510" y="120">Interlock arms · press chests · kids centered</text>
    <text class="sm" x="155" y="294">Protects armpits, sides &amp; groin from rapid cold-water heat loss</text>
    </g>
<rect x="23" y="344" width="854" height="36" rx="7" fill="#f7e4d8"/>
<text class="guard" x="36" y="369">Wear a buckled USCG-approved PFD afloat; stay with a buoyant hull instead of long cold swims.</text>
</svg>
