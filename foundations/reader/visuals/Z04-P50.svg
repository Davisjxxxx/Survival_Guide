<text x="248" y="320" class="tiny">brittle plastic</text>
<path d="M368 292V263.2Q368 258.4 375.4 256.8V252H383.4V256.8Q392.8 258.4 392.8 263.2V292Z" fill="#eef2f3" stroke="#183a30" stroke-width="2.2"/>
<text x="356" y="320" class="tiny">off odour</text>
<path d="M64 296q-4 7 0 10q4-3 0-10z" fill="#3d7186"/><path d="M160 250q14-10 28 0" fill="none" stroke="#8b3825" stroke-width="2.4"/><path d="M268 262l8 10-6 8 8 10" fill="none" stroke="#8b3825" stroke-width="2"/><path d="M394 248q6-8 0-16M402 248q6-8 0-16" fill="none" stroke="#6b7f8c" stroke-width="2"/>
<rect x="456" y="206" width="420" height="130" rx="10" fill="#e7f0ea" stroke="#7ea08d" stroke-width="1.6"/>
<text x="472" y="232" class="head ok">✓ STORE AND STAGE</text>
<rect x="478" y="244" width="12" height="56" rx="6" fill="#ffffff" stroke="#183a30" stroke-width="2"/><rect x="481" y="270" width="6" height="28" fill="#3d7186"/>
<text x="498" y="262" class="tiny">50 to 70 °F, dark,</text>
<text x="498" y="283" class="tiny">away from fuel</text>
<rect x="634" y="262" width="56" height="54" rx="10" fill="#7a8f6d" stroke="#183a30" stroke-width="2"/><rect x="646" y="250" width="12" height="16" rx="2" fill="#cfe6ef" stroke="#183a30" stroke-width="1.4"/><rect x="664" y="250" width="12" height="16" rx="2" fill="#cfe6ef" stroke="#183a30" stroke-width="1.4"/>
<text x="700" y="282" class="tiny">portable portion</text>
<text x="700" y="303" class="tiny">for evacuation</text>
<rect x="24" y="345" width="852" height="32" rx="4" fill="#f7e5d9"/>
<text x="37" y="367" class="small">Leaking, sun-degraded or chemically exposed container: replace it; do not trust the water.</text>
</g>
</svg>
