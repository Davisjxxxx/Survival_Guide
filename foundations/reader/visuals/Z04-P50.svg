<text x="40" y="232" class="head warn">✕ REPLACE THE CONTAINER IF</text>
<path d="M54 292V263.2Q54 258.4 61.4 256.8V252H69.4V256.8Q78.8 258.4 78.8 263.2V292Z" fill="#eef2f3" stroke="#183a30" stroke-width="2.2"/>
<text x="42" y="320" class="tiny">leaking</text>
