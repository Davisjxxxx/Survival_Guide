<g data-refill-month="0" transform="translate(59.0 104)"><path d="M0 40V11.2Q0 6.4 7.4 4.8V0H15.4V4.8Q24.8 6.4 24.8 11.2V40Z" fill="#cfe6ef" stroke="#183a30" stroke-width="2.2"/></g>
<path d="M163.0 155v10" stroke="#183a30" stroke-width="1.6"/>
<path d="M256.0 155v10" stroke="#183a30" stroke-width="1.6"/>
<text x="256" y="184" class="tiny" text-anchor="middle">6 mo</text>
<g data-refill-month="6" transform="translate(245.0 104)"><path d="M0 40V11.2Q0 6.4 7.4 4.8V0H15.4V4.8Q24.8 6.4 24.8 11.2V40Z" fill="#cfe6ef" stroke="#183a30" stroke-width="2.2"/></g>
<path d="M349.0 155v10" stroke="#183a30" stroke-width="1.6"/>
<path d="M442.0 155v10" stroke="#183a30" stroke-width="1.6"/>
<text x="442" y="184" class="tiny" text-anchor="middle">12 mo</text>
<g data-refill-month="12" transform="translate(431.0 104)"><path d="M0 40V11.2Q0 6.4 7.4 4.8V0H15.4V4.8Q24.8 6.4 24.8 11.2V40Z" fill="#cfe6ef" stroke="#183a30" stroke-width="2.2"/></g>
<path d="M535.0 155v10" stroke="#183a30" stroke-width="1.6"/>
<path d="M628.0 155v10" stroke="#183a30" stroke-width="1.6"/>
<text x="628" y="184" class="tiny" text-anchor="middle">18 mo</text>
<g data-refill-month="18" transform="translate(617.0 104)"><path d="M0 40V11.2Q0 6.4 7.4 4.8V0H15.4V4.8Q24.8 6.4 24.8 11.2V40Z" fill="#cfe6ef" stroke="#183a30" stroke-width="2.2"/></g>
<path d="M721.0 155v10" stroke="#183a30" stroke-width="1.6"/>
<path d="M814.0 155v10" stroke="#183a30" stroke-width="1.6"/>
<text x="814" y="184" class="tiny" text-anchor="middle">24 mo</text>
<g data-refill-month="24" transform="translate(803.0 104)"><path d="M0 40V11.2Q0 6.4 7.4 4.8V0H15.4V4.8Q24.8 6.4 24.8 11.2V40Z" fill="#cfe6ef" stroke="#183a30" stroke-width="2.2"/></g>
<text x="560" y="92" class="tiny">commercial bottles: printed date</text>
