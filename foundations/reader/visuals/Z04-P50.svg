<rect x="24" y="46" width="852" height="150" rx="10" fill="#f7f7ef" stroke="#a9b6aa" stroke-width="1.6"/>
<text x="40" y="72" class="head">SELF-FILLED WATER: REPLACE EVERY 6 MONTHS</text>
