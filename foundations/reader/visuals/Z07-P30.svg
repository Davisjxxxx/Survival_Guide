" y="105" font-size="10.5" font-weight="650" fill="#642e1e" text-anchor="middle">release</text><rect x="30" y="139" width="660" height="18" rx="4" fill="#faeee5" stroke="#a05332"/><text x="360" y="152" font-size="10.8" font-weight="650" fill="#642e1e" text-anchor="middle">HOLD: Z07 requires qualified wildlife, legal &amp; welfare sign-off</text></g>
