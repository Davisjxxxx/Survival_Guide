<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Escalating Unresolved Legal, Welfare and Safety Questions</title>
  <desc id="desc">CARE / ESCALATION LADDER: Identify uncertain legal/welfare issue | Keep operational action on HOLD | Consult governing agency or specialist — Conceptual illustration, not to scale.</desc>
