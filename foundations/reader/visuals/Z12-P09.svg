<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Stage a winter vehicle emergency kit and stranded-blizzard response</title>
  <desc id="desc">EXPLODED COMPONENTS: Cabin blankets, shovel &amp; light | Stay w/ safe vehicle &amp; call 911 | Keep tailpipe clear; zero CO sleep — Conceptual illustration, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285345"/></marker>
  </defs>
  <rect width="720" height="242" rx="12" fill="#edf1e9"/>
  <g font-family="system-ui,sans-serif" font-size="14.5" font-weight="650" fill="#183c31">
    <text x="20" y="23" font-size="14" font-weight="700" fill="#183c31" text-anchor="start">Z12-P09 · EXPLODED COMPONENTS (CONCEPTUAL, NOT TO SCALE)</text>
    <g id="exploded-artwork"><path d="M55 96h610" stroke="#7c8f83" stroke-width="2" stroke-dasharray="7 5"/><rect x="50" y="58" width="129" height="74" rx="8" fill="#d5e2d8" stroke="#285345" stroke-width="2.5"/><rect x="60" y="48" width="36" height="10" rx="3" fill="#6b8577"/><circle cx="165" cy="72" r="5" fill="#285345"/><text x="114.5" y="85" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Cabin Blankets &amp;</text><text x="114.5" y="100" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Boots</text><path d="M182 95h18" stroke="#285345" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="205" y="58" width="129" height="74" rx="8" fill="#e8dfbe" stroke="#285345" stroke-width="2.5"/><rect x="215" y="48" width="36" height="10" rx="3" fill="#6b8577"/><circle cx="320" cy="72" r="5" fill="#285345"/><text x="269.5" y="92" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Shovel &amp; Scraper</text><path d="M337 95h18" stroke="#285345" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="360" y="58" width="129" height="74" rx="8" fill="#cde0e8" stroke="#285345" stroke-width="2.5"/><rect x="370" y="48" width="36" height="10" rx="3" fill="#6b8577"/><circle cx="475" cy="72" r="5" fill="#285345"/><text x="424.5" y="85" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Bright Mirror</text><text x="424.5" y="100" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Cloth</text><path d="M492 95h18" stroke="#285345" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="515" y="58" width="129" height="74" rx="8" fill="#dfd4c7" stroke="#285345" stroke-width="2.5"/><rect x="525" y="48" width="36" height="10" rx="3" fill="#6b8577"/><circle cx="630" cy="72" r="5" fill="#285345"/><text x="579.5" y="85" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Clear Tailpipe</text><text x="579.5" y="100" font-size="12" font-weight="650" fill="#183c31" text-anchor="middle">Check</text><text x="360" y="149" font-size="11" font-weight="650" fill="#4c5f55" text-anchor="middle">Stay with safe stranded vehicle; NEVER sleep with idling engine</text></g>
    <g id="stage-panels"><rect x="20" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="32" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Cabin blankets, shovel &amp;</text><text x="32" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">light</text><rect x="253" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="265" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Stay w/ safe vehicle &amp;</text><text x="265" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">call 911</text><rect x="486" y="162" width="212" height="62" rx="7" fill="#f9faef" stroke="#90a595"/><text x="498" y="182" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">Keep tailpipe clear;</text><text x="498" y="200" font-size="14.5" font-weight="650" fill="#183c31" text-anchor="start">zero CO sleep</text></g>
  </g>
